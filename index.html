<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B3FA8">
<title>JW Mainframe</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --fondo: #FFFFFF; --tarjeta: #F6F4FB; --texto: #1B1730; --gris: #6B6680; --linea: #DDD8EA; --violeta: #5B3FA8; --rojo: #B3261E; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #000000; --tarjeta: #121118; --texto: #F1EEFA; --gris: #A29CB8; --linea: #2A2738; --violeta: #9B82E0; --rojo: #FF8A80; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--texto); font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .tarjeta { width: 100%; max-width: 380px; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 18px; padding: 26px 22px; }
  .logo { display: block; width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 12px; }
  h1 { font-size: 21px; margin: 0; text-align: center; }
  .sub { font-size: 11.5px; letter-spacing: .08em; color: var(--gris); text-align: center; margin: 4px 0 20px; }
  p { font-size: 14px; line-height: 1.45; color: var(--gris); margin: 0 0 14px; }
  .campo { position: relative; margin-bottom: 12px; }
  input[type=password], input[type=text] { width: 100%; font: inherit; font-size: 16px; color: var(--texto); background: var(--fondo); border: 1px solid var(--linea); border-radius: 12px; padding: 13px 76px 13px 14px; }
  input:focus { outline: 2px solid var(--violeta); outline-offset: 1px; }
  .ver { position: absolute; right: 6px; top: 6px; bottom: 6px; border: 0; background: none; color: var(--violeta); font: inherit; font-size: 14px; font-weight: 600; padding: 0 10px; cursor: pointer; }
  button.boton { width: 100%; font: inherit; font-size: 16px; font-weight: 600; border-radius: 12px; padding: 13px; cursor: pointer; border: 1px solid var(--violeta); background: var(--violeta); color: #fff; margin-bottom: 10px; }
  @media (prefers-color-scheme: dark) { button.boton { color: #0B0816; } }
  button.boton.sec { background: transparent; color: var(--violeta); }
  button.boton:disabled { opacity: .6; cursor: default; }
  .marca { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--texto); margin: 2px 0 14px; cursor: pointer; }
  .marca input { width: 20px; height: 20px; accent-color: var(--violeta); }
  .o { text-align: center; font-size: 12.5px; color: var(--gris); margin: 4px 0 12px; }
  .msg { min-height: 20px; font-size: 14px; color: var(--rojo); text-align: center; margin: 0 0 8px; }
  .enlace { display: block; width: 100%; border: 0; background: none; color: var(--gris); font: inherit; font-size: 13px; text-decoration: underline; padding: 8px; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>

<script>
(function () {
  if (window.PUERTA) return;
  var AREA = 'jw';
  var K = { ult: 'vgt-' + AREA, ses: 'vgk-' + AREA, rec: 'vgr-' + AREA, bio: 'vgb-' + AREA, no: 'vgn-' + AREA, min: 'vgm-' + AREA };
  var MIN_BASE = 1;
  var enc = new TextEncoder(), dec = new TextDecoder();
  var SAL_PRF = enc.encode('jw-mainframe-prf-v1');

  function aB64(buf) { var b = new Uint8Array(buf), s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function deB64(t) { return Uint8Array.from(atob(t), function (c) { return c.charCodeAt(0); }); }
  function azar(n) { return crypto.getRandomValues(new Uint8Array(n)); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

  /* Cifrado del contenido */
  async function derivar(clave, d) {
    var base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveKey']);
    var k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: deB64(d.s), iterations: d.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    return aB64(await crypto.subtle.exportKey('raw', k));
  }
  async function abrir(llave, d) {
    var k = await crypto.subtle.importKey('raw', deB64(llave), 'AES-GCM', false, ['decrypt']);
    return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(d.i) }, k, deB64(d.c)));
  }

  /* Sesión y recuerdo en el dispositivo */
  function llave() { return ssGet(K.ses); }
  function guardarSesion(l) { ssSet(K.ses, l); marcar(); }
  function recordado() { return lsGet(K.rec); }
  function recordar(si, l) { if (si) lsSet(K.rec, l || llave() || ''); else lsDel(K.rec); }
  function olvidar() { ssDel(K.ses); lsDel(K.rec); }
  function olvidarSesion() { ssDel(K.ses); }
  function marcar() { lsSet(K.ult, String(Date.now())); }
  function ultimo() { return parseInt(lsGet(K.ult), 10) || 0; }
  function minutos() { var n = parseInt(lsGet(K.min), 10); return isNaN(n) ? MIN_BASE : n; }
  function fijarMinutos(n) { lsSet(K.min, String(n)); }
  function vencida(desde) { var m = minutos(); return !recordado() && m > 0 && Date.now() - desde > m * 60000; }
  function cerrar() { olvidar(); location.reload(); }

  /* Huella o Face ID */
  async function huellaDisponible() {
    try { return !!window.PublicKeyCredential && !!navigator.credentials && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
    catch (e) { return false; }
  }
  function registro() { try { return JSON.parse(lsGet(K.bio)); } catch (e) { return null; } }
  function quitarHuella() { lsDel(K.bio); }
  function noPreguntar(si) { if (si) lsSet(K.no, '1'); else lsDel(K.no); }
  function noPreguntarActivo() { return !!lsGet(K.no); }
  async function envoltura(secreto) {
    var base = await crypto.subtle.importKey('raw', secreto, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: enc.encode('vg-envoltura') }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  function secretoDe(cred) {
    var e = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
    return e.prf && e.prf.results && e.prf.results.first ? e.prf.results.first : null;
  }
  async function pedirSecreto(id) {
    var cred = await navigator.credentials.get({ publicKey: {
      challenge: azar(32), allowCredentials: [{ type: 'public-key', id: deB64(id) }], userVerification: 'required', timeout: 60000,
      extensions: { prf: { eval: { first: SAL_PRF } } }
    } });
    return secretoDe(cred);
  }

  async function registrarHuella(l) {
    var cred = await navigator.credentials.create({ publicKey: {
      challenge: azar(32),
      rp: { name: 'JW Mainframe', id: location.hostname },
      user: { id: azar(16), name: 'jw-mainframe', displayName: 'JW Mainframe' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      attestation: 'none', timeout: 60000,
      extensions: { prf: { eval: { first: SAL_PRF } } }
    } });
    var id = aB64(cred.rawId), secreto = secretoDe(cred), e = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};

      lsSet(K.bio, JSON.stringify({ id: id, m: 'prf', iv: aB64(iv), k: aB64(ct) }));
      return 'prf';
    }
    lsSet(K.bio, JSON.stringify({ id: id, m: 'basico', k: l }));
    return 'basico';
  }
  async function entrarConHuella() {
    var r = registro();
    if (!r) throw new Error('sin registro');
    var o = { challenge: azar(32), allowCredentials: [{ type: 'public-key', id: deB64(r.id) }], userVerification: 'required', timeout: 60000 };
    if (r.m === 'prf') o.extensions = { prf: { eval: { first: SAL_PRF } } };
    var cred = await navigator.credentials.get({ publicKey: o });
    if (r.m !== 'prf') return r.k;
    var s = secretoDe(cred);
    if (!s) throw new Error('sin secreto');
    var raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(r.iv) }, await envoltura(s), deB64(r.k));
    return aB64(raw);
  }

  window.PUERTA = {
    derivar: derivar, abrir: abrir, llave: llave, guardarSesion: guardarSesion, recordado: recordado, recordar: recordar, olvidar: olvidar, olvidarSesion: olvidarSesion, marcar: marcar, ultimo: ultimo,
    minutos: minutos, fijarMinutos: fijarMinutos, vencida: vencida, cerrar: cerrar,
    huellaDisponible: huellaDisponible, registro: registro, quitarHuella: quitarHuella, noPreguntar: noPreguntar, noPreguntarActivo: noPreguntarActivo,
    registrarHuella: registrarHuella, entrarConHuella: entrarConHuella
  };
})();

</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var datos = JSON.parse($('vg-datos').textContent), P = window.PUERTA, html = null, llave = null;
  try { var t = localStorage.getItem('ancianos_pwa_tema_v1'); if (t === 'claro' || t === 'oscuro') document.documentElement.style.colorScheme = t === 'oscuro' ? 'dark' : 'light'; } catch (e) {}

  function decir(t) { $('msg').textContent = t || ''; }
  function mostrar(v) { ['vEntrada', 'vHuella'].forEach(function (x) { $(x).hidden = x !== v; }); }
  /* La app se monta en esta misma página, sin reescribir el documento, para no perder el ancho de pantalla en el celular */
  function entrar(texto, l) {
    P.guardarSesion(l);
    var d = new DOMParser().parseFromString(texto, 'text/html'), guiones = [];
    Array.prototype.forEach.call(d.querySelectorAll('script'), function (g) { guiones.push(g); g.remove(); });
    Array.prototype.forEach.call(d.documentElement.attributes, function (a) { document.documentElement.setAttribute(a.name, a.value); });
    Array.prototype.slice.call(document.head.children).forEach(function (n) { if (!(n.tagName === 'META' && n.name === 'viewport')) n.remove(); });
    Array.prototype.slice.call(d.head.children).forEach(function (n) {
      if (n.tagName === 'META' && (n.name === 'viewport' || n.hasAttribute('charset'))) return;
      document.head.appendChild(document.importNode(n, true));
    });
    document.title = d.title;
    Array.prototype.slice.call(document.body.attributes).forEach(function (a) { document.body.removeAttribute(a.name); });
    Array.prototype.forEach.call(d.body.attributes, function (a) { document.body.setAttribute(a.name, a.value); });
    document.body.textContent = '';
    Array.prototype.slice.call(d.body.childNodes).forEach(function (n) { document.body.appendChild(document.importNode(n, true)); });
    guiones.forEach(function (g) {
      var n = document.createElement('script');
      Array.prototype.forEach.call(g.attributes, function (a) { n.setAttribute(a.name, a.value); });
      if (g.src) n.async = false; else n.text = g.textContent;
      document.body.appendChild(n);
    });
  }
  async function intentar(l) {
    try { return await P.abrir(l, datos); } catch (e) { return null; }
  }
  function cambioClave() { P.olvidar(); P.quitarHuella(); }

  async function arrancar() {
    if (!window.crypto || !crypto.subtle) { $('viejo').hidden = false; return; }
    if (P.llave() && !P.recordado() && P.vencida(P.ultimo())) P.olvidarSesion();
    var guardada = P.recordado() || P.llave();
    if (guardada) {
      var h = await intentar(guardada);
      if (h) return entrar(h, guardada);
      cambioClave();
      $('tarjeta').hidden = false; mostrar('vEntrada'); decir('La contraseña cambió. Escríbela de nuevo.');
      return;
    }
    $('tarjeta').hidden = false; mostrar('vEntrada');
    if (P.registro()) {
      if (!(await P.huellaDisponible())) P.quitarHuella();
      else { $('bHuella').hidden = false; $('oHuella').hidden = false; if (document.visibilityState === 'visible') setTimeout(porHuella, 250); }
    }
    if (!P.registro()) $('clave').focus();
  }

  async function porHuella() {
    decir('');
    $('bHuella').disabled = true;
    var l;
    try { l = await P.entrarConHuella(); }
    catch (e) { $('bHuella').disabled = false; return decir('No se pudo verificar. Escribe la contraseña.'); }
    var h = await intentar(l);
    $('bHuella').disabled = false;
    if (!h) { cambioClave(); $('bHuella').hidden = true; $('oHuella').hidden = true; return decir('La contraseña cambió. Escríbela de nuevo.'); }
    if ($('recordar').checked) P.recordar(true, l);
    entrar(h, l);
  }

  async function porClave(ev) {
    ev.preventDefault();
    var c = $('clave').value;
    if (!c) return;
    decir(''); $('bEntrar').disabled = true; $('bEntrar').textContent = 'Verificando...';
    var l = await P.derivar(c, datos).catch(function () { return null; });
    var h = l ? await intentar(l) : null;
    $('bEntrar').disabled = false; $('bEntrar').textContent = 'Entrar';
    if (!h) { $('clave').select(); return decir('Contraseña incorrecta'); }
    $('clave').value = '';
    html = h; llave = l;
    P.guardarSesion(l);
    if ($('recordar').checked) P.recordar(true, l);
    if (!P.registro() && !P.noPreguntarActivo() && await P.huellaDisponible()) return mostrar('vHuella');
    entrar(h, l);
  }

  $('vEntrada').addEventListener('submit', porClave);
  $('bVer').addEventListener('click', function () {
    var c = $('clave'), ver = c.type === 'password';
    c.type = ver ? 'text' : 'password'; $('bVer').textContent = ver ? 'Ocultar' : 'Ver';
  });
  $('bHuella').addEventListener('click', porHuella);
  $('bAhora').addEventListener('click', function () { entrar(html, llave); });
  $('bNunca').addEventListener('click', function () { P.noPreguntar(true); entrar(html, llave); });
  $('bActivar').addEventListener('click', async function () {
    var b = $('bActivar'); b.disabled = true;
    if (b.dataset.listo) return entrar(html, llave);
    var modo = null;
    try { modo = await P.registrarHuella(llave); } catch (e) { b.disabled = false; return entrar(html, llave); }
    if (modo === 'prf') return entrar(html, llave);
    $('tHuella').textContent = 'Activada, con una salvedad: este dispositivo no permite proteger la llave con la huella. La huella solo confirma que estás presente y la llave queda guardada en el dispositivo.';
    b.disabled = false; b.textContent = 'Continuar'; b.dataset.listo = '1';
    $('bAhora').hidden = true; $('bNunca').hidden = true;
  });

  arrancar();
})();
</script>
</body>
</html>
