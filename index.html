<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7">
<script>
const LS_TEMA = 'ancianos_pwa_tema_v1';
const oscuroSistema = window.matchMedia('(prefers-color-scheme: dark)');
function modoTema() {
  try { const m = localStorage.getItem(LS_TEMA); return m === 'claro' || m === 'oscuro' ? m : 'auto'; } catch (e) { return 'auto'; }
}
function aplicarTema() {
  const m = modoTema();
  const oscuro = m === 'oscuro' || (m === 'auto' && oscuroSistema.matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
  document.querySelector('meta[name="theme-color"]').content = oscuro ? '#000000' : '#F3F4F7';
}
function guardarTema(m) { try { localStorage.setItem(LS_TEMA, m); } catch (e) {} aplicarTema(); }
oscuroSistema.addEventListener('change', aplicarTema);
aplicarTema();
</script>
<title>JWCore</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3A5F; --morado: #6B2D6B; --dorado: #B5973A;
    --rojo: #B3261E; --ambar: #B7791F; --verde: #2E7D46;
    --hero-a: #2E5585; --hero-z: #13243B; --lema: #E8C766;
    --tinta: #1E2430; --texto: #3A404C; --gris: #5E6470; --gris-suave: #8A8F98;
    --navy-t: #1F3A5F; --rojo-t: #B3261E; --ambar-t: #9A6416; --verde-t: #2E7D46; --dorado-t: #7A6220; --sobre-dorado: #13243B;
    --rojo-bg: rgba(179,38,30,.10); --ambar-bg: rgba(183,121,31,.13); --verde-bg: rgba(46,125,70,.12); --chip-bg: rgba(30,36,48,.06);
    --fondo: #EEF0F4;
    --g1: rgba(31,58,95,.24); --g2: rgba(181,151,58,.24); --g3: rgba(107,45,107,.14);
    --panel: rgba(255,255,255,.62); --caja: rgba(30,36,48,.05); --campo: rgba(255,255,255,.78); --linea: rgba(30,36,48,.12);
    --brillo: rgba(255,255,255,.95); --borde: rgba(255,255,255,.6);
    --sombra: 0 12px 32px -14px rgba(31,58,95,.30), 0 2px 6px -3px rgba(31,58,95,.12);
    --barra: rgba(246,247,250,.72); --hoja-bg: rgba(250,251,253,.88); --velo: rgba(15,24,40,.30);
    --pulsar: rgba(31,58,95,.07); --seg-bg: rgba(118,118,128,.12); --seg-on: #FFFFFF; --pill-on: rgba(255,255,255,.85);
    --mezcla: #000; --toast-bg: rgba(250,251,253,.92);
    --vidrio: inset 0 1px 0 var(--brillo), inset 0 0 0 1px var(--borde);
    --curva: cubic-bezier(.32,.72,0,1);
    color-scheme: light;
  }
  /* Modo oscuro: negro puro de fondo para pantallas OLED */
  :root[data-tema="oscuro"] {
    --dorado: #C9AB4E; --hero-a: #3A67A3; --hero-z: #0C1626;
    --tinta: #F2F3F5; --texto: #D3D6DC; --gris: #A6ABB5; --gris-suave: #7F858F;
    --navy-t: #8FB3E8; --rojo-t: #FF8A80; --ambar-t: #F0B65A; --verde-t: #6FD08C; --dorado-t: #E8C766; --sobre-dorado: #0C1626;
    --rojo-bg: rgba(255,138,128,.14); --ambar-bg: rgba(240,182,90,.14); --verde-bg: rgba(111,208,140,.14); --chip-bg: rgba(255,255,255,.08);
    --fondo: #000000; --g1: transparent; --g2: transparent; --g3: transparent;
    --panel: rgba(255,255,255,.07); --caja: rgba(255,255,255,.06); --campo: rgba(255,255,255,.08); --linea: rgba(255,255,255,.11);
    --brillo: rgba(255,255,255,.10); --borde: rgba(255,255,255,.06); --sombra: none;
    --barra: rgba(20,20,22,.78); --hoja-bg: rgba(18,19,22,.96); --velo: rgba(0,0,0,.66);
    --pulsar: rgba(255,255,255,.06); --seg-bg: rgba(118,118,128,.24); --seg-on: rgba(255,255,255,.18); --pill-on: rgba(255,255,255,.14);
    --mezcla: #fff; --toast-bg: rgba(38,39,43,.96);
    color-scheme: dark;
  }
  :root[data-tema="oscuro"] .pildora, :root[data-tema="oscuro"] .chip.cargo { color: color-mix(in srgb, var(--c, var(--navy)) 45%, #fff); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--fondo); color: var(--tinta); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(60% 48% at 8% 0%, var(--g1), transparent 72%), radial-gradient(52% 42% at 100% 28%, var(--g2), transparent 72%),
      radial-gradient(70% 55% at 35% 100%, var(--g3), transparent 72%), var(--fondo);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--navy-t); }
  input::placeholder, textarea::placeholder { color: var(--gris-suave); }
  :focus-visible { outline: 2px solid var(--dorado); outline-offset: 2px; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Barra superior */
  .barra-sup {
    position: sticky; top: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px);
    background: var(--barra); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    border-bottom: .5px solid var(--linea);
  }
  .barra-sup .dentro { max-width: 1120px; margin: 0 auto; height: 54px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; }
  .marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--tinta); font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .marca img { width: 32px; height: 32px; border-radius: 9px; box-shadow: 0 2px 8px -2px rgba(19,36,59,.45); }
  .redondo {
    width: 38px; height: 38px; display: grid; place-items: center; border-radius: 999px; color: var(--navy-t);
    background: var(--panel); box-shadow: var(--vidrio); transition: transform .3s var(--curva);
  }
  .redondo:active { transform: scale(.94); }
  .redondo svg, nav.inferior svg, .chev { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

  .contenedor { max-width: 820px; margin: 0 auto; padding: 6px 16px 24px; padding-left: calc(16px + env(safe-area-inset-left, 0px)); padding-right: calc(16px + env(safe-area-inset-right, 0px)); animation: entrar .45s var(--curva); }

  /* Encabezado de cada pantalla */
  .cabecera { position: relative; display: flex; flex-direction: column; align-items: flex-start; padding: 14px 4px 16px; }
  .cabecera .fila-sync { display: contents; }
  .cabecera .estado-sync { order: 9; margin-top: 10px; }
  @media (min-width: 600px) { .cabecera .estado-sync { position: absolute; top: 12px; right: 4px; margin: 0; } }
  .cabecera .sub { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--gris); }
  .cabecera .sub::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--navy)); flex: none; }
  .cabecera h1 { font-size: 32px; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; text-wrap: pretty; }
  .cabecera .sub2 { font-size: 14px; color: var(--gris); margin-top: 2px; }
  .pildora {
    display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: color-mix(in srgb, var(--c, var(--navy)) 70%, var(--mezcla)); background: color-mix(in srgb, var(--c, var(--navy)) 13%, transparent);
  }
  .estado-sync { font-size: 11.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; color: var(--gris); background: var(--panel); box-shadow: var(--vidrio); }

  h2.titulo-seccion { display: flex; align-items: baseline; gap: 8px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 26px 6px 10px; }
  h2.titulo-seccion .cuenta { font-size: 13px; font-weight: 600; color: var(--gris-suave); }

  /* Resumen de Inicio */
  .hero {
    position: relative; overflow: hidden; border-radius: 30px; color: #fff;
    background: linear-gradient(145deg, var(--hero-a) 0%, var(--navy) 52%, var(--hero-z) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.08), 0 22px 44px -20px rgba(19,36,59,.65);
  }
  .hero::before { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(closest-side, rgba(232,199,102,.32), transparent); pointer-events: none; }
  .hero-top { position: relative; padding: 20px 22px 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; align-items: end; }
  .hero-et { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .09em; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); color: var(--lema); }
  .hero-num { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; }
  .hero-num b { font-size: 60px; line-height: 1; font-weight: 700; letter-spacing: -.03em; }
  .hero-num span { font-size: 15px; font-weight: 600; opacity: .92; }
  .hero-mini { display: flex; gap: 10px; }
  .hero-dato { flex: 1; padding: 12px 14px; border-radius: 20px; background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.22); color: #fff; text-decoration: none; }
  .hero-dato b { display: block; font-size: 26px; font-weight: 700; line-height: 1.1; }
  .hero-dato span { font-size: 12px; opacity: .85; }
  .hero-pie { position: relative; display: flex; align-items: center; gap: 10px; padding: 14px 22px; color: #fff; text-decoration: none; background: rgba(255,255,255,.13); border-top: .5px solid rgba(255,255,255,.2); }
  .hero-pie span { flex: 1; font-size: 14px; font-weight: 600; }
  .hero-pie b { color: var(--lema); font-size: 14px; }

  /* Superficies de vidrio */
  .panel, .lista, .vacio, .resp, .tarjeta-form, .pub, .acordeon, .boton-seccion, details.hist-cargo > summary, .tarea {
    background: var(--panel); box-shadow: var(--vidrio), var(--sombra);
  }
  .panel { border-radius: 26px; padding: 16px; }
  .vacio { border-radius: 22px; padding: 14px 18px; font-size: 14px; color: var(--gris); }
  .resp { border-radius: 22px; padding: 12px 16px; margin: 0 0 12px; font-size: 13.5px; }
  .resp-fila + .resp-fila { margin-top: 6px; }
  .resp-aux { font-size: 12.5px; color: var(--gris); }

  /* Monograma de color para cargos y hermanos */
  .mono {
    flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-size: 12.5px; font-weight: 600; letter-spacing: .02em;
    background: linear-gradient(145deg, color-mix(in srgb, var(--c, var(--navy)) 62%, #fff), var(--c, var(--navy)));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  }

  /* Botones de cargos en Inicio */
  .secciones { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 560px) { .secciones { grid-template-columns: 1fr 1fr; } }
  .boton-seccion { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border-radius: 22px; padding: 12px 14px; transition: transform .3s var(--curva); }
  .boton-seccion:active { transform: scale(.98); }
  .boton-seccion > div { flex: 1; min-width: 0; }
  .boton-seccion .nombre { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .boton-seccion .persona { font-size: 12.5px; color: var(--gris-suave); }
  .contador { min-width: 26px; text-align: center; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--gris); }
  .contador.alerta { background: var(--rojo-bg); color: var(--rojo-t); }

  /* Tareas */
  .tarea {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; border: 0;
    border-radius: 22px; padding: 12px 14px 12px 16px; transition: background .25s;
  }
  .tarea:active { background: var(--pulsar); }
  .lista { border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; }
  .lista > .tarea { background: none; box-shadow: none; border-radius: 0; }
  .lista:has(> .pub) { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; background: none; box-shadow: none; overflow: visible; border-radius: 0; }
  .lista > .tarea + .tarea { box-shadow: inset 0 .5px 0 var(--linea); }
  .anillo {
    flex: none; margin-top: 1px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    border: 1.8px solid var(--gris-suave); color: #fff;
  }
  .tarea.vencida .anillo { border-color: var(--rojo-t); }
  .tarea.proxima .anillo { border-color: var(--ambar-t); }
  .tarea.hecha .anillo { border-color: var(--verde); background: var(--verde); }
  .anillo svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .tarea-cuerpo { flex: 1; min-width: 0; display: block; }
  .tarea .t { display: block; font-size: 15px; line-height: 1.38; font-weight: 500; text-wrap: pretty; }
  .tarea.hecha .t { opacity: .6; }
  .tarea .meta, .fuente .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
  .chev { flex: none; width: 16px; height: 16px; stroke: var(--gris-suave); stroke-width: 2; opacity: .7; align-self: center; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--chip-bg); color: var(--gris); border: 0; }
  .chip.cargo { background: color-mix(in srgb, var(--c, var(--navy)) 15%, transparent); color: color-mix(in srgb, var(--c, var(--navy)) 68%, var(--mezcla)); }
  .chip.rojo { background: var(--rojo-bg); color: var(--rojo-t); }
  .chip.ambar { background: var(--ambar-bg); color: var(--ambar-t); }
  .chip.verde { background: var(--verde-bg); color: var(--verde-t); }
  .chip.ref { background: none; color: var(--gris-suave); font-weight: 500; box-shadow: inset 0 0 0 .5px var(--linea); }
  .permanente { display: block; font-size: 14.5px; line-height: 1.4; }
  .permanente + .permanente { margin-top: 8px; }
  .permanente .chip { margin-left: 6px; }

  /* Necesidades */
  .segmentos { display: flex; gap: 3px; overflow-x: auto; padding: 3px; border-radius: 999px; background: var(--seg-bg); scrollbar-width: none; }
  .segmentos::-webkit-scrollbar { display: none; }
  .segmentos > .segmento {
    flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 9px; border: 0; border-radius: 999px;
    background: none; font-size: 13px; font-weight: 600; color: var(--tinta); transition: background .4s var(--curva);
  }
  .segmentos > .segmento::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--navy)); }
  .segmentos > .segmento[data-ver]::before { display: none; }
  .segmentos > .segmento.activo { background: var(--seg-on); box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .buscador {
    display: block; width: 100%; margin-top: 10px; height: 44px; padding: 0 18px; border: 0; outline: 0; border-radius: 999px;
    background: var(--panel); box-shadow: var(--vidrio); font-size: 15px;
  }
  select.buscador { margin-top: 8px; }
  .pub { border-radius: 26px; padding: 16px 16px 14px; }
  .pub-cab { display: flex; align-items: center; gap: 12px; }
  .pub-cab > div { flex: 1; min-width: 0; }
  .pub-nombre { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pub-completo { font-size: 12px; color: var(--gris-suave); }
  .pub textarea {
    width: 100%; min-height: 52px; resize: vertical; margin-top: 10px; border: 0; outline: 0; border-radius: 16px; padding: 10px 12px;
    font-size: 14px; line-height: 1.45; background: var(--campo); box-shadow: inset 0 0 0 .5px var(--linea);
  }
  .pub.pendiente textarea { box-shadow: inset 0 0 0 1.5px var(--ambar-t); }
  .pub-pie { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .mini {
    border: 0; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--navy-t);
    background: var(--panel); box-shadow: var(--vidrio); transition: transform .3s var(--curva);
  }
  .mini:active { transform: scale(.96); }
  .mini.on-pendiente { background: var(--ambar-bg); color: var(--ambar-t); }
  .mini.on-atendido { background: var(--verde-bg); color: var(--verde-t); }
  .mini.on-filtro { background: var(--ambar-bg); color: var(--ambar-t); }
  .fecha-atendido { font-size: 11.5px; color: var(--gris-suave); }

  /* Formularios */
  .campo { display: block; margin-bottom: 12px; }
  .campo > span { display: block; font-size: 12.5px; font-weight: 600; color: var(--gris); margin: 0 0 6px 6px; }
  .campo input, .campo select, .campo textarea, .selfecha select, .fila-cargo select, .aux-nota {
    width: 100%; padding: 11px 14px; border: 0; outline: 0; border-radius: 16px; background: var(--campo);
    box-shadow: inset 0 0 0 .5px var(--linea); font-size: 14.5px;
  }
  .campo textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
  .campo input:focus, .campo select:focus, .campo textarea:focus, .buscador:focus { box-shadow: inset 0 0 0 1.5px var(--dorado); }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dos > * { min-width: 0; }
  .ayuda { font-size: 12.5px; line-height: 1.5; color: var(--gris-suave); margin-top: 4px; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .boton {
    border: 0; min-height: 46px; padding: 0 22px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--sobre-dorado); background: var(--dorado);
    box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--dorado) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .3s var(--curva);
  }
  .boton:active { transform: scale(.98); }
  .boton.sec { color: var(--navy-t); background: var(--panel); box-shadow: var(--vidrio); }
  .boton.verde { color: #fff; background: var(--verde); box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--verde) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.3); }
  .boton.peligro { color: var(--rojo-t); background: var(--rojo-bg); box-shadow: none; }
  .boton-agregar {
    width: 100%; margin-top: 12px; min-height: 46px; border-radius: 999px; border: 1.5px dashed var(--linea);
    background: transparent; font-weight: 600; color: var(--navy-t);
  }

  /* Cargos desplegables */
  .acordeon { border-radius: 24px; overflow: hidden; }
  .acordeon + .acordeon { margin-top: 10px; }
  .acordeon > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .acordeon > summary::-webkit-details-marker { display: none; }
  .acordeon > summary > div:not(.cuentas) { flex: 1; min-width: 0; }
  .acordeon > summary .nombre { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .acordeon > summary .persona { font-size: 12.5px; color: var(--gris-suave); }
  .acordeon > summary .cuentas { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
  .acordeon > summary .cuentas span { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--chip-bg); color: var(--gris); }
  .acordeon > summary .cuentas span.alerta { background: var(--rojo-bg); color: var(--rojo-t); }
  .acordeon > summary .cuentas span.flecha { background: none; padding: 0; width: 18px; height: 18px; font-size: 0; display: grid; place-items: center; transition: transform .3s var(--curva); }
  .acordeon > summary .cuentas span.flecha::before { content: ""; width: 7px; height: 7px; margin-top: -4px; border-right: 2px solid var(--gris-suave); border-bottom: 2px solid var(--gris-suave); transform: rotate(45deg); }
  .acordeon[open] > summary .flecha { transform: rotate(180deg); }
  .acordeon[open] > summary { box-shadow: inset 0 -.5px 0 var(--linea); }
  .acordeon .cuerpo { padding: 4px 16px 14px; }
  .acordeon.ajc > summary .persona { display: block; margin-top: 1px; }
  .acordeon.ajc > summary .persona.sin { font-weight: 600; color: var(--ambar-t); }

  /* Hoja que se abre encima */

  div.segmento { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; margin: 10px 0 4px; border-radius: 999px; background: var(--seg-bg); }

  .selfecha { display: flex; gap: 6px; flex-wrap: wrap; }

  .titulo-mes { font-size: 12px; font-weight: 700; color: var(--gris-suave); margin: 20px 6px 8px; text-transform: uppercase; letter-spacing: .08em; }
  body.bloqueada nav.inferior, body.bloqueada .barra-sup .engrane { display: none; }
  .bloqueo { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; }

    box-shadow: var(--vidrio), 0 12px 30px -10px rgba(0,0,0,.3);

</style>

<script>
/* ================= Datos y almacenamiento local ================= */
const LS_DATOS = 'ancianos_pwa_datos_v1';
const LS_CFG = 'ancianos_pwa_cfg_v1';
const LS_SUCIOS = 'ancianos_pwa_sucios_v1';
const LS_AVISADOS = 'ancianos_pwa_avisados_v1';
const LS_BIO = 'ancianos_pwa_bio_v1';
const LS_DISP = 'ancianos_pwa_disp_v1';

const EVENTOS = {
  visitaSC: 'Visita del superintendente de circuito',
  asambleaRegional: 'Asamblea regional',
  conmemoracion: 'Conmemoración',
  discursoEspecial: 'Discurso especial'
};
/* Hay dos asambleas de circuito por año de servicio (septiembre a septiembre). Cada tarea relativa a
   "asambleaCircuito" usa la que esté más próxima entre las dos, la que no se haya marcado como ya ocurrida. */
const ASAMBLEAS_CIRCUITO = ['asambleaCircuito1', 'asambleaCircuito2'];
function proximaAsambleaCircuito() {
  const f = DB.fechas, hoy = hoyISO();
  const activas = ASAMBLEAS_CIRCUITO.filter(k => !f[k + 'Pasada']);
  const conFecha = activas.filter(k => f[k]).sort((a, b) => f[a].localeCompare(f[b]));
  const futura = conFecha.find(k => f[k] >= hoy);
  return futura || conFecha[0] || activas[0] || ASAMBLEAS_CIRCUITO[0];
}
const etiquetaEvento = (k) => k === 'asambleaCircuito' ? 'Asamblea de circuito' : EVENTOS[k];
/* ¿Falta alguna fecha clave? Para la asamblea de circuito basta con que una de las dos esté lista
   (con fecha, o marcada como que ya pasó); las otras fechas son de un solo valor. */
function faltanFechasClave() {
  const f = DB.fechas;
  const faltan = Object.keys(EVENTOS).filter(k => !f[k]);
  const sinAsamblea = !ASAMBLEAS_CIRCUITO.some(k => f[k] || f[k + 'Pasada']);
  return sinAsamblea ? ['asambleaCircuito', ...faltan] : faltan;
}/* Eventos que duran varios días: tienen fecha de inicio y de final */
const EVENTOS_RANGO = {
  visitaSC: { fin: 'visitaSCFin', de: 'la visita', Art: 'La visita', ini: 'Inicio de la visita', final: 'Final de la visita' },
  asambleaRegional: { fin: 'asambleaRegionalFin', de: 'la asamblea', Art: 'La asamblea', ini: 'Inicio de la asamblea', final: 'Final de la asamblea' }
};

const TIPOS = {
  semanal: 'Cada semana', mensual: 'Cada mes', anual: 'Cada año',
  intervalo: 'Cada cierto número de meses', relativa: 'Según una fecha clave',
  unica: 'Una sola vez', evento: 'Cuando ocurra', permanente: 'Responsabilidad permanente'
};
const DIAS_SEM = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const COLORES_GRUPO = { 1: '#C0392B', 2: '#8B7335', 3: '#2E4A6B', 4: '#5C4A1E' };

let DB = cargarJSON(LS_DATOS, { tareas: [], publicadores: [], cargos: [], formularios: [], fechas: { id: 'fechas', updatedAt: 0 } });
let CFG = cargarJSON(LS_CFG, { url: '', clave: '', ultimoSync: null });
let SUCIOS = cargarJSON(LS_SUCIOS, { tareas: [], publicadores: [], cargos: [], fechas: false });
let AVISADOS = cargarJSON(LS_AVISADOS, {});
let BIO = cargarJSON(LS_BIO, { credId: null });
let DISP = cargarJSON(LS_DISP, { id: '', nombre: '' });
if (!DISP.id) {
  const ua = navigator.userAgent;
  const tipo = /Android/i.test(ua) ? 'Celular Android' : /iPhone|iPad/i.test(ua) ? 'iPhone o iPad' : /Windows/i.test(ua) ? 'Computadora Windows' : /Mac/i.test(ua) ? 'Mac' : 'Dispositivo';
  DISP = { id: 'd' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join(''), nombre: tipo };
  localStorage.setItem(LS_DISP, JSON.stringify(DISP));
}
let bloqueada = !!BIO.credId;
let ocultaDesde = null;
const MINUTOS_PARA_BLOQUEAR = 1;

function cargarJSON(k, def) {
  try { const v = localStorage.getItem(k); return v ? Object.assign(def, JSON.parse(v)) : def; }
  catch (e) { return def; }
}
function guardarLocal() {
  try {
    localStorage.setItem(LS_DATOS, JSON.stringify(DB));
    localStorage.setItem(LS_SUCIOS, JSON.stringify(SUCIOS));
  } catch (e) { toast('No se pudo guardar en este dispositivo'); }
}
function guardarCfg() { try { localStorage.setItem(LS_CFG, JSON.stringify(CFG)); } catch (e) {} }

function marcarCambio(tipo, reg) {
  reg.updatedAt = Date.now();
  if (tipo === 'fechas') SUCIOS.fechas = true;
  else if (!SUCIOS[tipo].includes(reg.id)) SUCIOS[tipo].push(reg.id);
  guardarLocal();
  programarEnvio();
}

/* ================= Utilidades de fecha ================= */
function pad(n) { return String(n).padStart(2, '0'); }
function aISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function deISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function hoyISO() { return aISO(new Date()); }
function sumarDias(s, n) { const d = deISO(s); d.setDate(d.getDate() + n); return aISO(d); }
function sumarMeses(s, n, diaFijo) {
  const d = deISO(s);
  const dia = diaFijo || d.getDate();
  const objetivo = new Date(d.getFullYear(), d.getMonth() + n, 1, 12);
  const ultimo = new Date(objetivo.getFullYear(), objetivo.getMonth() + 1, 0).getDate();
  objetivo.setDate(Math.min(dia, ultimo));
  return aISO(objetivo);
}
function fechaLarga(s) {
  if (!s) return '';
  const d = deISO(s);
  return d.getDate() + ' de ' + MESES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' de ' + d.getFullYear() : '');
}
function diasHasta(s) { return Math.round((deISO(s) - deISO(hoyISO())) / 86400000); }

function primeraFecha(t) {
  const hoy = hoyISO();
  if (t.tipo === 'semanal') {
    const d = deISO(hoy);
    const falta = ((t.dow ?? 1) - d.getDay() + 7) % 7;
    return sumarDias(hoy, falta);
  }

  if (recordatorios.length) html += `<h2 class="titulo-seccion">Recordatorios<span class="cuenta">${recordatorios.length}</span></h2>` + listaTareas(recordatorios, true, '');
  const recPub = recordatoriosPub().filter(x => x.aviso);
  if (recPub.length) html += `<h2 class="titulo-seccion">Recordatorios de hermanos<span class="cuenta">${recPub.length}</span></h2><div class="panel" style="padding:2px 12px">${recPub.map(renglonRecPub).join('')}</div>`;
  html += `<h2 class="titulo-seccion">Atrasadas<span class="cuenta">${vencidas.length}</span></h2>` + botonOmitir('todas', vencidas, 'Omitir todas las atrasadas') + listaTareas(vencidas, true, 'Nada atrasado.');
  html += `<h2 class="titulo-seccion">Próximos 7 días<span class="cuenta">${semana.length}</span></h2>` + listaTareas(semana, true, 'Nada para esta semana.');
  html += `<a class="abrir-seccion" href="#proximas">Ver todas las tareas próximas</a>`;
  if (porRevisar.length) html += `<h2 class="titulo-seccion">Por revisar<span class="cuenta">${porRevisar.length}</span></h2>` + listaTareas(porRevisar, true, '');
  html += `<h2 class="titulo-seccion">Por cargo</h2>` + botonesCargos();

  const faltan = faltanFechasClave();
  if (faltan.length) html += `<h2 class="titulo-seccion">Fechas clave sin definir</h2>
    <div class="vacio">${faltan.map(k => esc(etiquetaEvento(k))).join(', ')}. Agrégalas en Ajustes para que se calculen sus tareas.</div>`;
  vista.innerHTML = html;
}

function botonOmitir(donde, lista, texto) {
  const n = lista.filter(omitible).length;
  return n ? `<button type="button" class="mini" data-omitir="${donde}" style="margin:0 0 8px">${texto} (${n})</button>` : '';
}

/* ---------- Próximas: todo lo que viene, aunque falte mucho ---------- */
let filtroProx = { cargo: '' };
function vistaProximas() {
  const lista = tareasActivas().filter(t => ['semana', 'mes', 'futura'].includes(situacion(t).clase) && (!filtroProx.cargo || t.cargo === filtroProx.cargo)).sort(ordenarPorFecha);
  let html = cabecera('Próximas', 'CONGREGACIÓN CHICHICAXTLE', 'var(--navy)', lista.length + (lista.length === 1 ? ' TAREA CON FECHA' : ' TAREAS CON FECHA'));
  html += `<select class="buscador" id="filtroProxCargo"><option value="">Todos los cargos</option>${cargosOrden().map(c => `<option value="${c.id}" ${filtroProx.cargo === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select>
    <p class="ayuda" style="margin:8px 2px 0">Todas las tareas con fecha desde hoy, aunque falte mucho. Ábrelas para marcarlas por adelantado. Las atrasadas están en Inicio.</p>`;
  if (!lista.length) html += '<div class="vacio" style="margin-top:12px">No hay tareas próximas con fecha.</div>';
  let mes = '';
  lista.forEach(t => {
    const f = situacion(t).fecha, m = f.slice(0, 7);
    if (m !== mes) { mes = m; const nombre = MESES[Number(m.slice(5)) - 1]; html += `<div class="titulo-mes">${nombre.charAt(0).toUpperCase() + nombre.slice(1)} de ${m.slice(0, 4)}</div>`; }
    html += tarjetaTarea(t, true);
  });
  const recs = filtroProx.cargo ? [] : recordatoriosPub().filter(x => diasHasta(x.r.fecha) >= 0);
  if (recs.length) html += `<h2 class="titulo-seccion">Recordatorios de hermanos<span class="cuenta">${recs.length}</span></h2><div class="panel" style="padding:2px 12px">${recs.map(renglonRecPub).join('')}</div>`;
  html += `<a class="abrir-seccion" href="#inicio">Volver al inicio</a>`;
  vista.innerHTML = html;
}

function botonesCargos() {
  return `<div class="secciones">${cargosOrden().map(c => {
    const n = conteoCargo(c.id);
    return `<a class="boton-seccion" href="#cargo/${c.id}" style="--c:${c.color};text-decoration:none;color:inherit">
      <span class="mono">${mono(c.nombre)}</span>
      <div><div class="nombre">${esc(c.nombre)}</div>${etiquetaPersonas(c) ? `<div class="persona">${esc(etiquetaPersonas(c))}</div>` : ''}</div>
      <span class="contador ${n.urg ? 'alerta' : ''}" title="Pendientes">${n.urg || n.pend}</span>
    </a>`;
  }).join('')}</div>`;
}

/* ---------- Cargos ---------- */
const cargosAbiertos = new Set();

function renglonTarea(t) {
  const s = situacion(t);
  let f = '', cls = '';
  if (s.clase === 'vencida') { f = 'Venció ' + fechaLarga(s.fecha); cls = 'rojo'; }
  else if (s.clase === 'semana') { f = s.dias === 0 ? 'Hoy' : s.dias === 1 ? 'Mañana' : fechaLarga(s.fecha); cls = 'ambar'; }
  else if (s.clase === 'mes' || s.clase === 'futura') f = fechaLarga(s.fecha);
  else if (s.clase === 'hecha') { f = s.omitida ? 'Omitida' : 'Hecho'; cls = s.omitida ? 'ambar' : 'verde'; }
  else if (s.clase === 'sinfecha') f = 'Sin fecha';
  else if (s.revisar) { f = 'Por revisar'; cls = 'ambar'; }
  if (t.oculta) { f = 'Oculta'; cls = ''; }
  return `<button class="renglon" data-tarea="${t.id}"><span class="t">${esc(t.titulo)}</span>${f ? `<span class="f ${cls}">${esc(f)}</span>` : ''}</button>`;
}

function bloqueLista(titulo, lista) {
  return lista.length ? `<div class="grupo-lista">${titulo} (${lista.length})</div>${lista.map(renglonTarea).join('')}` : '';
}

function vistaCargos() {
  let html = cabecera('Cargos', 'CONGREGACIÓN CHICHICAXTLE', 'var(--navy)', 'RESPONSABILIDADES');
  html += cargosOrden().map(c => {
    const mias = tareasActivas().filter(t => t.cargo === c.id);
    const clase = (t) => situacion(t).clase;
    const conFecha = mias.filter(t => ['vencida', 'semana', 'mes', 'futura'].includes(clase(t))).sort(ordenarPorFecha);
    const vencidas = conFecha.filter(t => clase(t) === 'vencida').length;
    const proximas = conFecha.filter(t => clase(t) === 'semana').length;
    return `<details class="acordeon" data-cargo="${c.id}" style="--c:${c.color}" ${cargosAbiertos.has(c.id) ? 'open' : ''}>
      <summary>
        <span class="mono">${mono(c.nombre)}</span>
        <div><div class="nombre">${esc(c.nombre)}</div>${etiquetaPersonas(c) ? `<div class="persona">${esc(etiquetaPersonas(c))}</div>` : ''}</div>
        <div class="cuentas">
          ${vencidas ? `<span class="alerta">${vencidas} atrasada${vencidas > 1 ? 's' : ''}</span>` : ''}
          ${proximas ? `<span>${proximas} esta semana</span>` : ''}
          <span class="flecha">▼</span>
        </div>
      </summary>
      <div class="cuerpo">
        ${botonOmitir('cargo:' + c.id, conFecha, 'Omitir las atrasadas de este cargo')}
        ${bloqueLista('Con fecha', conFecha)}
        ${bloqueLista('Falta ponerles fecha', mias.filter(t => clase(t) === 'sinfecha'))}
        ${bloqueLista('Cuando ocurra', mias.filter(t => t.tipo === 'evento'))}
        ${bloqueLista('Responsabilidades permanentes', mias.filter(t => t.tipo === 'permanente'))}
        ${bloqueLista('Hechas', mias.filter(t => clase(t) === 'hecha'))}
        ${bloqueLista('Ocultas', tareasTodas().filter(t => t.cargo === c.id && t.oculta))}
        <a class="abrir-seccion" href="#cargo/${c.id}">Abrir sección</a>
      </div>
    </details>`;
  }).join('');
  vista.innerHTML = html;
}
vista.addEventListener('toggle', (e) => {
  const aj = e.target.dataset && e.target.dataset.ajc;
  if (aj) { if (e.target.open) ajCargos.abiertos.add(aj); else ajCargos.abiertos.delete(aj); return; }
  const id = e.target.dataset && e.target.dataset.cargo;
  if (!id) return;
  if (e.target.open) cargosAbiertos.add(id); else cargosAbiertos.delete(id);
}, true);

function vistaCargo(id) {
  const c = cargoPorId(id);
  const mias = tareasActivas().filter(t => t.cargo === id);
  const conFecha = mias.filter(t => ['vencida', 'semana', 'mes', 'futura'].includes(situacion(t).clase)).sort(ordenarPorFecha);
  const sinFecha = mias.filter(t => situacion(t).clase === 'sinfecha');
  const hechas = mias.filter(t => situacion(t).clase === 'hecha');
  const eventos = mias.filter(t => t.tipo === 'evento');
  const perm = mias.filter(t => t.tipo === 'permanente');

  let html = cabecera(c.nombre, 'CONGREGACIÓN CHICHICAXTLE', c.color, (etiquetaPersonas(c) || (cfgCargo(c).especial === 'rota' ? 'SE TURNA CADA SEMANA' : 'SIN ASIGNAR')).toUpperCase());
  html += bloqueResponsables(c);
  html += `<h2 class="titulo-seccion">Con fecha<span class="cuenta">${conFecha.length}</span></h2>` + botonOmitir('cargo:' + id, conFecha, 'Omitir las atrasadas de este cargo') + listaTareas(conFecha, false, 'Sin tareas con fecha.');
  if (sinFecha.length) html += `<h2 class="titulo-seccion">Falta ponerles fecha<span class="cuenta">${sinFecha.length}</span></h2>` + listaTareas(sinFecha, false, '');
  if (eventos.length) html += `<h2 class="titulo-seccion">Cuando ocurra<span class="cuenta">${eventos.length}</span></h2>` + listaTareas(eventos, false, '');
  if (perm.length) html += `<h2 class="titulo-seccion">Responsabilidades permanentes</h2>` +
    perm.map(t => `<button class="permanente tarea" data-tarea="${t.id}" style="border-left-color:${c.color}">${esc(t.titulo)}${situacion(t).revisar ? '<span class="chip ambar">Por revisar</span>' : ''}${t.ref ? `<span class="chip ref">${esc(t.ref)}</span>` : ''}</button>`).join('');
  if (hechas.length) html += `<h2 class="titulo-seccion">Hechas<span class="cuenta">${hechas.length}</span></h2>` + listaTareas(hechas, false, '');
  const ocultas = tareasTodas().filter(t => t.cargo === id && t.oculta);
  if (ocultas.length) html += `<details class="ocultas"><summary>Ocultas (${ocultas.length})</summary>${listaTareas(ocultas, false, '')}</details>`;
  html += `<button class="boton-agregar" data-nueva="${id}">+ Agregar tarea</button>`;
  vista.innerHTML = html;
}

/* ---------- Ficha del hermano: datos permanentes y recordatorios con fecha ---------- */
const ANTELACIONES = [[0, 'El mismo día'], [3, '3 días antes'], [7, '1 semana antes'], [14, '2 semanas antes'], [30, '1 mes antes']];
function recordatoriosPub() {
  const hoy = hoyISO();
  return pubsActivos().flatMap(p => (p.recordatorios || []).filter(r => r.fecha).map(r => ({ p, r, aviso: sumarDias(r.fecha, -(r.antes ?? 7)) <= hoy })))
    .sort((a, b) => a.r.fecha.localeCompare(b.r.fecha));
}
function cuandoRec(r) {
  const d = diasHasta(r.fecha);
  if (d < 0) return { txt: 'Venció el ' + fechaLarga(r.fecha), cls: 'rojo' };
  if (d === 0) return { txt: 'Hoy', cls: 'ambar' };
  if (d === 1) return { txt: 'Mañana', cls: 'ambar' };
  if (d <= 7) return { txt: 'En ' + d + ' días', cls: 'ambar' };
  return { txt: fechaLarga(r.fecha), cls: '' };
}
function renglonRecPub({ p, r }) {
  const c = cuandoRec(r);
  return `<div class="rec-pub"><button class="renglon" data-ficha="${p.id}"><span class="t"><b>${esc(nombreCorto(p))}</b>${r.texto ? ': ' + esc(r.texto) : ''}</span><span class="f ${c.cls}">${esc(c.txt)}</span></button>
    <button type="button" class="mini" data-rec-hecho="${p.id}|${r.id}">Hecho</button></div>`;
}
function recHecho(p, rid) {
  const r = (p.recordatorios || []).find(x => x.id === rid);
  if (!r) return '';
  agregarEntrada(p, hoyISO(), 'Recordatorio: ' + (r.texto || fechaLarga(r.fecha)));
  let aviso = '';
  if (r.anual) { do { r.fecha = sumarMeses(r.fecha, 12); } while (r.fecha <= hoyISO()); aviso = ' Se repite el ' + fechaLarga(r.fecha) + '.'; }
  else p.recordatorios = p.recordatorios.filter(x => x.id !== rid);
  if (!p.recordatorios.length) delete p.recordatorios;
  marcarCambio('publicadores', p);
  return 'Recordatorio hecho.' + aviso;
}
function filaDato(d) {
  return `<div class="fila-ficha" data-fd>
    <label class="campo"><span>Título</span><input data-f="titulo" value="${esc(d.titulo || '')}" placeholder="Ej. Trabajo, Salud de su familia, Transporte"></label>
    <label class="campo"><span>Dato</span><textarea data-f="texto">${esc(d.texto || '')}</textarea></label>
    <div class="acciones-fila"><button type="button" class="mini" data-quitar-fila>Quitar</button></div></div>`;
}
function filaRec(r) {
  const antes = r.antes ?? 7;
  return `<div class="fila-ficha" data-fr="${r.id}">
    <div class="campo"><span>Fecha</span>${selectorFecha('rf_' + r.id, r.fecha)}</div>
    <label class="campo"><span>Qué recordar</span><input data-f="texto" value="${esc(r.texto || '')}"></label>
    <label class="campo"><span>Mostrar en Inicio</span><select data-f="antes">${ANTELACIONES.map(([n, l]) => `<option value="${n}" ${n === antes ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="chk-pasada"><input type="checkbox" data-f="anual" ${r.anual ? 'checked' : ''}> Repetir cada año</label>
    <div class="acciones-fila" style="margin-top:8px"><button type="button" class="mini" data-rec-hecho-f="${r.id}">Hecho</button><button type="button" class="mini" data-quitar-fila>Quitar</button></div></div>`;
}
const nuevoRecId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
let fichaEd = null;
function abrirFicha(id) {
  const p = pubPorId(id); if (!p) return;
  fichaEd = { p };
  abrirHoja(`<h3>Ficha</h3><div style="font-weight:600;font-size:14.5px;margin-bottom:2px">${esc(p.nombre)}</div>
  <form id="formFicha">
    <span class="ficha-tit">Datos permanentes</span>
    <div id="listaDatos">${(p.datos || []).map(filaDato).join('')}</div>
    <button type="button" class="mini" data-add-dato>+ Agregar dato</button>
    <span class="ficha-tit">Recordatorios</span>
    <div id="listaRecs">${(p.recordatorios || []).map(filaRec).join('')}</div>
    <button type="button" class="mini" data-add-rec>+ Agregar recordatorio</button>
    <p class="ayuda" style="margin:8px 0 0">Un recordatorio aparece en Inicio con la anticipación que elijas y se avisa al abrir la app. Se queda ahí hasta que lo marques como hecho.</p>
    <div class="acciones" style="margin-top:14px">
      <button class="boton" type="submit">Guardar</button>
      <button class="boton sec" type="button" id="btnCerrar">Cerrar</button>
    </div>
  </form>`);
}
/* Lee lo que hay en pantalla y lo pasa al hermano. Con exigir, un recordatorio sin fecha no se guarda. */
function leerFicha(exigir) {
  const p = fichaEd.p, f = $('#formFicha');
  const v = (fila, k) => { const x = fila.querySelector(`[data-f="${k}"]`); return x ? x.value.trim() : ''; };
  const datos = [...f.querySelectorAll('[data-fd]')].map(fila => ({ titulo: v(fila, 'titulo'), texto: v(fila, 'texto') })).filter(d => d.titulo || d.texto);
  const recs = [...f.querySelectorAll('[data-fr]')].map(fila => ({
    id: fila.dataset.fr, fecha: fila.querySelector('input[type=hidden]').value, texto: v(fila, 'texto'),
    antes: Number(v(fila, 'antes')) || 0, anual: fila.querySelector('[data-f="anual"]').checked
  })).filter(r => r.fecha || r.texto);
  if (exigir && recs.some(r => !r.fecha)) { toast('A un recordatorio le falta la fecha'); return false; }
  if (datos.length) p.datos = datos; else delete p.datos;
  if (recs.length) p.recordatorios = recs; else delete p.recordatorios;
  marcarCambio('publicadores', p);
  return true;
}

/* ---------- Necesidades ---------- */
let filtroNec = { grupo: '1', ver: 'todos', q: '' };
function vistaNecesidades(grupo) {
  if (grupo) filtroNec.grupo = grupo;
  const g = Number(filtroNec.grupo);
  const color = COLORES_GRUPO[g] || 'var(--morado)';
  let lista = pubsActivos().filter(p => p.grupo === g);
  if (filtroNec.ver === 'pendiente') lista = lista.filter(p => p.estado === 'pendiente');
  if (filtroNec.ver === 'atendido') lista = lista.filter(p => p.estado === 'atendido');
  if (filtroNec.q) {
    const q = normal(filtroNec.q);
    lista = lista.filter(p => normal(p.nombre + ' ' + (p.apodo || '') + ' ' + (p.necesidad || '') + ' ' + (p.datos || []).map(d => d.titulo + ' ' + d.texto).join(' ')).includes(q));
  }
  const pend = pubsActivos().filter(p => p.estado === 'pendiente');
  let html = cabecera('Necesidades de los publicadores', 'CONGREGACIÓN CHICHICAXTLE', 'var(--morado)', pend.length + ' POR ATENDER');
  html += `<div class="segmentos">${[1, 2, 3, 4].map(n => {
    const cuenta = pubsActivos().filter(p => p.grupo === n && p.estado === 'pendiente').length;
    return `<button class="segmento ${n === g ? 'activo' : ''}" style="--c:${COLORES_GRUPO[n]}" data-grupo="${n}">Grupo ${n}${cuenta ? ' (' + cuenta + ')' : ''}</button>`;
  }).join('')}</div>
  <div class="segmentos" style="margin-top:8px">${[['todos', 'Todos'], ['pendiente', 'Por atender'], ['atendido', 'Atendidos']].map(([k, l]) =>
    `<button class="segmento ${filtroNec.ver === k ? 'activo' : ''}" style="--c:${color}" data-ver="${k}">${l}</button>`).join('')}</div>
  <input class="buscador" type="search" placeholder="Buscar nombre, apodo, necesidad o dato" value="${esc(filtroNec.q)}" id="buscarNec">`;
  html += `<div class="lista" style="margin-top:12px">${lista.map(tarjetaPub).join('') || '<div class="vacio">No hay hermanos con este filtro.</div>'}</div>`;
  html += `<button class="boton-agregar" data-nuevo-pub="${g}">+ Agregar hermano al grupo ${g}</button>`;
  vista.innerHTML = html;
}
function normal(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function tarjetaPub(p) {
  const tieneApodo = p.apodo && p.apodo.trim();
  return `<div class="pub ${p.estado || ''}" data-pub="${p.id}">
    <div class="pub-cab">
      <span class="mono" style="--c:${COLORES_GRUPO[p.grupo] || 'var(--morado)'}">${mono(nombreCorto(p))}</span>
      <div><div class="pub-nombre">${esc(nombreCorto(p))}${p.nombramiento ? ` <span class="chip">${p.nombramiento === 'anciano' ? 'Anciano' : 'SM'}</span>` : ''}</div>${tieneApodo ? `<div class="pub-completo">${esc(p.nombre)}</div>` : ''}</div>
      <button class="mini" data-editar-pub="${p.id}">Editar</button>
    </div>
    <textarea data-nec="${p.id}" placeholder="Escribe aquí la necesidad...">${esc(p.necesidad || '')}</textarea>
    <div class="pub-pie">
      <button class="mini ${p.estado === 'pendiente' ? 'on-pendiente' : ''}" data-est="pendiente" data-id="${p.id}">Por atender</button>

      ${p.estado === 'atendido' && p.atendido ? `<span class="fecha-atendido">el ${fechaLarga(p.atendido)}</span>` : ''}
      <button class="mini" data-ficha="${p.id}" style="margin-left:auto">Ficha${(p.datos || []).length + (p.recordatorios || []).length ? ' (' + ((p.datos || []).length + (p.recordatorios || []).length) + ')' : ''}</button>
      <button class="mini" data-hist-pub="${p.id}">Historial${(p.historial || []).length ? ' (' + p.historial.length + ')' : ''}</button>
    </div>
  </div>`;
}


/* ---------- Fuentes: formularios y libros ---------- */
let filtroForm = '';
function usosDe(codigo) {
  return tareasTodas().filter(t =>
    (t.forms || []).includes(codigo) ||
    String(t.ref || '').split(';').some(x => x.trim().startsWith(codigo + ' ')));
}
function tarjetaForm(f) {

  return `<button class="tarjeta-form ${f.tienes ? '' : 'sin-archivo'}" data-form="${esc(f.codigo)}">
    <div><span class="cod">${esc(f.codigo)}</span><span class="tit">${esc(f.titulo)}</span></div>
    <div class="para">${esc(f.paraQue || '')}${n ? ' · ' + n + ' tarea' + (n > 1 ? 's' : '') : ''}</div>
  </button>`;
}
function vistaFormularios() {
  const q = normal(filtroForm);
  const todos = DB.formularios.filter(f => !f.borrado && (!q || normal(f.codigo + ' ' + f.titulo + ' ' + (f.paraQue || '')).includes(q)));
  const grupo = (titulo, lista) => lista.length ? `<h2 class="titulo-seccion">${titulo}<span class="cuenta">${lista.length}</span></h2>` + lista.map(tarjetaForm).join('') : '';
  let html = cabecera('Formularios y libros', 'CONGREGACIÓN CHICHICAXTLE', 'var(--navy)', 'DE DÓNDE SALE CADA TAREA');
  html += `<input class="buscador" type="search" id="buscarForm" placeholder="Buscar por código o tema, por ejemplo S-27" value="${esc(filtroForm)}">

/* Quién tiene cada cargo, en tarjetas plegables: cerrada muestra el cargo y su responsable; abierta, los menús para editarlo */
let ajCargos = { abiertos: new Set(), faltan: false };
function resumenCargoAjustes(c) {
  const cfg = cfgCargo(c);
  if (cfg.especial) { const n = personasDeCargo(c); return { lineas: [n.map(nombreCorto).join(', ')], falta: !n.length }; }
  let falta = false;
  const lineas = cfg.puestos.map(pc => {
    const nums = numsPuesto(c, pc.id);
    const nom = idsPuesto(c, pc).map(pubPorId).filter(Boolean).map(x => nombreCorto(x) + (nums[x.id] ? ' (grupo ' + nums[x.id] + ')' : '')).join(', ');
    if (!nom) falta = true;
    return (cfg.puestos.length > 1 ? pc.rotulo + ': ' : '') + nom;
  });
  return { lineas, falta };
}
function filaCargoAjustes(c) {
  const cfg = cfgCargo(c);
  if (cfg.especial === 'rota') return '';
  const r = resumenCargoAjustes(c);
  if (ajCargos.faltan && !r.falta) return '';
  const chips = (l) => `<div class="auto-lista">${l.length ? l.map(x => `<span class="chip">${esc(nombreCorto(x))}</span>`).join('') : '<span class="ayuda">Sin asignar todavía.</span>'}</div>`;
  let cuerpo = '';
  if (cfg.especial === 'igual') cuerpo = chips(personasDeCargo(c)) + '<div class="ayuda">Es la misma lista de Todos los ancianos.</div>';
  else if (cfg.especial === 'comite') cuerpo = chips(personasDeCargo(c)) + '<div class="ayuda">Lo forman 3 hermanos: el Coordinador, el Secretario y el Superintendente de servicio.</div>';
  else cuerpo = cfg.puestos.map(pc => bloquePuesto(c, pc, cfg.puestos.length > 1)).join('');
  const antes = cfg.puestos && c.persona && !personasDeCargo(c).length ? `<div class="ayuda">Antes decía: ${esc(c.persona)}</div>` : '';
  const lineas = r.lineas.map(l => l.endsWith(': ') || !l ? l + 'Sin asignar' : l);
  return `<details class="acordeon ajc" data-ajc="${c.id}" style="--c:${c.color}" ${ajCargos.abiertos.has(c.id) ? 'open' : ''}>

  </details>`;
}
function bloqueCargosAjustes() {

}
function textoRango(k) {
  const rg = EVENTOS_RANGO[k], ini = DB.fechas[k], fin = DB.fechas[rg.fin];
  const completa = (f) => { const d = deISO(f); return d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear(); };
  const rango = () => {
    const a = deISO(ini), z = deISO(fin);
    if (a.getFullYear() === z.getFullYear() && a.getMonth() === z.getMonth()) return a.getDate() + ' al ' + completa(fin);
    if (a.getFullYear() === z.getFullYear()) return a.getDate() + ' de ' + MESES[a.getMonth()] + ' al ' + completa(fin);
    return completa(ini) + ' al ' + completa(fin);
  };
  if (ini && fin) return ini === fin ? rg.Art + ' es el ' + completa(ini) + '.' : rg.Art + ' es del ' + rango() + '.';
  if (ini) return rg.Art + ' empieza el ' + completa(ini) + '. Falta la fecha en que termina.';
  return 'Pon el día en que empieza ' + rg.de + ' y el día en que termina.';
}
function filaAsambleaCircuito(k, nombre) {

  if (pasada) resumen = fecha ? 'Ya pasó, fue el ' + completa(fecha) + '.' : 'Ya pasó. No se guardó la fecha exacta, pero no se usará para calcular tareas futuras.';
  else if (fecha) resumen = 'Será el ' + completa(fecha) + '.';
  else resumen = 'Pon la fecha cuando la sepas, o marca que ya pasó si se te fue la fecha.';
  return `<div class="asamblea-circ ${pasada ? 'pasada' : ''}">
    <span class="visita-et">Asamblea de circuito ${nombre}</span>

function camposTipo(t) {
  const opt = (arr, val) => arr.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('');
  switch (t.tipo) {

    case 'mensual': return `<label class="campo"><span>Día del mes</span><input name="dia" type="number" min="1" max="31" value="${t.dia || 1}"></label>`;
    case 'anual': return `<div class="dos"><label class="campo"><span>Día</span><input name="dia" type="number" min="1" max="31" value="${t.dia || 1}"></label>
      <label class="campo"><span>Mes</span><select name="mes">${opt(MESES.map((m, i) => [i + 1, m]), t.mes || 1)}</select></label></div>`;
    case 'intervalo': return `<label class="campo"><span>Cada cuántos meses (0 = sin repetir)</span><input name="meses" type="number" min="0" max="60" value="${t.meses ?? 12}"></label>

    case 'relativa': return `<div class="dos"><label class="campo"><span>Fecha clave</span><select name="evento">${opt([['asambleaCircuito', 'Asamblea de circuito'], ...Object.entries(EVENTOS)], t.evento)}</select></label>
      <label class="campo"><span>Días (negativo = antes)</span><input name="dias" type="number" value="${t.dias || 0}"></label></div>` +
      (EVENTOS_RANGO[t.evento] ? `<label class="campo"><span>Contar desde</span><select name="ancla">${opt([['inicio', EVENTOS_RANGO[t.evento].ini], ['fin', EVENTOS_RANGO[t.evento].final]], anclaDe(t))}</select></label>` : '');
    case 'unica': return `<div class="campo"><span>Fecha</span>${selectorFecha('proxima', t.proxima)}</div>`;

      const r = revision(t);
      return `<label class="campo"><span>Recordarme revisarla</span><select name="revisarCada">${opt([['', 'No recordarme'], [1, 'Cada mes'], [2, 'Cada 2 meses'], [3, 'Cada 3 meses'], [4, 'Cada 4 meses'], [6, 'Cada 6 meses'], [12, 'Cada año'], [24, 'Cada 2 años']], t.revisarCada || '')}</select>

    }

}

    ${t.tipo !== 'permanente' ? `<div>

      <button class="boton" type="submit">Guardar</button>
      ${!tareaEditando.nueva && t.tipo !== 'permanente' && !s.hecha ? `<button class="boton verde" type="button" id="btnHecho">${t.tipo === 'evento' ? 'Registrar que se atendió' : 'Marcar como hecho'}</button>` : ''}
      ${!tareaEditando.nueva && omitible(t) ? '<button class="boton sec" type="button" id="btnOmitir">Omitir esta vez</button>' : ''}
      ${!tareaEditando.nueva && t.tipo === 'permanente' && t.revisarCada ? '<button class="boton verde" type="button" id="btnRevisado">Ya lo revisé</button>' : ''}
      ${!tareaEditando.nueva ? '<button class="boton sec" type="button" id="btnRegistrar">Solo registrar</button>' : ''}
      ${!tareaEditando.nueva ? `<button class="boton sec" type="button" id="btnOcultar">${t.oculta ? 'Volver a mostrar' : 'Ocultar de los pendientes'}</button>` : ''}

}

function leerFormTarea(form) {
  const t = tareaEditando.t;
  const f = new FormData(form);
  const antes = { tipo: t.tipo, dow: t.dow, dia: t.dia, mes: t.mes };
  t.titulo = f.get('titulo').trim();
  t.detalle = f.get('detalle').trim();
  if (f.has('cita')) t.cita = f.get('cita').trim();
  if (f.has('forms')) t.forms = f.get('forms').split(/[,;]/).map(x => x.trim()).filter(Boolean);
  t.cargo = f.get('cargo');
  t.ref = f.get('ref').trim();
  t.tipo = f.get('tipo');
  t.notas = f.get('notas').trim();
  if (f.has('dow')) t.dow = Number(f.get('dow'));
  if (f.has('dia')) t.dia = Number(f.get('dia')) || 1;
  if (f.has('mes')) t.mes = Number(f.get('mes')) || 1;
  if (f.has('meses')) t.meses = Number(f.get('meses')) || 0;
  if (f.has('evento')) t.evento = f.get('evento');
  if (f.has('dias')) t.dias = Number(f.get('dias')) || 0;
  if (f.has('ancla')) t.ancla = f.get('ancla'); else if (t.tipo === 'relativa') delete t.ancla;
  if (f.has('proxima')) t.proxima = f.get('proxima') || null;
  if (f.has('revisarCada')) {
    const v = Number(f.get('revisarCada')) || 0;
    if (!v) delete t.revisarCada;
    else if (t.revisarCada !== v) { t.revisarCada = v; if (!t.ultimaRevision && !t.revisarDesde) t.revisarDesde = hoyISO(); }
  } else if (t.tipo !== 'permanente') delete t.revisarCada;
  const cambioRepeticion = antes.tipo !== t.tipo || antes.dow !== t.dow || antes.dia !== t.dia || antes.mes !== t.mes;
  if (['semanal', 'mensual', 'anual'].includes(t.tipo) && (cambioRepeticion || !t.proxima)) t.proxima = primeraFecha(t);
  if (f.has('recordatorio')) {
    if (t.recordatorio !== f.get('recordatorio')) delete AVISADOS[t.id];
    t.recordatorio = f.get('recordatorio');
  }
  if (f.has('estado')) {
    const est = f.get('estado');
    if (est === 'hecho' && !situacion(t).hecha) { completar(t, false); }
    else if (est !== 'hecho') {
      t.estado = est;
      if (t.tipo === 'relativa') { t.hechoPara = null; t.omitidoPara = null; }
    }
  }
}

function agregarEntrada(reg, fecha, nota) {
  reg.historial = reg.historial || [];
  reg.historial.push({ fecha: fecha || hoyISO(), nota: (nota || '').trim() });
}
function bloqueHistorial(tipo, reg, ctx) {
  const h = (reg.historial || []).map((x, i) => ({ x, i })).sort((a, b) => (b.x.fecha || '').localeCompare(a.x.fecha || ''));
  return `<div class="hist-bloque"><span class="hist-tit">Historial (${h.length})</span>
    ${h.length ? h.map(({ x, i }) => `<button type="button" class="renglon" data-h="${tipo}|${reg.id}|${i}|${ctx}"><span class="t">${esc(fechaLarga(x.fecha))}${x.nota ? ': ' + esc(x.nota) : ''}</span><span class="f">Editar</span></button>`).join('') : '<div class="ayuda">Todavía no hay registros.</div>'}
    <button type="button" class="mini" data-h="${tipo}|${reg.id}|-1|${ctx}" style="margin-top:6px">+ Agregar registro</button></div>`;
}
const regPorTipo = (tipo, id) => tipo === 'tarea' ? DB.tareas.find(x => x.id === id) : DB.publicadores.find(x => x.id === id);
let entradaEd = null;
function abrirEntrada(tipo, id, idx, ctx) {
  const reg = regPorTipo(tipo, id); if (!reg) return;
  const nueva = idx < 0, e = nueva ? { fecha: hoyISO(), nota: '' } : (reg.historial || [])[idx];
  if (!e) return;
  entradaEd = { tipo, id, idx, ctx };
  abrirHoja(`<h3>${nueva ? 'Agregar registro' : 'Editar registro'}</h3>
    <div style="font-weight:600;font-size:14px;margin-bottom:8px">${esc(tipo === 'tarea' ? reg.titulo : nombreCorto(reg))}</div>
    <form id="formEntrada">
      <div class="campo"><span>Fecha</span>${selectorFecha('fecha', e.fecha)}</div>
      <label class="campo"><span>Detalle</span><textarea name="nota" placeholder="Qué se hizo, con quién, resultado...">${esc(e.nota || '')}</textarea></label>
      <div class="acciones">
        <button class="boton" type="submit">Guardar</button>
        <button class="boton sec" type="button" id="btnEntradaVolver">Cancelar</button>
        ${nueva ? '' : '<button class="boton peligro" type="button" id="btnEntradaBorrar">Eliminar registro</button>'}
      </div></form>`);
}
function cerrarEntrada() {
  const ed = entradaEd; entradaEd = null;
  if (ed && ed.ctx === 'tarea') { const t = regPorTipo('tarea', ed.id); tareaEditando = { t, nueva: false }; pintarTarea(t); }
  else if (ed && ed.ctx === 'pub') abrirHistPub(ed.id);
  else cerrarHoja();
  render();
}
function abrirHistPub(id) {
  const p = DB.publicadores.find(x => x.id === id); if (!p) return;
  abrirHoja(`<h3>Historial de necesidades</h3><div style="font-weight:600;font-size:14px;margin-bottom:8px">${esc(nombreCorto(p))}</div>
    ${bloqueHistorial('pub', p, 'pub')}
    <div class="acciones"><button class="boton sec" type="button" id="btnCerrar">Cerrar</button></div>`);
}
let filtroHist = { q: '', cargo: '', vista: 'fecha', abiertos: [], omitidas: false };
function todasEntradas() {
  const out = [];
  tareasTodas().forEach(t => (t.historial || []).forEach((h, i) => { if (!h.omitida || filtroHist.omitidas) out.push({ tipo: 'tarea', id: t.id, idx: i, fecha: h.fecha || '', nota: h.nota || '', titulo: t.titulo, cargo: t.cargo, omitida: !!h.omitida }); }));
  pubsActivos().forEach(x => (x.historial || []).forEach((h, i) => out.push({ tipo: 'pub', id: x.id, idx: i, fecha: h.fecha || '', nota: h.nota || '', titulo: 'Necesidad: ' + nombreCorto(x), cargo: 'necesidades' })));
  return out.sort((a, b) => b.fecha.localeCompare(a.fecha));
}
function tarjetaEntrada(e, conCargo) {
  const c = e.cargo === 'necesidades' ? null : cargoPorId(e.cargo);
  return `<button class="tarea" data-h="${e.tipo}|${e.id}|${e.idx}|lista" style="margin-bottom:8px"><div class="t">${esc(e.titulo)}</div>
    <div class="meta"><span class="chip ${e.omitida ? 'ambar' : 'verde'}">${esc(fechaLarga(e.fecha))}</span>${conCargo && c ? `<span class="chip cargo" style="--c:${c.color}">${esc(c.nombre)}</span>` : ''}${e.nota ? `<span class="chip">${esc(e.nota.length > 70 ? e.nota.slice(0, 70) + '...' : e.nota)}</span>` : ''}</div></button>`;
}
function vistaHistorial() {
  const q = normal(filtroHist.q), porCargo = filtroHist.vista === 'cargo';
  const todas = todasEntradas().filter(e => (!filtroHist.cargo || e.cargo === filtroHist.cargo) && (!q || normal(e.titulo + ' ' + e.nota).includes(q)));
  let html = cabecera('Historial', 'CONGREGACIÓN CHICHICAXTLE', 'var(--morado)', todas.length + (todas.length === 1 ? ' REGISTRO' : ' REGISTROS'));
  html += `<div class="segmento"><button type="button" class="${!porCargo ? 'on' : ''}" data-vista-hist="fecha">Por fecha</button><button type="button" class="${porCargo ? 'on' : ''}" data-vista-hist="cargo">Por cargo</button></div>
    <input class="buscador" type="search" id="buscarHist" placeholder="Buscar en el historial" value="${esc(filtroHist.q)}">
    <label class="chk-omitidas"><input type="checkbox" id="chkOmitidas" ${filtroHist.omitidas ? 'checked' : ''}> Incluir las tareas omitidas</label>
    <select class="buscador" id="filtroHistCargo"><option value="">Todos los cargos</option>${cargosOrden().map(c => `<option value="${c.id}" ${filtroHist.cargo === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}<option value="necesidades" ${filtroHist.cargo === 'necesidades' ? 'selected' : ''}>Necesidades de los publicadores</option></select>`;
  if (!todas.length) html += '<div class="vacio" style="margin-top:12px">Todavía no hay registros. Aparecen cuando marcas algo como hecho o cuando atiendes una necesidad.</div>';
  if (porCargo) {
    cargosOrden().map(c => c.id).concat('necesidades').forEach(id => {
      const l = todas.filter(e => e.cargo === id);
      if (!l.length) return;
      const c = id === 'necesidades' ? { nombre: 'Necesidades de los publicadores', color: 'var(--morado)' } : cargoPorId(id);
      const abierto = filtroHist.abiertos.includes(id) || !!filtroHist.q || !!filtroHist.cargo;
      html += `<details class="hist-cargo" data-hc="${id}" ${abierto ? 'open' : ''}><summary><span class="punto" style="background:${c.color}"></span>${esc(c.nombre)}<span class="cuenta">${l.length}</span></summary>
        ${l.slice(0, 60).map(e => tarjetaEntrada(e, false)).join('')}${l.length > 60 ? '<p class="ayuda">Se muestran los 60 más recientes de este cargo.</p>' : ''}</details>`;
    });
  } else {
    const lista = todas.slice(0, 150);
    let mes = '';
    lista.forEach(e => {
      const m = (e.fecha || '').slice(0, 7);
      if (m !== mes) { mes = m; html += `<div class="titulo-mes">${m ? MESES[Number(m.slice(5)) - 1] + ' de ' + m.slice(0, 4) : 'Sin fecha'}</div>`; }
      html += tarjetaEntrada(e, true);
    });
    if (todas.length > lista.length) html += `<p class="ayuda" style="margin-top:8px">Se muestran los ${lista.length} más recientes. Usa el buscador para ver los demás.</p>`;
  }
  vista.innerHTML = html;
}
document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.dataset || !d.dataset.hc) return;
  const a = filtroHist.abiertos, i = a.indexOf(d.dataset.hc);
  if (d.open && i < 0) a.push(d.dataset.hc); else if (!d.open && i >= 0) a.splice(i, 1);
}, true);

function completar(t, conToast = true, fecha, nota) {
  agregarEntrada(t, fecha, nota);
  if (['semanal', 'mensual', 'anual'].includes(t.tipo) || (t.tipo === 'intervalo' && t.meses > 0)) {
    t.proxima = siguienteFecha(t);
    t.estado = 'pendiente';
    t.recordatorio = '';
    if (conToast) toast('Hecho. Próxima: ' + fechaLarga(t.proxima));
  } else if (t.tipo === 'evento') {
    t.estado = 'pendiente';
    if (conToast) toast('Registrado en el historial');
  } else if (t.tipo === 'relativa') {
    t.hechoPara = baseEvento(t) || null;
    t.estado = 'pendiente';
    if (conToast) toast('Marcada como hecha');
  } else {
    t.estado = 'hecho';
    if (conToast) toast('Marcada como hecha');
  }
}

/* Omitir: la tarea atrasada no se hizo y no se marca como hecha. Las que se repiten pasan a su siguiente fecha;
   las ligadas a una fecha clave esperan al siguiente evento. Queda "Omitida" en el historial. */
const omitible = (t) => situacion(t).clase === 'vencida' && (esRecurrente(t) || t.tipo === 'relativa');
function omitir(t) {
  if (!omitible(t)) return false;
  agregarEntrada(t, hoyISO(), 'Omitida');
  t.historial[t.historial.length - 1].omitida = true;
  if (t.tipo === 'relativa') t.omitidoPara = baseEvento(t);
  else t.proxima = siguienteFecha(t);
  t.estado = 'pendiente'; t.recordatorio = '';
  marcarCambio('tareas', t);
  return true;
}
function omitirVarias(lista, donde) {
  const vencidas = lista.filter(t => situacion(t).clase === 'vencida'), lote = vencidas.filter(omitible), otras = vencidas.length - lote.length;
  if (!lote.length) return toast('No hay atrasadas que se puedan omitir');
  const msg = '¿Omitir ' + lote.length + (lote.length === 1 ? ' tarea atrasada' : ' tareas atrasadas') + donde + '?\n\nNo se marcan como hechas: las que se repiten pasan a su siguiente fecha, las ligadas a un evento esperan al siguiente, y en el historial queda "Omitida".' + (otras ? '\n\n' + otras + ' atrasada(s) de otro tipo no se tocan.' : '');
  if (!confirm(msg)) return;
  lote.forEach(omitir);
  render(); toast(lote.length === 1 ? 'Tarea omitida' : lote.length + ' tareas omitidas');
}

hoja.addEventListener('change', (e) => {
  if (e.target.name === 'evento' && tareaEditando && $('#formTarea')) {
    const fd = new FormData($('#formTarea'));
    const t = Object.assign({}, tareaEditando.t, { tipo: 'relativa', evento: e.target.value, dias: Number(fd.get('dias')) || 0, ancla: fd.get('ancla') || undefined });
    $('#camposTipo').innerHTML = camposTipo(t);
  }
  if (e.target.id === 'selTipo' && tareaEditando) {
    const t = Object.assign({}, tareaEditando.t, { tipo: e.target.value });
    $('#camposTipo').innerHTML = camposTipo(t);
  }
});
hoja.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'formTarea') {
    leerFormTarea(e.target);
    if (!tareaEditando.t.titulo) return;
    if (tareaEditando.nueva) DB.tareas.push(tareaEditando.t);
    marcarCambio('tareas', tareaEditando.t);
    cerrarHoja(); render(); toast('Guardado');
  }
  if (e.target.id === 'formPub') guardarPubForm(e.target);
  if (e.target.id === 'formFicha' && fichaEd && leerFicha(true)) { cerrarHoja(); render(); toast('Guardado'); }

    const reg = regPorTipo(entradaEd.tipo, entradaEd.id), fd = new FormData(e.target);
    if (!fd.get('fecha')) return toast('Elige el día, el mes y el año');
    const dato = { fecha: fd.get('fecha'), nota: (fd.get('nota') || '').trim() };
    reg.historial = reg.historial || [];
    if (entradaEd.idx < 0) reg.historial.push(dato); else reg.historial[entradaEd.idx] = dato;
    marcarCambio(entradaEd.tipo === 'tarea' ? 'tareas' : 'publicadores', reg);

  }
});
hoja.addEventListener('click', (e) => {

  const hb = e.target.closest('[data-h]');

/* ================= Edición de hermanos ================= */
let pubEditando = null;
function abrirPub(id, grupoNuevo) {
  const p = id ? DB.publicadores.find(x => x.id === id)

function exportar() {
  const blob = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respaldo_pendientes_' + hoyISO() + '.json';

  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importar(file) {
  const r = new FileReader();
  r.onload = () => {
    let datos;
    try { datos = JSON.parse(r.result); } catch (e) { return toast('El archivo no es un respaldo válido'); }
    if (Array.isArray(datos.tareas) || Array.isArray(datos.publicadores)) {
      fusionar(datos, true);
      toast('Datos importados');
    } else {
      let n = 0;
      Object.entries(datos).forEach(([id, v]) => {
        const p = DB.publicadores.find(x => x.id === id);
        if (p && v && v.texto && v.texto.trim()) { p.necesidad = v.texto; p.estado = p.estado || 'pendiente'; marcarCambio('publicadores', p); n++; }
      });
      toast(n ? n + ' necesidades importadas' : 'No se encontraron necesidades que coincidan');
    }
    render();
  };
  r.readAsText(file);
}

/* ================= Sincronización ================= */
let enviando = false, errorSync = '', temporizadorEnvio = null;

function fusionar(remoto, marcarSucio) {
  ['tareas', 'publicadores', 'cargos', 'formularios'].forEach(tipo => {
    if (!Array.isArray(remoto[tipo])) return;
    const mapa = new Map(DB[tipo].map(x => [x.id, x]));
    remoto[tipo].forEach(r => {
      const l = mapa.get(r.id);
      if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) {
        if (l) Object.keys(l).forEach(k => delete l[k]), Object.assign(l, r);
        else { DB[tipo].push(r); mapa.set(r.id, r); }
        if (marcarSucio && SUCIOS[tipo] && !SUCIOS[tipo].includes(r.id)) SUCIOS[tipo].push(r.id);
      }
    });
  });
  if (remoto.fechas && (remoto.fechas.updatedAt || 0) > (DB.fechas.updatedAt || 0)) {
    DB.fechas = remoto.fechas;
    if (marcarSucio) SUCIOS.fechas = true;
  }
  normalizar();
  guardarLocal();
}

function normalizar() {
  /* Una marca de tiempo en el futuro (de una actualización anterior) hacía perder las ediciones; se trata como 0 para que gane la de la hoja. */
  ['tareas', 'publicadores', 'cargos', 'formularios'].forEach(tipo => DB[tipo].forEach(r => { if ((r.updatedAt || 0) > 4e12) r.updatedAt = 0; }));
  if ((DB.fechas.updatedAt || 0) > 4e12) DB.fechas.updatedAt = 0;
  DB.tareas.forEach(t => {
    if (['semanal', 'mensual', 'anual'].includes(t.tipo) && !t.proxima) {
      t.proxima = primeraFecha(t);
      t.updatedAt = Date.now();
      if (!SUCIOS.tareas.includes(t.id)) SUCIOS.tareas.push(t.id);
    }
  });
}

function paquete() {
  const tomar = (tipo) => SUCIOS[tipo].map(id => DB[tipo].find(x => x.id === id)).filter(Boolean);
  return {
    clave: CFG.clave, accion: 'guardar', dispositivo: DISP,
    tareas: tomar('tareas'), publicadores: tomar('publicadores'), cargos: tomar('cargos'),
    fechas: SUCIOS.fechas ? DB.fechas : null
  };
}

function programarEnvio() {
  refrescarEstadoSync();
  if (!CFG.url) return;
  clearTimeout(temporizadorEnvio);
  temporizadorEnvio = setTimeout(() => sincronizar(false), 1200);
}

/* Un error de sincronización cuyo texto se muestra tal cual en la app */
function falloSync(mensaje) { const e = new Error(mensaje); e.visible = true; return e; }

async function sincronizar(manual) {
  if (!CFG.url) { if (manual) toast('Primero pon la dirección del script'); return; }
  if (enviando) return;
  enviando = true; refrescarEstadoSync();
  const cuerpo = paquete();
  const enviados = {
    tareas: cuerpo.tareas.map(x => [x.id, x.updatedAt]),
    publicadores: cuerpo.publicadores.map(x => [x.id, x.updatedAt]),
    cargos: cuerpo.cargos.map(x => [x.id, x.updatedAt])
  };
  const fechasEnviadas = cuerpo.fechas ? cuerpo.fechas.updatedAt : null;
  try {
    let resp;
    try { resp = await fetch(CFG.url, { method: 'POST', body: JSON.stringify(cuerpo), redirect: 'follow' }); }
    catch (e) { throw falloSync('Sin conexión con la hoja (' + (e.message || 'la red rechazó la petición') + ')'); }
    if (!resp.ok) throw falloSync('El script respondió con error HTTP ' + resp.status);
    let r;
    try { r = await resp.json(); }
    catch (e) { throw falloSync('La respuesta del script no es válida: revisa que la implementación sea para cualquier persona y que la dirección termine en /exec'); }
    if (!r.ok) {
      const motivos = {
        'Dispositivo pendiente': 'Esperando aprobación en la hoja',
        'Dispositivo bloqueado': 'Este dispositivo está bloqueado',
        'Clave incorrecta': 'Clave incorrecta',
        'Bloqueado temporalmente': 'Acceso bloqueado por intentos fallidos'
      };
      throw falloSync(motivos[r.error] || 'Error del script: ' + (r.error || 'sin detalle'));
    }
    ['tareas', 'publicadores', 'cargos'].forEach(tipo => {
      enviados[tipo].forEach(([id, ts]) => {
        const reg = DB[tipo].find(x => x.id === id);
        if (reg && reg.updatedAt === ts) SUCIOS[tipo] = SUCIOS[tipo].filter(x => x !== id);
      });
    });
    if (fechasEnviadas && DB.fechas.updatedAt === fechasEnviadas) SUCIOS.fechas = false;
    const escribiendo = document.activeElement && document.activeElement.matches('textarea, input');
    fusionar(r.datos, false);
    renovarVencidas();
    CFG.ultimoSync = Date.now(); guardarCfg();
    errorSync = '';
    if (manual) toast('Sincronizado');
    if (!escribiendo && !hoja.classList.contains('abierta')) render();
  } catch (err) {
    errorSync = err.visible ? err.message : 'Error al procesar los datos recibidos (' + err.message + ')';
    if (manual) toast(errorSync);
  } finally {
    enviando = false; refrescarEstadoSync();
    const quedan = SUCIOS.tareas.length + SUCIOS.publicadores.length + SUCIOS.cargos.length + (SUCIOS.fechas ? 1 : 0);
    if (quedan && !errorSync) programarEnvio();
  }
}

/* Envío al cerrar o cambiar de app */
function enviarAlSalir() {
  if (!CFG.url) return;
  const cuerpo = paquete();
  if (!cuerpo.tareas.length && !cuerpo.publicadores.length && !cuerpo.cargos.length && !cuerpo.fechas) return;
  try { navigator.sendBeacon(CFG.url, new Blob([JSON.stringify(cuerpo)], { type: 'text/plain' })); } catch (e) {}
}
window.addEventListener('pagehide', enviarAlSalir);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    enviarAlSalir();
    ocultaDesde = Date.now();
  } else {
    if (ocultaDesde && Date.now() - ocultaDesde > MINUTOS_PARA_BLOQUEAR * 60000) bloquear();
    ocultaDesde = null;
    if (renovarVencidas()) render();
    sincronizar(false);
  }
});
window.addEventListener('online', () => sincronizar(false));
setInterval(() => { if (document.visibilityState === 'visible') sincronizar(false); }, 30000);

/* ================= Recordatorios ================= */
function revisarRecordatorios() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const ahora = new Date();
  tareasActivas().forEach(t => {
    if (!t.recordatorio || AVISADOS[t.id] === t.recordatorio || situacion(t).clase === 'hecha') return;
    if (new Date(t.recordatorio) <= ahora) {
      AVISADOS[t.id] = t.recordatorio;
      localStorage.setItem(LS_AVISADOS, JSON.stringify(AVISADOS));
      const cuerpo = cargoPorId(t.cargo).nombre;
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(reg => reg.showNotification(t.titulo, { body: cuerpo, icon: 'icon-192.png', tag: t.id }));
      } else new Notification(t.titulo, { body: cuerpo, icon: 'icon-192.png' });
    }
  });
}
setInterval(revisarRecordatorios, 60000);

/* ================= Bloqueo con huella o rostro ================= */
const aB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const deB64 = (txt) => Uint8Array.from(atob(txt), c => c.charCodeAt(0));
const retoAleatorio = () => crypto.getRandomValues(new Uint8Array(32));

async function biometriaDisponible() {
  try { return !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch (e) { return false; }
}

async function verificarIdentidad() {
  await navigator.credentials.get({ publicKey: {
    challenge: retoAleatorio(),
    allowCredentials: [{ type: 'public-key', id: deB64(BIO.credId) }],
    userVerification: 'required',
    timeout: 60000
  } });
}

async function activarBiometria() {
  if (!await biometriaDisponible()) return toast('Este celular no tiene huella o rostro disponibles para la app');
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: retoAleatorio(),
      rp: { name: 'JWCore' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'ancianos', displayName: 'JWCore' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000
    } });
    BIO.credId = aB64(cred.rawId);
    localStorage.setItem(LS_BIO, JSON.stringify(BIO));
    toast('Bloqueo activado');
    render();
  } catch (e) { toast('No se activó el bloqueo'); }
}

async function desactivarBiometria() {
  try {
    await verificarIdentidad();
    BIO.credId = null;
    localStorage.setItem(LS_BIO, JSON.stringify(BIO));
    toast('Bloqueo desactivado');
    render();
  } catch (e) { toast('No se pudo verificar tu identidad'); }
}

async function desbloquear() {
  try {
    await verificarIdentidad();
    bloqueada = false;
    render();
  } catch (e) { toast('No se pudo verificar. Intenta de nuevo'); }
}

function bloquear() {
  if (!BIO.credId) return;
  bloqueada = true;
  cerrarHoja();
  render();
}

function vistaBloqueo() {
  vista.innerHTML = `<div class="bloqueo">
    ${cabecera('JWCore', 'CONGREGACIÓN CHICHICAXTLE', 'var(--navy)', 'APP BLOQUEADA')}
    <button class="boton" id="btnDesbloquear">Desbloquear con huella o rostro</button>
    <p>Si tu celular lo permite, también puedes usar su PIN o patrón.</p>
  </div>`;
}

/* ================= Navegación ================= */
function render() {
  document.body.classList.toggle('bloqueada', bloqueada);
  if (bloqueada) return vistaBloqueo();
  const h = (location.hash || '#inicio').slice(1);
  const [ruta, param] = h.split('/');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('activo',
    a.dataset.r === ruta || (ruta === 'cargo' && a.dataset.r === 'cargos') || (ruta === 'proximas' && a.dataset.r === 'inicio')));
  if (ruta === 'cargos') vistaCargos();
  else if (ruta === 'cargo' && param) vistaCargo(param);
  else if (ruta === 'necesidades') vistaNecesidades(param);
  else if (ruta === 'proximas') vistaProximas();
  else if (ruta === 'historial') vistaHistorial();
  else if (ruta === 'formularios') vistaFormularios();
  else if (ruta === 'ajustes') vistaAjustes();
  else vistaInicio();
}
window.addEventListener('hashchange', () => { cerrarHoja(); render(); window.scrollTo(0, 0); });

let temporizadorToast;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => t.style.display = 'none', 2200);
}

/* ================= Inicio ================= */
normalizar(); guardarLocal(); renovarVencidas();
render();
{ const n = recordatoriosPub().filter(x => x.aviso).length; if (n) toast(n === 1 ? 'Tienes 1 recordatorio de un hermano' : 'Tienes ' + n + ' recordatorios de hermanos'); }
revisarRecordatorios();
sincronizar(false);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
