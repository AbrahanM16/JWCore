<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<title>JWCore</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3A5F;
    --morado: #6B2D6B;
    --dorado: #B5973A;
    --tinta: #1E2430;
    --gris: #5E6470;
    --gris-suave: #8A8F98;
    --linea: #DDDFE3;
    --fondo: #F3F4F6;
    --panel: #FFFFFF;
    --caja: #F4F4F2;
    --rojo: #B3261E;
    --ambar: #B7791F;
    --verde: #2E7D46;
    --nav-alto: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--fondo);
    color: var(--tinta);
    font-size: 15px;
    line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(var(--nav-alto) + env(safe-area-inset-bottom, 0px));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--dorado); outline-offset: 2px; }

  .contenedor { max-width: 760px; margin: 0 auto; padding: 14px 14px 24px; }

  /* Encabezados tipo carta */
  .cabecera {
    border-radius: 10px;
    padding: 18px 18px 16px;
    color: #fff;
    background: var(--c, var(--navy));
    margin-bottom: 14px;
  }
  .cabecera h1 { font-size: 21px; font-weight: 800; line-height: 1.15; }
  .cabecera .sub { font-size: 11px; letter-spacing: .12em; opacity: .85; margin-top: 3px; }
  .cabecera .lema { color: #E8C766; font-weight: 700; font-size: 15px; margin-top: 10px; }
  .pildora {
    display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12);
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
  }
  .fila-sync { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

  .estado-sync { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.14); }

  h2.titulo-seccion {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 15px; font-weight: 700; color: var(--navy);
    margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--linea);
  }
  h2.titulo-seccion .cuenta { font-size: 12px; font-weight: 600; color: var(--gris-suave); }

  /* Resumen */
  .resumen { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 560px) { .resumen { grid-template-columns: repeat(4, 1fr); } }
  .dato {
    background: var(--panel); border: 1px solid var(--linea); border-radius: 8px;
    padding: 10px 12px; text-align: left; border-left: 4px solid var(--c, var(--navy));
  }
  .dato b { display: block; font-size: 24px; font-weight: 800; color: var(--c, var(--navy)); line-height: 1.1; }
  .dato span { font-size: 12px; color: var(--gris); }

  /* Botones de secciones */
  .secciones { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 560px) { .secciones { grid-template-columns: 1fr 1fr; } }
  .boton-seccion {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; background: var(--panel);
    border: 1px solid var(--linea); border-left: 5px solid var(--c, var(--navy));
    border-radius: 8px; padding: 12px 14px;
  }
  .boton-seccion .nombre { font-weight: 600; font-size: 14px; }
  .boton-seccion .persona { font-size: 12px; color: var(--gris-suave); }
  .contador {
    min-width: 28px; text-align: center; font-size: 12px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; background: var(--caja); color: var(--gris);
  }
  .contador.alerta { background: var(--rojo); color: #fff; }

  /* Tarjetas de tarea */
  .lista { display: flex; flex-direction: column; gap: 8px; }
  .tarea {
    background: var(--panel); border: 1px solid var(--linea); border-radius: 8px;
    border-left: 4px solid var(--gris-suave); padding: 10px 12px; text-align: left; width: 100%;
  }
  .tarea.vencida { border-left-color: var(--rojo); }
  .tarea.proxima { border-left-color: var(--ambar); }
  .tarea.hecha { border-left-color: var(--verde); opacity: .7; }
  .tarea .t { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .tarea .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .chip {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--caja); color: var(--gris); border: 1px solid var(--linea);
  }
  .chip.cargo { color: #fff; border-color: transparent; background: var(--c, var(--navy)); }
  .chip.rojo { background: #FBE9E7; color: var(--rojo); border-color: #F3C7C2; }
  .chip.ambar { background: #FDF3E1; color: var(--ambar); border-color: #F1DDB3; }
  .chip.verde { background: #E6F3EA; color: var(--verde); border-color: #C3E1CC; }
  .chip.ref { background: #fff; }
  .vacio { font-size: 13.5px; color: var(--gris); background: var(--caja); border-radius: 8px; padding: 12px 14px; }

  .permanente { background: var(--caja); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
  .permanente + .permanente { margin-top: 6px; }
  .permanente .chip { margin-left: 6px; }

  /* Necesidades */
  .segmentos { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .segmento {
    flex-shrink: 0; border: 1.5px solid var(--linea); background: var(--panel);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--gris);
  }
  .segmento.activo { background: var(--c, var(--navy)); border-color: transparent; color: #fff; }
  .buscador {
    width: 100%; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--linea);
    border-radius: 8px; background: var(--panel);
  }
  .pub {
    background: var(--panel); border: 1px solid var(--linea); border-radius: 8px;
    border-left: 4px solid var(--linea); padding: 10px 12px;
  }
  .pub.pendiente { border-left-color: var(--ambar); }
  .pub.atendido { border-left-color: var(--verde); }
  .pub-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .pub-nombre { font-weight: 600; font-size: 14px; }
  .pub-completo { font-size: 11.5px; color: var(--gris-suave); }
  .pub textarea {
    width: 100%; min-height: 48px; resize: vertical; margin-top: 8px;
    border: 1px solid var(--linea); border-radius: 6px; padding: 8px; background: var(--caja); font-size: 14px;
  }
  .pub-pie { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .mini {
    border: 1px solid var(--linea); background: var(--panel); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--gris);
  }
  .mini.on-pendiente { background: var(--ambar); color: #fff; border-color: transparent; }
  .mini.on-atendido { background: var(--verde); color: #fff; border-color: transparent; }
  .fecha-atendido { font-size: 11.5px; color: var(--gris-suave); }

  /* Formularios */
  .panel { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 14px; }
  .campo { display: block; margin-bottom: 12px; }
  .campo > span { display: block; font-size: 12.5px; font-weight: 600; color: var(--gris); margin-bottom: 4px; }
  .campo input, .campo select, .campo textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 8px; background: #fff; font-size: 14.5px;
  }
  .campo textarea { min-height: 80px; resize: vertical; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dos > * { min-width: 0; }
  .ayuda { font-size: 12px; color: var(--gris-suave); margin-top: 4px; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .boton {
    border: none; border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: 14px;
    background: var(--navy); color: #fff;
  }
  .boton.sec { background: var(--caja); color: var(--tinta); border: 1px solid var(--linea); }
  .boton.verde { background: var(--verde); }
  .boton.peligro { background: #fff; color: var(--rojo); border: 1px solid #F3C7C2; }
  .boton-agregar {
    width: 100%; margin-top: 10px; padding: 11px; border-radius: 8px;
    border: 1.5px dashed var(--linea); background: transparent; font-weight: 600; color: var(--gris);
  }
  /* Cargos desplegables */
  .acordeon { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; }
  .acordeon + .acordeon { margin-top: 10px; }
  .acordeon > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 14px; background: var(--c, var(--navy)); color: #fff;
  }
  .acordeon > summary::-webkit-details-marker { display: none; }
  .acordeon > summary .nombre { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
  .acordeon > summary .persona { font-size: 11.5px; opacity: .85; }
  .acordeon > summary .cuentas { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
  .acordeon > summary .cuentas span { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.18); }
  .acordeon > summary .cuentas span.alerta { background: #fff; color: var(--rojo); }
  .acordeon > summary .flecha { font-size: 12px; transition: transform .15s; }
  .acordeon[open] > summary .flecha { transform: rotate(180deg); }
  .acordeon .cuerpo { padding: 4px 14px 12px; }
  .grupo-lista { font-size: 11.5px; font-weight: 700; color: var(--gris-suave); margin: 12px 0 4px; }
  .renglon {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%;
    text-align: left; background: none; border: none; border-bottom: 1px solid var(--linea); padding: 9px 0;
  }
  .renglon .t { font-size: 13.5px; line-height: 1.35; }
  .renglon .f { font-size: 11.5px; font-weight: 600; color: var(--gris-suave); white-space: nowrap; flex-shrink: 0; }
  .renglon .f.rojo { color: var(--rojo); }
  .renglon .f.ambar { color: var(--ambar); }
  .renglon .f.verde { color: var(--verde); }
  .abrir-seccion {
    display: block; text-align: center; margin-top: 12px; padding: 9px; border-radius: 8px;
    background: var(--caja); color: var(--tinta); font-weight: 600; font-size: 13px; text-decoration: none;
  }
  @media (prefers-reduced-motion: reduce) { .acordeon > summary .flecha { transition: none; } }
  .fila-cargo { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
  .fila-cargo:last-child { border-bottom: none; }

  /* Hoja modal */
  .velo { position: fixed; inset: 0; background: rgba(20,24,32,.45); z-index: 40; display: none; }
  .velo.abierto { display: block; }
  .hoja {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    max-height: 90vh; overflow-y: auto; background: var(--fondo);
    border-radius: 14px 14px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); transition: transform .22s ease;
    max-width: 760px; margin: 0 auto;
  }
  .hoja.abierta { transform: translateY(0); }
  .hoja h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--navy); }
  .historial { font-size: 12.5px; color: var(--gris); margin: 4px 0 12px; }
  .historial li { margin-left: 18px; }
  @media (prefers-reduced-motion: reduce) { .hoja { transition: none; } }

  /* Navegación inferior */
  nav.inferior {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--panel); border-top: 1px solid var(--linea);
    display: grid; grid-template-columns: repeat(6, 1fr);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.inferior a {
    height: var(--nav-alto); display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-decoration: none; color: var(--gris-suave); font-size: 10px; font-weight: 600; gap: 2px;
  }
  nav.inferior a .ico { font-size: 19px; line-height: 1; }
  nav.inferior a.activo { color: var(--navy); }
  nav.inferior a.activo .ico { transform: scale(1.08); }

  /* Fuente y formularios */
  .fuente { background: var(--caja); border-left: 4px solid var(--dorado); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; }
  .fuente-tit { font-size: 11.5px; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .06em; }
  .fuente-ref { font-weight: 600; font-size: 13px; margin-top: 4px; }
  .fuente blockquote { font-size: 13px; margin-top: 6px; line-height: 1.5; color: var(--tinta); }
  .fuente .meta { margin-top: 8px; }
  .formchip { cursor: pointer; border: 1px solid var(--navy); color: var(--navy); background: #fff; }
  .tarjeta-form { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; }
  .tarjeta-form + .tarjeta-form { margin-top: 8px; }
  .tarjeta-form .cod { display: inline-block; font-size: 12px; font-weight: 800; color: #fff; background: var(--navy); border-radius: 6px; padding: 2px 8px; margin-right: 6px; }
  .tarjeta-form .tit { font-weight: 600; font-size: 14px; }
  .tarjeta-form .para { font-size: 12.5px; color: var(--gris); margin-top: 4px; }
  .tarjeta-form.sin-archivo .cod { background: var(--gris-suave); }
  .nota-form { font-size: 12.5px; color: var(--gris); margin-top: 8px; }
  /* Cargos con menús, historial y nombramientos */
  .visita-sc { background: #EEF3FA; border-left: 4px solid var(--navy); border-radius: 8px; padding: 12px 12px 10px; margin: 0 0 14px; }
  .visita-tit { font-weight: 700; font-size: 14px; color: var(--navy); margin-bottom: 2px; }
  .visita-sub { font-size: 12px; color: var(--gris); margin-bottom: 10px; }
  .visita-et { display: block; font-size: 12.5px; font-weight: 700; color: var(--tinta); margin: 10px 0 4px; }
  .visita-et .ico { margin-right: 4px; }
  .visita-res { margin-top: 10px; padding: 8px 10px; background: #fff; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--navy); }
  .subpuesto { font-size: 12.5px; font-weight: 700; color: var(--navy); margin: 12px 0 4px; }
  .aux-bloque { margin-top: 10px; padding: 8px 10px; background: var(--caja); border-radius: 8px; }
  .super-grupo { margin-bottom: 10px; padding: 8px 10px; background: var(--caja); border-radius: 8px; }
  .super-grupo .fila-sel.con-num { margin-bottom: 0; }
  .aux-persona { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--linea); }
  .aux-persona-tit { display: block; font-size: 11.5px; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .aux-tit { font-size: 11.5px; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .aux-fila { margin-bottom: 8px; }
  .aux-nota { width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--linea); border-radius: 8px; background: #fff; font-size: 13px; }
  .fila-sel.con-num > select:first-child { flex: 1 1 0; font-size: 13.5px; padding-left: 8px; }
  .fila-sel.con-num select.num-grupo { flex: 0 0 66px; }
  .fila-sel.con-num .mini { flex: 0 0 40px; padding: 5px 0; }
  .resp { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 13.5px; }
  .resp-fila + .resp-fila { margin-top: 6px; }
  .resp-aux { font-size: 12.5px; color: var(--gris); }
  details.ocultas { margin-top: 14px; }
  details.ocultas > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--gris); padding: 8px 0; }
  .chk-omitidas { display: flex; align-items: center; gap: 8px; margin: 10px 2px 0; font-size: 13px; color: var(--gris); }
  .segmento { display: flex; margin: 10px 0 4px; border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; background: #fff; }
  .segmento button { flex: 1; padding: 9px 6px; border: 0; background: transparent; font-size: 13.5px; font-weight: 600; color: var(--gris); }
  .segmento button.on { background: var(--navy); color: #fff; }
  details.hist-cargo { margin: 10px 0; }
  details.hist-cargo > summary { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 11px 12px; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; font-weight: 600; font-size: 14px; list-style: none; }
  details.hist-cargo > summary::-webkit-details-marker { display: none; }
  details.hist-cargo[open] > summary { margin-bottom: 8px; }
  details.hist-cargo .punto { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  details.hist-cargo .cuenta { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--gris); background: var(--caja); border-radius: 999px; padding: 2px 9px; }
  .selfecha { display: flex; gap: 6px; flex-wrap: wrap; }
  .selfecha select { flex: 1 1 0; min-width: 0; padding: 10px 6px; border: 1px solid var(--linea); border-radius: 8px; background: #fff; font-size: 14px; }
  .selfecha select[data-sf="d"], .selfecha select[data-sf="h"], .selfecha select[data-sf="mi"] { flex: .7 1 0; }
  .selfecha select[data-sf="m"] { flex: 1.6 1 0; }
  .selfecha .hora { display: flex; gap: 6px; flex: 1 1 100%; }
  .selfecha .hora select { flex: 1 1 0; }
  .fila-cargo select { width: 100%; padding: 9px 11px; border: 1px solid var(--linea); border-radius: 8px; background: #fff; font-size: 14px; }
  .fila-sel { display: flex; gap: 6px; margin-top: 4px; }
  .fila-sel select { flex: 1; min-width: 0; }
  .auto-lista { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .hist-bloque, .registro { margin: 4px 0 12px; }
  .hist-tit { display: block; font-size: 12.5px; font-weight: 600; color: var(--gris); margin-bottom: 4px; }
  .titulo-mes { font-size: 12px; font-weight: 700; color: var(--gris-suave); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  select.buscador { margin-top: 8px; }
  body.bloqueada nav.inferior { display: none; }
  .bloqueo { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; }
  .bloqueo .boton { width: 100%; padding: 14px; font-size: 15px; margin-top: 6px; }
  .bloqueo p { font-size: 13.5px; color: var(--gris); text-align: center; margin-top: 12px; }
  .aviso-toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-alto) + 14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 9px 16px;
    border-radius: 999px; font-size: 13px; z-index: 60; display: none;
  }
</style>
</head>
<body>

<main class="contenedor" id="vista"></main>

<nav class="inferior" id="nav">
  <a href="#inicio" data-r="inicio"><span class="ico">🏠</span>Inicio</a>
  <a href="#cargos" data-r="cargos"><span class="ico">📋</span>Cargos</a>
  <a href="#necesidades" data-r="necesidades"><span class="ico">🤝</span>Necesidades</a>
  <a href="#historial" data-r="historial"><span class="ico">🕘</span>Historial</a>
  <a href="#formularios" data-r="formularios"><span class="ico">📄</span>Fuentes</a>
  <a href="#ajustes" data-r="ajustes"><span class="ico">⚙️</span>Ajustes</a>
</nav>

<div class="velo" id="velo"></div>
<section class="hoja" id="hoja" aria-modal="true" role="dialog"></section>
<div class="aviso-toast" id="toast"></div>

<script>
/* ================= Datos y almacenamiento local ================= */
const LS_DATOS = 'ancianos_pwa_datos_v1';
const LS_CFG = 'ancianos_pwa_cfg_v1';
const LS_SUCIOS = 'ancianos_pwa_sucios_v1';
const LS_AVISADOS = 'ancianos_pwa_avisados_v1';
const LS_BIO = 'ancianos_pwa_bio_v1';
const LS_DISP = 'ancianos_pwa_disp_v1';

const EVENTOS = {
  visitaSC: 'Visita del superintendente de circuito',
  asambleaCircuito: 'Asamblea de circuito',
  asambleaRegional: 'Asamblea regional',
  conmemoracion: 'Conmemoración',
  discursoEspecial: 'Discurso especial'
};/* Eventos que duran varios días: tienen fecha de inicio y de final */
const EVENTOS_RANGO = {

/* ================= Utilidades de fecha ================= */
function pad(n) { return String(n).padStart(2, '0'); }
function aISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function deISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function hoyISO() { return aISO(new Date()); }
function sumarDias(s, n) { const d = deISO(s); d.setDate(d.getDate() + n); return aISO(d); }
function sumarMeses(s, n, diaFijo) {
  const d = deISO(s);
  const dia = diaFijo || d.getDate();
  const objetivo = new Date(d.getFullYear(), d.getMonth() + n, 1, 12);
  const ultimo = new Date(objetivo.getFullYear(), objetivo.getMonth() + 1, 0).getDate();
  objetivo.setDate(Math.min(dia, ultimo));
  return aISO(objetivo);
}
function fechaLarga(s) {
  if (!s) return '';
  const d = deISO(s);
  return d.getDate() + ' de ' + MESES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' de ' + d.getFullYear() : '');
}
function diasHasta(s) { return Math.round((deISO(s) - deISO(hoyISO())) / 86400000); }

function primeraFecha(t) {
  const hoy = hoyISO();
  if (t.tipo === 'semanal') {
    const d = deISO(hoy);
    const falta = ((t.dow ?? 1) - d.getDay() + 7) % 7;
    return sumarDias(hoy, falta);
  }
  if (t.tipo === 'mensual') {
    const d = deISO(hoy);
    let f = sumarMeses(aISO(new Date(d.getFullYear(), d.getMonth(), 1, 12)), 0, t.dia || 1);
    if (f < hoy) f = sumarMeses(f, 1, t.dia || 1);
    return f;
  }
  if (t.tipo === 'anual') {
    const y = new Date().getFullYear();
    let f = aISO(new Date(y, (t.mes || 1) - 1, t.dia || 1, 12));
    if (f < hoy) f = aISO(new Date(y + 1, (t.mes || 1) - 1, t.dia || 1, 12));
    return f;
  }
  return null;
}
const esRecurrente = (t) => ['semanal', 'mensual', 'anual'].includes(t.tipo) || (t.tipo === 'intervalo' && t.meses > 0);
function pasoCiclo(t, x) {
  if (t.tipo === 'semanal') return sumarDias(x, 7);
  if (t.tipo === 'mensual') return sumarMeses(x, 1, t.dia);
  if (t.tipo === 'anual') return sumarMeses(x, 12, t.dia);
  return sumarMeses(x, t.meses);
}
function siguienteFecha(t) {
  if (!esRecurrente(t)) return null;
  const hoy = hoyISO();
  let n = pasoCiclo(t, t.proxima || hoy);
  while (n <= hoy) n = pasoCiclo(t, n);
  return n;
}
/* Renovación mixta: una tarea con repetición se queda en rojo mientras dura su ciclo y salta sola cuando llega la
   siguiente ocurrencia, dejando "Omitida" en su historial. Las ocultas no se tocan. */
function renovarVencidas() {
  const hoy = hoyISO();
  let n = 0;
  tareasActivas().forEach(t => {
    if (!esRecurrente(t) || !t.proxima) return;
    let f = t.proxima;
    const omitidas = [];
    while (omitidas.length < 500 && pasoCiclo(t, f) <= hoy) { omitidas.push(f); f = pasoCiclo(t, f); }
    if (!omitidas.length) return;
    agregarEntrada(t, omitidas[omitidas.length - 1], omitidas.length === 1 ? 'Omitida' : 'Omitida ' + omitidas.length + ' veces, desde el ' + fechaLarga(omitidas[0]));
    t.historial[t.historial.length - 1].omitida = true;
    t.proxima = f; t.estado = 'pendiente'; t.recordatorio = '';
    marcarCambio('tareas', t); n++;
  });
  return n;
}

function selectorFecha(name, valor, data, conHora) {

  const hh = ok && valor.length >= 16 ? Number(valor.slice(11, 13)) : null, mm = ok && valor.length >= 16 ? Number(valor.slice(14, 16)) : null;
  const ahora = new Date().getFullYear(), desde = Math.min(ahora - 1, y || ahora - 1), hasta = Math.max(ahora + 4, y || ahora + 4);
  const o = (v, t, sel) => `<option value="${v}" ${sel ? 'selected' : ''}>${t}</option>`;
  const lista = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const minutos = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]; if (mm !== null && !minutos.includes(mm)) minutos.push(mm), minutos.sort((x, z) => x - z);
  return `<div class="selfecha" ${conHora ? 'data-hora="1"' : ''}><input type="hidden" name="${name}" ${data ? `data-fecha="${data}"` : ''} value="${esc(ok ? valor.slice(0, conHora ? 16 : 10) : '')}">
    <select data-sf="d" aria-label="Día">${o('', 'Día', !d)}${lista(1, 31).map(x => o(x, x, x === d)).join('')}</select>
    <select data-sf="m" aria-label="Mes">${o('', 'Mes', !m)}${MESES.map((n, i) => o(i + 1, n, i + 1 === m)).join('')}</select>
    <select data-sf="a" aria-label="Año">${o('', 'Año', !y)}${lista(desde, hasta).map(x => o(x, x, x === y)).join('')}</select>
    ${conHora ? `<div class="hora"><select data-sf="h" aria-label="Hora">${o('', 'Hora', hh === null)}${lista(0, 23).map(x => o(x, pad(x) + ' h', x === hh)).join('')}</select>
    <select data-sf="mi" aria-label="Minutos">${o('', 'Min', mm === null)}${minutos.map(x => o(x, pad(x) + ' min', x === mm)).join('')}</select></div>` : ''}</div>`;
}
const selectorFechaHora = (name, valor) => selectorFecha(name, valor, '', true);
document.addEventListener('change', (e) => {

const anclaDe = (t) => t.ancla || ((t.dias || 0) > 0 ? 'fin' : 'inicio');
function baseEvento(t) {
  const f = DB.fechas;
  const rg = EVENTOS_RANGO[t.evento];
  if (rg) {
    const ini = f[t.evento], fin = f[rg.fin] || ini;
    return anclaDe(t) === 'fin' ? fin : ini;
  }
  return f[t.evento];
}
/* Responsabilidades permanentes con recordatorio de revisión: cada cierto número de meses piden que las revises */
function revision(t) {
  if (t.tipo !== 'permanente' || !t.revisarCada) return null;
  const base = t.ultimaRevision || t.revisarDesde;
  if (!base) return null;
  const fecha = sumarMeses(base, t.revisarCada);

}
function situacion(t) {
  if (t.tipo === 'permanente') { const r = revision(t); return r ? { clase: 'permanente', revisar: r.toca, proxRev: r.fecha } : { clase: 'permanente' }; }
  if (t.tipo === 'evento') return { clase: 'evento', hecha: t.estado === 'hecho' };
  let fecha = null, hecha = false, falta = '';
  if (t.tipo === 'relativa') {
    const ev = baseEvento(t);
    if (!ev) { falta = 'Falta la fecha de: ' + EVENTOS[t.evento]; }
    else { fecha = sumarDias(ev, t.dias || 0); hecha = t.hechoPara === ev; }
  } else {
    fecha = t.proxima || null;
    hecha = t.tipo === 'unica' && t.estado === 'hecho';
  }
  if (hecha) return { clase: 'hecha', fecha, hecha: true };
  if (!fecha) return { clase: 'sinfecha', falta };
  const d = diasHasta(fecha);
  return { clase: d < 0 ? 'vencida' : d <= 7 ? 'semana' : d <= 30 ? 'mes' : 'futura', fecha, dias: d };
}

function describirRepeticion(t) {
  switch (t.tipo) {
    case 'semanal': return 'Cada ' + DIAS_SEM[t.dow ?? 1];
    case 'mensual': return 'Cada mes, día ' + (t.dia || 1);
    case 'anual': return 'Cada año, ' + (t.dia || 1) + ' de ' + MESES[(t.mes || 1) - 1];
    case 'intervalo': return t.meses ? (t.meses === 12 ? 'Cada año' : t.meses % 12 === 0 ? 'Cada ' + t.meses / 12 + ' años' : 'Cada ' + t.meses + ' meses') : 'Sin periodicidad fija';
    case 'relativa': {
      const n = t.dias || 0;
      const txt = n === 0 ? 'El día de' : Math.abs(n) + (Math.abs(n) === 1 ? ' día ' : ' días ') + (n < 0 ? 'antes de' : 'después de');
      return txt + ': ' + EVENTOS[t.evento] + (EVENTOS_RANGO[t.evento] ? (anclaDe(t) === 'fin' ? ' (desde el final)' : ' (desde el inicio)') : '');
    }
    case 'unica': return 'Una sola vez';
    default: return TIPOS[t.tipo] || '';
  }
}

  else if (s.clase === 'mes' || s.clase === 'futura') chipFecha = `<span class="chip">${fechaLarga(s.fecha)}</span>`;
  else if (s.clase === 'hecha') chipFecha = `<span class="chip verde">Hecho</span>`;
  else if (s.clase === 'sinfecha') chipFecha = `<span class="chip">${esc(s.falta || 'Sin fecha asignada')}</span>`;
  const proceso = t.estado === 'proceso' && s.clase !== 'hecha' ? '<span class="chip ambar">En proceso</span>' : (t.oculta ? '<span class="chip">Oculta</span>' : '');
  const nota = t.notas ? '<span class="chip">📝 Nota</span>' : '';
  const rec = t.recordatorio && s.clase !== 'hecha' ? `<span class="chip">🔔 ${esc(t.recordatorio.replace('T', ' '))}</span>` : '';
  return `<button class="tarea ${clase}" data-tarea="${t.id}">
    <div class="t">${esc(t.titulo)}</div>
    <div class="meta">
      ${mostrarCargo ? `<span class="chip cargo" style="--c:${c.color}">${esc(c.nombre)}</span>` : ''}
      ${chipFecha}${proceso}${rec}${nota}
      ${t.ref ? `<span class="chip ref">${esc(t.ref)}</span>` : ''}
    </div>
  </button>`;
}

function listaTareas(lista, mostrarCargo, vacio) {
  if (!lista.length) return `<div class="vacio">${vacio}</div>`;
  return `<div class="lista">${lista.map(t => tarjetaTarea(t, mostrarCargo)).join('')}</div>`;
}

function ordenarPorFecha(a, b) {
  const fa = situacion(a).fecha || '9999', fb = situacion(b).fecha || '9999';
  return fa.localeCompare(fb);
}

/* ---------- Inicio ---------- */
function vistaInicio() {
  const act = tareasActivas();
  const vencidas = act.filter(t => situacion(t).clase === 'vencida').sort(ordenarPorFecha);
  const semana = act.filter(t => situacion(t).clase === 'semana').sort(ordenarPorFecha);
  const mes = act.filter(t => situacion(t).clase === 'mes').sort(ordenarPorFecha);
  const hoy = hoyISO();
  const porRevisar = act.filter(t => situacion(t).revisar).sort((a, b) => situacion(a).proxRev.localeCompare(situacion(b).proxRev));
  const recordatorios = act.filter(t => t.recordatorio && t.recordatorio.slice(0, 10) <= hoy && situacion(t).clase !== 'hecha');
  const necPend = pubsActivos().filter(p => p.estado === 'pendiente').length;

  let html = cabecera('JWCore', 'CONGREGACIÓN CHICHICAXTLE', 'var(--navy)', 'VISTA GENERAL');

  if (!DB.tareas.length) {
    html += `<div class="panel"><b>Aún no hay datos.</b><p class="ayuda" style="font-size:13.5px;margin-top:6px">Conecta tu hoja de Google en Ajustes para cargar tareas y hermanos, o importa el archivo datos_iniciales.json.</p>
      <div class="acciones" style="margin-top:10px"><a class="boton" href="#ajustes" style="text-decoration:none">Ir a Ajustes</a></div></div>`;
    vista.innerHTML = html; return;
  }

  html += `<div class="resumen">
    <div class="dato" style="--c:var(--rojo)"><b>${vencidas.length}</b><span>Atrasadas</span></div>
    <div class="dato" style="--c:var(--ambar)"><b>${semana.length}</b><span>Próximos 7 días</span></div>
    <div class="dato" style="--c:var(--navy)"><b>${mes.length}</b><span>Próximos 30 días</span></div>
    <a class="dato" href="#necesidades" style="--c:var(--morado);text-decoration:none;color:inherit"><b>${necPend}</b><span>Necesidades por atender</span></a>
  </div>`;

  if (recordatorios.length) html += `<h2 class="titulo-seccion">Recordatorios<span class="cuenta">${recordatorios.length}</span></h2>` + listaTareas(recordatorios, true, '');
  html += `<h2 class="titulo-seccion">Atrasadas<span class="cuenta">${vencidas.length}</span></h2>` + listaTareas(vencidas, true, 'Nada atrasado.');
  html += `<h2 class="titulo-seccion">Próximos 7 días<span class="cuenta">${semana.length}</span></h2>` + listaTareas(semana, true, 'Nada para esta semana.');
  if (porRevisar.length) html += `<h2 class="titulo-seccion">Por revisar<span class="cuenta">${porRevisar.length}</span></h2>` + listaTareas(porRevisar, true, '');
  html += `<h2 class="titulo-seccion">Por cargo</h2>` + botonesCargos();

  const faltan = Object.keys(EVENTOS).filter(k => !DB.fechas[k]);
  if (faltan.length) html += `<h2 class="titulo-seccion">Fechas clave sin definir</h2>
    <div class="vacio">${faltan.map(k => esc(EVENTOS[k])).join(', ')}. Agrégalas en Ajustes para que se calculen sus tareas.</div>`;
  vista.innerHTML = html;
}

function botonesCargos() {
  return `<div class="secciones">${cargosOrden().map(c => {
    const n = conteoCargo(c.id);
    return `<a class="boton-seccion" href="#cargo/${c.id}" style="--c:${c.color};text-decoration:none;color:inherit">
      <div><div class="nombre">${esc(c.nombre)}</div>${etiquetaPersonas(c) ? `<div class="persona">${esc(etiquetaPersonas(c))}</div>` : ''}</div>
      <span class="contador ${n.urg ? 'alerta' : ''}" title="Pendientes">${n.urg || n.pend}</span>
    </a>`;
  }).join('')}</div>`;
}

/* ---------- Cargos ---------- */
const cargosAbiertos = new Set();

function renglonTarea(t) {
  const s = situacion(t);
  let f = '', cls = '';
  if (s.clase === 'vencida') { f = 'Venció ' + fechaLarga(s.fecha); cls = 'rojo'; }
  else if (s.clase === 'semana') { f = s.dias === 0 ? 'Hoy' : s.dias === 1 ? 'Mañana' : fechaLarga(s.fecha); cls = 'ambar'; }
  else if (s.clase === 'mes' || s.clase === 'futura') f = fechaLarga(s.fecha);
  else if (s.clase === 'hecha') { f = 'Hecho'; cls = 'verde'; }
  else if (s.clase === 'sinfecha') f = 'Sin fecha';
  else if (s.revisar) { f = 'Por revisar'; cls = 'ambar'; }
  if (t.oculta) { f = 'Oculta'; cls = ''; }
  return `<button class="renglon" data-tarea="${t.id}"><span class="t">${esc(t.titulo)}</span>${f ? `<span class="f ${cls}">${esc(f)}</span>` : ''}</button>`;
}

function bloqueLista(titulo, lista) {
  return lista.length ? `<div class="grupo-lista">${titulo} (${lista.length})</div>${lista.map(renglonTarea).join('')}` : '';
}

function vistaCargos() {
  let html = cabecera('Cargos', 'CONGREGACIÓN CHICHICAXTLE', 'var(--navy)', 'RESPONSABILIDADES');
  html += cargosOrden().map(c => {
    const mias = tareasActivas().filter(t => t.cargo === c.id);
    const clase = (t) => situacion(t).clase;
    const conFecha = mias.filter(t => ['vencida', 'semana', 'mes', 'futura'].includes(clase(t))).sort(ordenarPorFecha);
    const vencidas = conFecha.filter(t => clase(t) === 'vencida').length;
    const proximas = conFecha.filter(t => clase(t) === 'semana').length;
    return `<details class="acordeon" data-cargo="${c.id}" style="--c:${c.color}" ${cargosAbiertos.has(c.id) ? 'open' : ''}>
      <summary>
        <div><div class="nombre">${esc(c.nombre)}</div>${etiquetaPersonas(c) ? `<div class="persona">${esc(etiquetaPersonas(c))}</div>` : ''}</div>
        <div class="cuentas">
          ${vencidas ? `<span class="alerta">${vencidas} atrasada${vencidas > 1 ? 's' : ''}</span>` : ''}
          ${proximas ? `<span>${proximas} esta semana</span>` : ''}
          <span class="flecha">▼</span>
        </div>
      </summary>
      <div class="cuerpo">
        ${bloqueLista('Con fecha', conFecha)}
        ${bloqueLista('Falta ponerles fecha', mias.filter(t => clase(t) === 'sinfecha'))}
        ${bloqueLista('Cuando ocurra', mias.filter(t => t.tipo === 'evento'))}
        ${bloqueLista('Responsabilidades permanentes', mias.filter(t => t.tipo === 'permanente'))}
        ${bloqueLista('Hechas', mias.filter(t => clase(t) === 'hecha'))}
        ${bloqueLista('Ocultas', tareasTodas().filter(t => t.cargo === c.id && t.oculta))}
        <a class="abrir-seccion" href="#cargo/${c.id}">Abrir sección</a>
      </div>
    </details>`;
  }).join('');
  vista.innerHTML = html;
}
vista.addEventListener('toggle', (e) => {
  const id = e.target.dataset && e.target.dataset.cargo;
  if (!id) return;
  if (e.target.open) cargosAbiertos.add(id); else cargosAbiertos.delete(id);
}, true);

function vistaCargo(id) {
  const c = cargoPorId(id);
  const mias = tareasActivas().filter(t => t.cargo === id);
  const conFecha = mias.filter(t => ['vencida', 'semana', 'mes', 'futura'].includes(situacion(t).clase)).sort(ordenarPorFecha);
  const sinFecha = mias.filter(t => situacion(t).clase === 'sinfecha');
  const hechas = mias.filter(t => situacion(t).clase === 'hecha');
  const eventos = mias.filter(t => t.tipo === 'evento');
  const perm = mias.filter(t => t.tipo === 'permanente');

  let html = cabecera(c.nombre, 'CONGREGACIÓN CHICHICAXTLE', c.color, (etiquetaPersonas(c) || (cfgCargo(c).especial === 'rota' ? 'SE TURNA CADA SEMANA' : 'SIN ASIGNAR')).toUpperCase());
  html += bloqueResponsables(c);
  html += `<h2 class="titulo-seccion">Con fecha<span class="cuenta">${conFecha.length}</span></h2>` + listaTareas(conFecha, false, 'Sin tareas con fecha.');
  if (sinFecha.length) html += `<h2 class="titulo-seccion">Falta ponerles fecha<span class="cuenta">${sinFecha.length}</span></h2>` + listaTareas(sinFecha, false, '');
  if (eventos.length) html += `<h2 class="titulo-seccion">Cuando ocurra<span class="cuenta">${eventos.length}</span></h2>` + listaTareas(eventos, false, '');
  if (perm.length) html += `<h2 class="titulo-seccion">Responsabilidades permanentes</h2>` +
    perm.map(t => `<button class="permanente tarea" data-tarea="${t.id}" style="border-left-color:${c.color}">${esc(t.titulo)}${situacion(t).revisar ? '<span class="chip ambar">Por revisar</span>' : ''}${t.ref ? `<span class="chip ref">${esc(t.ref)}</span>` : ''}</button>`).join('');
  if (hechas.length) html += `<h2 class="titulo-seccion">Hechas<span class="cuenta">${hechas.length}</span></h2>` + listaTareas(hechas, false, '');
  const ocultas = tareasTodas().filter(t => t.cargo === id && t.oculta);
  if (ocultas.length) html += `<details class="ocultas"><summary>Ocultas (${ocultas.length})</summary>${listaTareas(ocultas, false, '')}</details>`;
  html += `<button class="boton-agregar" data-nueva="${id}">+ Agregar tarea</button>`;
  vista.innerHTML = html;
}

/* ---------- Necesidades ---------- */
let filtroNec = { grupo: '1', ver: 'todos', q: '' };
function vistaNecesidades(grupo) {
  if (grupo) filtroNec.grupo = grupo;
  const g = Number(filtroNec.grupo);
  const color = COLORES_GRUPO[g] || 'var(--morado)';
  let lista = pubsActivos().filter(p => p.grupo === g);
  if (filtroNec.ver === 'pendiente') lista = lista.filter(p => p.estado === 'pendiente');
  if (filtroNec.ver === 'atendido') lista = lista.filter(p => p.estado === 'atendido');
  if (filtroNec.q) {
    const q = normal(filtroNec.q);
    lista = lista.filter(p => normal(p.nombre + ' ' + (p.apodo || '') + ' ' + (p.necesidad || '')).includes(q));
  }
  const pend = pubsActivos().filter(p => p.estado === 'pendiente');
  let html = cabecera('Necesidades de los publicadores', 'CONGREGACIÓN CHICHICAXTLE', 'var(--morado)', pend.length + ' POR ATENDER');
  html += `<div class="segmentos">${[1, 2, 3, 4].map(n => {
    const cuenta = pubsActivos().filter(p => p.grupo === n && p.estado === 'pendiente').length;
    return `<button class="segmento ${n === g ? 'activo' : ''}" style="--c:${COLORES_GRUPO[n]}" data-grupo="${n}">Grupo ${n}${cuenta ? ' (' + cuenta + ')' : ''}</button>`;
  }).join('')}</div>
  <div class="segmentos" style="margin-top:8px">${[['todos', 'Todos'], ['pendiente', 'Por atender'], ['atendido', 'Atendidos']].map(([k, l]) =>
    `<button class="segmento ${filtroNec.ver === k ? 'activo' : ''}" style="--c:${color}" data-ver="${k}">${l}</button>`).join('')}</div>
  <input class="buscador" type="search" placeholder="Buscar nombre, apodo o necesidad" value="${esc(filtroNec.q)}" id="buscarNec">`;
  html += `<div class="lista" style="margin-top:12px">${lista.map(tarjetaPub).join('') || '<div class="vacio">No hay hermanos con este filtro.</div>'}</div>`;
  html += `<button class="boton-agregar" data-nuevo-pub="${g}">+ Agregar hermano al grupo ${g}</button>`;
  vista.innerHTML = html;
}
function normal(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function tarjetaPub(p) {
  const tieneApodo = p.apodo && p.apodo.trim();
  return `<div class="pub ${p.estado || ''}" data-pub="${p.id}">
    <div class="pub-cab">
      <div><div class="pub-nombre">${esc(nombreCorto(p))}${p.nombramiento ? ` <span class="chip">${p.nombramiento === 'anciano' ? 'Anciano' : 'SM'}</span>` : ''}</div>${tieneApodo ? `<div class="pub-completo">${esc(p.nombre)}</div>` : ''}</div>
      <button class="mini" data-editar-pub="${p.id}">Editar</button>
    </div>
    <textarea data-nec="${p.id}" placeholder="Escribe aquí la necesidad...">${esc(p.necesidad || '')}</textarea>
    <div class="pub-pie">
      <button class="mini ${p.estado === 'pendiente' ? 'on-pendiente' : ''}" data-est="pendiente" data-id="${p.id}">Por atender</button>
      <button class="mini ${p.estado === 'atendido' ? 'on-atendido' : ''}" data-est="atendido" data-id="${p.id}">Atendido</button>
      ${p.estado === 'atendido' && p.atendido ? `<span class="fecha-atendido">el ${fechaLarga(p.atendido)}</span>` : ''}
      <button class="mini" data-hist-pub="${p.id}" style="margin-left:auto">Historial${(p.historial || []).length ? ' (' + p.historial.length + ')' : ''}</button>
    </div>
  </div>`;
}


/* ---------- Fuentes: formularios y libros ---------- */
let filtroForm = '';
function usosDe(codigo) {
  return tareasTodas().filter(t =>
    (t.forms || []).includes(codigo) ||
    String(t.ref || '').split(';').some(x => x.trim().startsWith(codigo + ' ')));
}
function tarjetaForm(f) {
  const n = usosDe(f.codigo).length;
  return `<button class="tarjeta-form ${f.tienes ? '' : 'sin-archivo'}" data-form="${esc(f.codigo)}">
    <div><span class="cod">${esc(f.codigo)}</span><span class="tit">${esc(f.titulo)}</span></div>
    <div class="para">${esc(f.paraQue || '')}${n ? ' · ' + n + ' tarea' + (n > 1 ? 's' : '') : ''}</div>
  </button>`;
}
function vistaFormularios() {
  const q = normal(filtroForm);
  const todos = DB.formularios.filter(f => !f.borrado && (!q || normal(f.codigo + ' ' + f.titulo + ' ' + (f.paraQue || '')).includes(q)));
  const grupo = (titulo, lista) => lista.length ? `<h2 class="titulo-seccion">${titulo}<span class="cuenta">${lista.length}</span></h2>` + lista.map(tarjetaForm).join('') : '';
  let html = cabecera('Formularios y libros', 'CONGREGACIÓN CHICHICAXTLE', 'var(--navy)', 'DE DÓNDE SALE CADA TAREA');
  html += `<input class="buscador" type="search" id="buscarForm" placeholder="Buscar por código o tema, por ejemplo S-27" value="${esc(filtroForm)}">
    <p class="nota-form">Aquí está el código y para qué sirve cada uno. Para leerlo completo, búscalo por su código en JW Hub.</p>`;
  html += grupo('Libros', todos.filter(f => f.tipo === 'libro'));
  html += grupo('Formularios que tienes', todos.filter(f => f.tipo !== 'libro' && f.tienes));
  html += grupo('Otros formularios que se mencionan', todos.filter(f => f.tipo !== 'libro' && !f.tienes));
  if (!todos.length) html += '<div class="vacio" style="margin-top:12px">No hay resultados. Si no ves nada, sincroniza para cargar el catálogo.</div>';
  vista.innerHTML = html;
}
function abrirForm(codigo) {
  const f = DB.formularios.find(x => x.codigo === codigo);
  if (!f) return toast('Ese formulario no está en el catálogo');
  const usos = usosDe(codigo);
  const lista = usos.slice(0, 25).map(t => `<button class="renglon" data-abrir-tarea="${t.id}"><span class="t">${esc(t.titulo)}</span><span class="f">${esc(cargoPorId(t.cargo).nombre)}</span></button>`).join('');
  abrirHoja(`<h3>${esc(f.codigo)}</h3>
    <div style="font-weight:600;font-size:14.5px">${esc(f.titulo)}</div>
    <p class="ayuda" style="font-size:13px;margin:4px 0 10px">${esc(f.paraQue || '')}</p>
    <p class="ayuda" style="font-size:12.5px;margin-bottom:10px">${f.tienes ? 'Ya lo tienes cargado en el proyecto.' : 'No lo tienes cargado. Búscalo en JW Hub por su código.'}</p>
    <span style="font-size:12.5px;font-weight:600;color:var(--gris)">Tareas donde se usa (${usos.length})</span>
    ${lista || '<div class="vacio" style="margin-top:6px">Ninguna tarea lo menciona todavía.</div>'}
    ${usos.length > 25 ? `<p class="ayuda" style="margin-top:6px">Se muestran las primeras 25.</p>` : ''}
    <div class="acciones" style="margin-top:12px"><button class="boton sec" type="button" id="btnCerrar">Cerrar</button></div>`);
}
function bloqueFuente(t) {
  const formas = t.forms || [];
  if (!t.ref && !t.cita && !formas.length) return '';
  return `<div class="fuente"><div class="fuente-tit">De dónde sale</div>
    ${t.ref ? `<div class="fuente-ref">${esc(t.ref)}</div>` : ''}
    ${t.cita ? `<blockquote>“${esc(t.cita)}”</blockquote>` : ''}
    ${formas.length ? `<div class="meta">${formas.map(c => `<button type="button" class="chip formchip" data-form="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
  </div>`;
}

/* ---------- Ajustes ---------- */
function menuPersonas(attr, elegido, excluir, rotuloVacio, clase) {
  const grupos = opcionesMenu().map(([tit, l]) => {
    const op = l.filter(x => x.id === elegido || !excluir.includes(x.id));
    return op.length ? `<optgroup label="${esc(tit)}">${op.map(x => `<option value="${x.id}" ${x.id === elegido ? 'selected' : ''}>${esc(nombreCorto(x))}</option>`).join('')}</optgroup>` : '';
  }).join('');
  return `<select ${attr} ${clase ? `class="${clase}"` : ''}><option value="">${rotuloVacio}</option>${grupos}</select>`;
}
function menuNumeroGrupo(c, pc, id, valor) {
  return `<select class="num-grupo" data-pn="${c.id}|${pc.id}|${id}" aria-label="Número de grupo"><option value="">Gpo.</option>${Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}" ${String(valor) === String(i + 1) ? 'selected' : ''}>${i + 1}</option>`).join('')}</select>`;
}
function bloqueAux(c, pc) {
  const aux = auxPuesto(c, pc.id), usados = aux.map(a => a.id);
  return `<div class="aux-bloque"><div class="aux-tit">Auxiliares</div>
    ${aux.map((a, i) => `<div class="aux-fila"><div class="fila-sel">${menuPersonas(`data-ax="${c.id}|${pc.id}|${i}"`, a.id, usados, 'Quitar')}<button class="mini" type="button" data-adel="${c.id}|${pc.id}|${i}">Quitar</button></div>
      <input class="aux-nota" data-an="${c.id}|${pc.id}|${i}" value="${esc(a.nota || '')}" placeholder="Tipo de auxiliar o de qué se encarga"></div>`).join('')}
    <div class="fila-sel">${menuPersonas(`data-ax="${c.id}|${pc.id}|${aux.length}"`, '', usados, 'Agregar auxiliar...')}</div></div>`;
}
function bloqueAuxPersona(c, pc, idPersona) {
  const ap = auxPorPersona(c, pc.id), elegido = ap[idPersona] || '';
  return `<div class="aux-persona"><span class="aux-persona-tit">Auxiliar</span>
    <div class="fila-sel">${menuPersonas(`data-axp="${c.id}|${pc.id}|${idPersona}"`, elegido, idsPuesto(c, pc), 'Sin auxiliar')}</div></div>`;
}
function bloquePuesto(c, pc, conTitulo) {
  const ids = idsPuesto(c, pc), nums = numsPuesto(c, pc.id);
  let h = conTitulo ? `<div class="subpuesto">${esc(pc.rotulo)}</div>` : '';
  if (pc.modo === 'uno') h += menuPersonas(`data-ps="${c.id}|${pc.id}|0"`, ids[0] || '', [], 'Sin asignar');
  else if (pc.num) h += ids.map((id, i) => `<div class="super-grupo"><div class="fila-sel con-num">${menuPersonas(`data-ps="${c.id}|${pc.id}|${i}"`, id, ids, 'Quitar de la lista')}${menuNumeroGrupo(c, pc, id, nums[id])}<button class="mini" type="button" data-pdel="${c.id}|${pc.id}|${i}" aria-label="Quitar">✕</button></div>${bloqueAuxPersona(c, pc, id)}</div>`).join('') +
    `<div class="fila-sel">${menuPersonas(`data-ps="${c.id}|${pc.id}|${ids.length}"`, '', ids, 'Agregar a la lista...')}</div>`;
  else h += ids.map((id, i) => `<div class="fila-sel">${menuPersonas(`data-ps="${c.id}|${pc.id}|${i}"`, id, ids, 'Quitar de la lista')}<button class="mini" type="button" data-pdel="${c.id}|${pc.id}|${i}" aria-label="Quitar">Quitar</button></div>`).join('') +
    `<div class="fila-sel">${menuPersonas(`data-ps="${c.id}|${pc.id}|${ids.length}"`, '', ids, 'Agregar a la lista...')}</div>`;
  return h + (pc.aux && !pc.num ? bloqueAux(c, pc) : '');
}
function filaCargoAjustes(c) {
  const cfg = cfgCargo(c);
  if (cfg.especial === 'rota') return '';

function textoRango(k) {
  const rg = EVENTOS_RANGO[k], ini = DB.fechas[k], fin = DB.fechas[rg.fin];
  const completa = (f) => { const d = deISO(f); return d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear(); };
  const rango = () => {
    const a = deISO(ini), z = deISO(fin);
    if (a.getFullYear() === z.getFullYear() && a.getMonth() === z.getMonth()) return a.getDate() + ' al ' + completa(fin);
    if (a.getFullYear() === z.getFullYear()) return a.getDate() + ' de ' + MESES[a.getMonth()] + ' al ' + completa(fin);
    return completa(ini) + ' al ' + completa(fin);
  };
  if (ini && fin) return ini === fin ? rg.Art + ' es el ' + completa(ini) + '.' : rg.Art + ' es del ' + rango() + '.';
  if (ini) return rg.Art + ' empieza el ' + completa(ini) + '. Falta la fecha en que termina.';
  return 'Pon el día en que empieza ' + rg.de + ' y el día en que termina.';
}

    <div class="visita-res">${esc(textoRango(k))}</div></div>`;
}

function camposTipo(t) {

    case 'mensual': return `<label class="campo"><span>Día del mes</span><input name="dia" type="number" min="1" max="31" value="${t.dia || 1}"></label>`;
    case 'anual': return `<div class="dos"><label class="campo"><span>Día</span><input name="dia" type="number" min="1" max="31" value="${t.dia || 1}"></label>
      <label class="campo"><span>Mes</span><select name="mes">${opt(MESES.map((m, i) => [i + 1, m]), t.mes || 1)}</select></label></div>`;
    case 'intervalo': return `<label class="campo"><span>Cada cuántos meses (0 = sin repetir)</span><input name="meses" type="number" min="0" max="60" value="${t.meses ?? 12}"></label>

      <label class="campo"><span>Días (negativo = antes)</span><input name="dias" type="number" value="${t.dias || 0}"></label></div>` +
      (EVENTOS_RANGO[t.evento] ? `<label class="campo"><span>Contar desde</span><select name="ancla">${opt([['inicio', EVENTOS_RANGO[t.evento].ini], ['fin', EVENTOS_RANGO[t.evento].final]], anclaDe(t))}</select></label>` : '');
    case 'unica': return `<div class="campo"><span>Fecha</span>${selectorFecha('proxima', t.proxima)}</div>`;
    case 'permanente': {
      const r = revision(t);
      return `<label class="campo"><span>Recordarme revisarla</span><select name="revisarCada">${opt([['', 'No recordarme'], [1, 'Cada mes'], [2, 'Cada 2 meses'], [3, 'Cada 3 meses'], [4, 'Cada 4 meses'], [6, 'Cada 6 meses'], [12, 'Cada año'], [24, 'Cada 2 años']], t.revisarCada || '')}</select>

    }

  }
}

function leerFormTarea(form) {
  const t = tareaEditando.t;
  const f = new FormData(form);
  const antes = { tipo: t.tipo, dow: t.dow, dia: t.dia, mes: t.mes };
  t.titulo = f.get('titulo').trim();
  t.detalle = f.get('detalle').trim();
  if (f.has('cita')) t.cita = f.get('cita').trim();
  if (f.has('forms')) t.forms = f.get('forms').split(/[,;]/).map(x => x.trim()).filter(Boolean);
  t.cargo = f.get('cargo');
  t.ref = f.get('ref').trim();
  t.tipo = f.get('tipo');
  t.notas = f.get('notas').trim();
  if (f.has('dow')) t.dow = Number(f.get('dow'));
  if (f.has('dia')) t.dia = Number(f.get('dia')) || 1;
  if (f.has('mes')) t.mes = Number(f.get('mes')) || 1;
  if (f.has('meses')) t.meses = Number(f.get('meses')) || 0;
  if (f.has('evento')) t.evento = f.get('evento');
  if (f.has('dias')) t.dias = Number(f.get('dias')) || 0;
  if (f.has('ancla')) t.ancla = f.get('ancla'); else if (t.tipo === 'relativa') delete t.ancla;
  if (f.has('proxima')) t.proxima = f.get('proxima') || null;
  if (f.has('revisarCada')) {
    const v = Number(f.get('revisarCada')) || 0;
    if (!v) delete t.revisarCada;
    else if (t.revisarCada !== v) { t.revisarCada = v; if (!t.ultimaRevision && !t.revisarDesde) t.revisarDesde = hoyISO(); }
  } else if (t.tipo !== 'permanente') delete t.revisarCada;
  const cambioRepeticion = antes.tipo !== t.tipo || antes.dow !== t.dow || antes.dia !== t.dia || antes.mes !== t.mes;
  if (['semanal', 'mensual', 'anual'].includes(t.tipo) && (cambioRepeticion || !t.proxima)) t.proxima = primeraFecha(t);
  if (f.has('recordatorio')) {
    if (t.recordatorio !== f.get('recordatorio')) delete AVISADOS[t.id];
    t.recordatorio = f.get('recordatorio');
  }
  if (f.has('estado')) {
    const est = f.get('estado');
    if (est === 'hecho' && !situacion(t).hecha) { completar(t, false); }
    else if (est !== 'hecho') {
      t.estado = est;
      if (t.tipo === 'relativa') t.hechoPara = null;
    }
  }
}

function vistaHistorial() {

function completar(t, conToast = true, fecha, nota) {

    t.proxima = siguienteFecha(t);
    t.estado = 'pendiente';
    t.recordatorio = '';

  } else if (t.tipo === 'evento') {
    t.estado = 'pendiente';

function exportar() {

function importar(file) {
  const r = new FileReader();
  r.onload = () => {
    let datos;
    try { datos = JSON.parse(r.result); } catch (e) { return toast('El archivo no es un respaldo válido'); }
    if (Array.isArray(datos.tareas) || Array.isArray(datos.publicadores)) {
      fusionar(datos, true);
      toast('Datos importados');
    } else {
      let n = 0;
      Object.entries(datos).forEach(([id, v]) => {
        const p = DB.publicadores.find(x => x.id === id);
        if (p && v && v.texto && v.texto.trim()) { p.necesidad = v.texto; p.estado = p.estado || 'pendiente'; marcarCambio('publicadores', p); n++; }
      });
      toast(n ? n + ' necesidades importadas' : 'No se encontraron necesidades que coincidan');
    }
    render();
  };
  r.readAsText(file);
}

/* ================= Sincronización ================= */
let enviando = false, errorSync = '', temporizadorEnvio = null;

function fusionar(remoto, marcarSucio) {
  ['tareas', 'publicadores', 'cargos', 'formularios'].forEach(tipo => {
    if (!Array.isArray(remoto[tipo])) return;
    const mapa = new Map(DB[tipo].map(x => [x.id, x]));
    remoto[tipo].forEach(r => {
      const l = mapa.get(r.id);
      if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) {
        if (l) Object.keys(l).forEach(k => delete l[k]), Object.assign(l, r);
        else { DB[tipo].push(r); mapa.set(r.id, r); }
        if (marcarSucio && SUCIOS[tipo] && !SUCIOS[tipo].includes(r.id)) SUCIOS[tipo].push(r.id);
      }
    });
  });
  if (remoto.fechas && (remoto.fechas.updatedAt || 0) > (DB.fechas.updatedAt || 0)) {
    DB.fechas = remoto.fechas;
    if (marcarSucio) SUCIOS.fechas = true;
  }
  normalizar();
  guardarLocal();
}

function normalizar() {
  DB.tareas.forEach(t => {
    if (['semanal', 'mensual', 'anual'].includes(t.tipo) && !t.proxima) {
      t.proxima = primeraFecha(t);
      t.updatedAt = Date.now();
      if (!SUCIOS.tareas.includes(t.id)) SUCIOS.tareas.push(t.id);
    }
  });
}

function paquete() {
  const tomar = (tipo) => SUCIOS[tipo].map(id => DB[tipo].find(x => x.id === id)).filter(Boolean);
  return {
    clave: CFG.clave, accion: 'guardar', dispositivo: DISP,
    tareas: tomar('tareas'), publicadores: tomar('publicadores'), cargos: tomar('cargos'),
    fechas: SUCIOS.fechas ? DB.fechas : null
  };
}

function programarEnvio() {
  refrescarEstadoSync();
  if (!CFG.url) return;
  clearTimeout(temporizadorEnvio);
  temporizadorEnvio = setTimeout(() => sincronizar(false), 1200);
}

async function sincronizar(manual) {
  if (!CFG.url) { if (manual) toast('Primero pon la dirección del script'); return; }
  if (enviando) return;
  enviando = true; refrescarEstadoSync();
  const cuerpo = paquete();
  const enviados = {
    tareas: cuerpo.tareas.map(x => [x.id, x.updatedAt]),
    publicadores: cuerpo.publicadores.map(x => [x.id, x.updatedAt]),
    cargos: cuerpo.cargos.map(x => [x.id, x.updatedAt])
  };
  const fechasEnviadas = cuerpo.fechas ? cuerpo.fechas.updatedAt : null;
  try {
    const resp = await fetch(CFG.url, { method: 'POST', body: JSON.stringify(cuerpo), redirect: 'follow' });
    const r = await resp.json();
    if (!r.ok) {
      const motivos = {
        'Dispositivo pendiente': 'Esperando aprobación en la hoja',
        'Dispositivo bloqueado': 'Este dispositivo está bloqueado',
        'Clave incorrecta': 'Clave incorrecta',
        'Bloqueado temporalmente': 'Acceso bloqueado por intentos fallidos'
      };
      throw new Error(motivos[r.error] || 'Error del servidor');
    }
    ['tareas', 'publicadores', 'cargos'].forEach(tipo => {
      enviados[tipo].forEach(([id, ts]) => {
        const reg = DB[tipo].find(x => x.id === id);
        if (reg && reg.updatedAt === ts) SUCIOS[tipo] = SUCIOS[tipo].filter(x => x !== id);
      });
    });
    if (fechasEnviadas && DB.fechas.updatedAt === fechasEnviadas) SUCIOS.fechas = false;
    const escribiendo = document.activeElement && document.activeElement.matches('textarea, input');
    fusionar(r.datos, false);
    renovarVencidas();
    CFG.ultimoSync = Date.now(); guardarCfg();
    errorSync = '';
    if (manual) toast('Sincronizado');
    if (!escribiendo && !hoja.classList.contains('abierta')) render();
  } catch (err) {
    const conocido = ['Esperando aprobación en la hoja', 'Este dispositivo está bloqueado', 'Clave incorrecta', 'Acceso bloqueado por intentos fallidos'].includes(err.message);
    errorSync = conocido ? err.message : 'Sin conexión con la hoja';
    if (manual) toast(conocido ? err.message : 'No se pudo conectar con la hoja');
  } finally {
    enviando = false; refrescarEstadoSync();
    const quedan = SUCIOS.tareas.length + SUCIOS.publicadores.length + SUCIOS.cargos.length + (SUCIOS.fechas ? 1 : 0);
    if (quedan && !errorSync) programarEnvio();
  }
}

/* Envío al cerrar o cambiar de app */
function enviarAlSalir() {
  if (!CFG.url) return;
  const cuerpo = paquete();
  if (!cuerpo.tareas.length && !cuerpo.publicadores.length && !cuerpo.cargos.length && !cuerpo.fechas) return;
  try { navigator.sendBeacon(CFG.url, new Blob([JSON.stringify(cuerpo)], { type: 'text/plain' })); } catch (e) {}
}
window.addEventListener('pagehide', enviarAlSalir);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    enviarAlSalir();
    ocultaDesde = Date.now();
  } else {
    if (ocultaDesde && Date.now() - ocultaDesde > MINUTOS_PARA_BLOQUEAR * 60000) bloquear();
    ocultaDesde = null;
    if (renovarVencidas()) render();
    sincronizar(false);
  }
});
window.addEventListener('online', () => sincronizar(false));
setInterval(() => { if (document.visibilityState === 'visible') sincronizar(false); }, 30000);

/* ================= Recordatorios ================= */
function revisarRecordatorios() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const ahora = new Date();
  tareasActivas().forEach(t => {
    if (!t.recordatorio || AVISADOS[t.id] === t.recordatorio || situacion(t).clase === 'hecha') return;
    if (new Date(t.recordatorio) <= ahora) {
      AVISADOS[t.id] = t.recordatorio;
      localStorage.setItem(LS_AVISADOS, JSON.stringify(AVISADOS));
      const cuerpo = cargoPorId(t.cargo).nombre;
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(reg => reg.showNotification(t.titulo, { body: cuerpo, icon: 'icon-192.png', tag: t.id }));
      } else new Notification(t.titulo, { body: cuerpo, icon: 'icon-192.png' });
    }
  });
}
setInterval(revisarRecordatorios, 60000);

/* ================= Bloqueo con huella o rostro ================= */
const aB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const deB64 = (txt) => Uint8Array.from(atob(txt), c => c.charCodeAt(0));
const retoAleatorio = () => crypto.getRandomValues(new Uint8Array(32));

async function biometriaDisponible() {
  try { return !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch (e) { return false; }
}

async function verificarIdentidad() {
  await navigator.credentials.get({ publicKey: {
    challenge: retoAleatorio(),
    allowCredentials: [{ type: 'public-key', id: deB64(BIO.credId) }],
    userVerification: 'required',
    timeout: 60000
  } });
}

async function activarBiometria() {
  if (!await biometriaDisponible()) return toast('Este celular no tiene huella o rostro disponibles para la app');
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: retoAleatorio(),
      rp: { name: 'JWCore' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'ancianos', displayName: 'JWCore' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000
    } });
    BIO.credId = aB64(cred.rawId);
    localStorage.setItem(LS_BIO, JSON.stringify(BIO));
    toast('Bloqueo activado');
    render();
  } catch (e) { toast('No se activó el bloqueo'); }
}

async function desactivarBiometria() {
  try {
    await verificarIdentidad();
    BIO.credId = null;
    localStorage.setItem(LS_BIO, JSON.stringify(BIO));
    toast('Bloqueo desactivado');
    render();
  } catch (e) { toast('No se pudo verificar tu identidad'); }
}

async function desbloquear() {
  try {
    await verificarIdentidad();
    bloqueada = false;
    render();
  } catch (e) { toast('No se pudo verificar. Intenta de nuevo'); }
}

function bloquear() {
  if (!BIO.credId) return;
  bloqueada = true;
  cerrarHoja();
  render();
}

function vistaBloqueo() {
  vista.innerHTML = `<div class="bloqueo">
    ${cabecera('JWCore', 'CONGREGACIÓN CHICHICAXTLE', 'var(--navy)', 'APP BLOQUEADA')}
    <button class="boton" id="btnDesbloquear">Desbloquear con huella o rostro</button>
    <p>Si tu celular lo permite, también puedes usar su PIN o patrón.</p>
  </div>`;
}

/* ================= Navegación ================= */
function render() {
  document.body.classList.toggle('bloqueada', bloqueada);
  if (bloqueada) return vistaBloqueo();
  const h = (location.hash || '#inicio').slice(1);
  const [ruta, param] = h.split('/');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('activo',
    a.dataset.r === ruta || (ruta === 'cargo' && a.dataset.r === 'cargos')));
  if (ruta === 'cargos') vistaCargos();
  else if (ruta === 'cargo' && param) vistaCargo(param);
  else if (ruta === 'necesidades') vistaNecesidades(param);
  else if (ruta === 'historial') vistaHistorial();
  else if (ruta === 'formularios') vistaFormularios();
  else if (ruta === 'ajustes') vistaAjustes();
  else vistaInicio();
}
window.addEventListener('hashchange', () => { cerrarHoja(); render(); window.scrollTo(0, 0); });

let temporizadorToast;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => t.style.display = 'none', 2200);
}

/* ================= Inicio ================= */
normalizar(); guardarLocal(); renovarVencidas();
render();
revisarRecordatorios();
sincronizar(false);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
