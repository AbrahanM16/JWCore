    ${h.length ? h.map(({ x, i }) => `<button type="button" class="renglon" data-h="${tipo}|${reg.id}|${i}|${ctx}"><span class="t">${esc(fechaLarga(x.fecha))}${x.nota ? ': ' + esc(x.nota) : ''}${x.para ? ' (era para el ' + esc(fechaLarga(x.para)) + ')' : ''}</span><span class="f">Editar</span></button>`).join('') : '<div class="ayuda">Todavía no hay registros.</div>'}
    <button type="button" class="mini" data-h="${tipo}|${reg.id}|-1|${ctx}" style="margin-top:6px">+ Agregar registro</button></div>`;
}
const regPorTipo = (tipo, id) => tipo === 'tarea' ? DB.tareas.find(x => x.id === id) : DB.publicadores.find(x => x.id === id);
let entradaEd = null;
function abrirEntrada(tipo, id, idx, ctx) {
  const reg = regPorTipo(tipo, id); if (!reg) return;
  const nueva = idx < 0, e = nueva ? { fecha: hoyISO(), nota: '' } : (reg.historial || [])[idx];
  if (!e) return;
  entradaEd = { tipo, id, idx, ctx };
  abrirHoja(`<h3>${nueva ? 'Agregar registro' : 'Editar registro'}</h3>
    <div style="font-weight:600;font-size:14px;margin-bottom:8px">${esc(tipo === 'tarea' ? reg.titulo : nombreCorto(reg))}</div>
    <form id="formEntrada">
      <div class="campo"><span>Fecha</span>${selectorFecha('fecha', e.fecha)}</div>
      <label class="campo"><span>Detalle</span><textarea name="nota" placeholder="Qué se hizo, con quién, resultado...">${esc(e.nota || '')}</textarea></label>
      <div class="acciones">
        <button class="boton" type="submit">Guardar</button>
        <button class="boton sec" type="button" id="btnEntradaVolver">Cancelar</button>
        ${nueva ? '' : '<button class="boton peligro" type="button" id="btnEntradaBorrar">Eliminar registro</button>'}
      </div></form>`);
}
function cerrarEntrada() {
  const ed = entradaEd; entradaEd = null;
  if (ed && ed.ctx === 'tarea') { const t = regPorTipo('tarea', ed.id); tareaEditando = { t, nueva: false }; pintarTarea(t); }
  else if (ed && ed.ctx === 'pub') abrirHistPub(ed.id);
  else cerrarHoja();
  render();
}
function abrirHistPub(id) {
  const p = DB.publicadores.find(x => x.id === id); if (!p) return;
  abrirHoja(`<h3>Registro de lo atendido</h3><div style="font-weight:600;font-size:14px;margin-bottom:8px">${esc(nombreCorto(p))}</div>
    ${bloqueHistorial('pub', p, 'pub')}
    <div class="acciones"><button class="boton sec" type="button" id="btnCerrar">Cerrar</button></div>`);
}
let filtroHist = { q: '', cargo: '', vista: 'fecha', abiertos: [], omitidas: false };
function todasEntradas() {
  const out = [];
  tareasTodas().forEach(t => (t.historial || []).forEach((h, i) => { if (!h.omitida || filtroHist.omitidas) out.push({ tipo: 'tarea', id: t.id, idx: i, fecha: h.fecha || '', nota: h.nota || '', titulo: t.titulo, cargo: t.cargo, omitida: !!h.omitida }); }));
  pubsActivos().forEach(x => (x.historial || []).forEach((h, i) => out.push({ tipo: 'pub', id: x.id, idx: i, fecha: h.fecha || '', nota: h.nota || '', para: h.para || '', titulo: 'Hermano: ' + nombreCorto(x), cargo: 'necesidades' })));
  return out.sort((a, b) => b.fecha.localeCompare(a.fecha));
}
function tarjetaEntrada(e, conCargo) {
  const c = e.cargo === 'necesidades' ? null : cargoPorId(e.cargo);
  return `<button class="tarea" data-h="${e.tipo}|${e.id}|${e.idx}|lista" style="margin-bottom:8px"><div class="t">${esc(e.titulo)}</div>
    <div class="meta"><span class="chip ${e.omitida ? 'ambar' : 'verde'}">${esc(fechaLarga(e.fecha))}</span>${conCargo && c ? `<span class="chip cargo" style="--c:${c.color}">${esc(c.nombre)}</span>` : ''}${e.para ? `<span class="chip">Era para el ${esc(fechaLarga(e.para))}</span>` : ''}${e.nota ? `<span class="chip">${esc(e.nota.length > 70 ? e.nota.slice(0, 70) + '...' : e.nota)}</span>` : ''}</div></button>`;
}
function vistaHistorial() {
  const q = normal(filtroHist.q), porCargo = filtroHist.vista === 'cargo';
  const todas = todasEntradas().filter(e => (!filtroHist.cargo || e.cargo === filtroHist.cargo) && (!q || normal(e.titulo + ' ' + e.nota).includes(q)));
  let html = cabecera('Historial', 'CONGREGACIÓN CHICHICAXTLE', 'var(--morado)', todas.length + (todas.length === 1 ? ' REGISTRO' : ' REGISTROS'));
  html += `<div class="segmento"><button type="button" class="${!porCargo ? 'on' : ''}" data-vista-hist="fecha">Por fecha</button><button type="button" class="${porCargo ? 'on' : ''}" data-vista-hist="cargo">Por cargo</button></div>
    <input class="buscador" type="search" id="buscarHist" placeholder="Buscar en el historial" value="${esc(filtroHist.q)}">
    <label class="chk-omitidas"><input type="checkbox" id="chkOmitidas" ${filtroHist.omitidas ? 'checked' : ''}> Incluir las tareas omitidas</label>
    <select class="buscador" id="filtroHistCargo"><option value="">Todos los cargos</option>${cargosOrden().map(c => `<option value="${c.id}" ${filtroHist.cargo === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}<option value="necesidades" ${filtroHist.cargo === 'necesidades' ? 'selected' : ''}>Hermanos</option></select>`;
  if (!todas.length) html += '<div class="vacio" style="margin-top:12px">Todavía no hay registros. Aparecen cuando marcas algo como hecho o cuando registras un recordatorio de un hermano.</div>';
  if (porCargo) {
    cargosOrden().map(c => c.id).concat('necesidades').forEach(id => {
      const l = todas.filter(e => e.cargo === id);
      if (!l.length) return;
      const c = id === 'necesidades' ? { nombre: 'Hermanos', color: 'var(--morado)' } : cargoPorId(id);
      const abierto = filtroHist.abiertos.includes(id) || !!filtroHist.q || !!filtroHist.cargo;
      html += `<details class="hist-cargo" data-hc="${id}" ${abierto ? 'open' : ''}><summary><span class="punto" style="background:${c.color}"></span>${esc(c.nombre)}<span class="cuenta">${l.length}</span></summary>
        ${l.slice(0, 60).map(e => tarjetaEntrada(e, false)).join('')}${l.length > 60 ? '<p class="ayuda">Se muestran los 60 más recientes de este cargo.</p>' : ''}</details>`;
    });
  } else {
    const lista = todas.slice(0, 150);
    let mes = '';
    lista.forEach(e => {
      const m = (e.fecha || '').slice(0, 7);
      if (m !== mes) { mes = m; html += `<div class="titulo-mes">${m ? MESES[Number(m.slice(5)) - 1] + ' de ' + m.slice(0, 4) : 'Sin fecha'}</div>`; }
      html += tarjetaEntrada(e, true);
    });
    if (todas.length > lista.length) html += `<p class="ayuda" style="margin-top:8px">Se muestran los ${lista.length} más recientes. Usa el buscador para ver los demás.</p>`;
  }
  vista.innerHTML = html;
}
document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.dataset || !d.dataset.hc) return;
  const a = filtroHist.abiertos, i = a.indexOf(d.dataset.hc);
  if (d.open && i < 0) a.push(d.dataset.hc); else if (!d.open && i >= 0) a.splice(i, 1);
}, true);

function completar(t, conToast = true, fecha, nota) {
  agregarEntrada(t, fecha, nota);
  if (['semanal', 'mensual', 'anual'].includes(t.tipo) || (t.tipo === 'intervalo' && t.meses > 0)) {
    t.proxima = siguienteFecha(t);
    t.estado = 'pendiente';
    t.recordatorio = '';
    if (conToast) toast('Hecho. Próxima: ' + fechaLarga(t.proxima));
  } else if (t.tipo === 'evento') {
    t.estado = 'pendiente';
    if (conToast) toast('Registrado en el historial');
  } else if (t.tipo === 'relativa') {
    t.hechoPara = baseEvento(t) || null;
    t.estado = 'pendiente';
    if (conToast) toast('Marcada como hecha');
  } else {
    t.estado = 'hecho';
    if (conToast) toast('Marcada como hecha');
  }
}

/* Omitir: la tarea atrasada no se hizo y no se marca como hecha. Las que se repiten pasan a su siguiente fecha;
   las ligadas a una fecha clave esperan al siguiente evento. Queda "Omitida" en el historial. */
const omitible = (t) => situacion(t).clase === 'vencida' && (esRecurrente(t) || t.tipo === 'relativa');
function omitir(t) {
  if (!omitible(t)) return false;
  agregarEntrada(t, hoyISO(), 'Omitida');
  t.historial[t.historial.length - 1].omitida = true;
  if (t.tipo === 'relativa') t.omitidoPara = baseEvento(t);
  else t.proxima = siguienteFecha(t);
  t.estado = 'pendiente'; t.recordatorio = '';
  marcarCambio('tareas', t);
  return true;
}
function omitirVarias(lista, donde) {
  const vencidas = lista.filter(t => situacion(t).clase === 'vencida'), lote = vencidas.filter(omitible), otras = vencidas.length - lote.length;
  if (!lote.length) return toast('No hay atrasadas que se puedan omitir');
  const msg = '¿Omitir ' + lote.length + (lote.length === 1 ? ' tarea atrasada' : ' tareas atrasadas') + donde + '?\n\nNo se marcan como hechas: las que se repiten pasan a su siguiente fecha, las ligadas a un evento esperan al siguiente, y en el historial queda "Omitida".' + (otras ? '\n\n' + otras + ' atrasada(s) de otro tipo no se tocan.' : '');
  if (!confirm(msg)) return;
  lote.forEach(omitir);
  render(); toast(lote.length === 1 ? 'Tarea omitida' : lote.length + ' tareas omitidas');
}

hoja.addEventListener('change', (e) => {

hoja.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id && e.target.id.startsWith('formPr')) return predGuardar(e.target);
  if (e.target.id === 'formVersionSem') { guardarVersionSem(new FormData(e.target).get('nombre').trim()); cerrarHoja(); render(); return toast('Versión guardada'); }
  if (e.target.id === 'formTarea') {
    leerFormTarea(e.target);
    if (!tareaEditando.t.titulo) return;
    if (tareaEditando.nueva) DB.tareas.push(tareaEditando.t);
    marcarCambio('tareas', tareaEditando.t);

/* Actualiza hermanos desde un archivo propio (grupo, nombramiento y precursorado). Solo cambia esos datos: las notas, los recordatorios y el registro de cada uno se conservan. */
function aplicarListaHermanos(lista) {
  const clave = (x) => normal(x).replace(/\s+/g, ' ').trim();
  const activos = pubsActivos();
  let cambiados = 0;
  const nuevos = [], avisos = [];
  const vistos = new Set();
  lista.forEach(it => {
    if (!it.nombre) return;
    let p = activos.find(x => clave(x.nombre) === clave(it.nombre)) || (it.antes && activos.find(x => clave(x.nombre) === clave(it.antes)));
    const nomb = it.nombramiento || '', prec = it.precursor || '', grupo = Number(it.grupo);
    if (!p) {
      p = { id: 'g' + grupo + '-' + clave(it.nombre).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''), grupo, nombre: it.nombre, apodo: '' };
      if (nomb) p.varon = true; else if (typeof it.varon === 'boolean') p.varon = it.varon;
      if (nomb) p.nombramiento = nomb;
      if (prec) p.precursor = prec;
      ETIQUETAS_PUB.forEach(([k]) => { if (it[k]) p[k] = true; });
      DB.publicadores.push(p); marcarCambio('publicadores', p); nuevos.push(p.nombre); vistos.add(p.id);
      return;
    }
    vistos.add(p.id);
    const antesNomb = p.nombramiento || '';
    const cambio = p.nombre !== it.nombre || p.grupo !== grupo || antesNomb !== nomb || (p.precursor || '') !== prec || ETIQUETAS_PUB.some(([k]) => k in it && !!it[k] !== !!p[k]);
    if (!cambio) return;
    p.nombre = it.nombre; p.grupo = grupo;
    if (nomb) { p.nombramiento = nomb; p.varon = true; } else delete p.nombramiento;
    if (prec) p.precursor = prec; else delete p.precursor;
    ETIQUETAS_PUB.forEach(([k]) => { if (k in it) { if (it[k]) p[k] = true; else delete p[k]; } });
    marcarCambio('publicadores', p); cambiados++;
    const a = sincronizarCargos(p, antesNomb, nomb);
    if (a) avisos.push(a);
  });
  const fuera = pubsActivos().filter(x => !vistos.has(x.id)).map(x => x.nombre);
  const todos = pubsActivos(), cuantos = (f) => todos.filter(f).length;
  const unir = (a) => a.map(esc).join(', ');
  abrirHoja(`<h3>Lista aplicada</h3>
    <p class="ayuda" style="font-size:13.5px;margin:0 0 8px">El archivo traía ${lista.length} hermanos: ${cambiados} actualizados, ${vistos.size - cambiados - nuevos.length} sin cambios y ${nuevos.length} nuevos.</p>
    <div class="panel" style="margin:0 0 10px"><b>Ahora en la app</b><div class="ayuda" style="font-size:13.5px;margin-top:4px">${todos.length} publicadores, ${cuantos(x => x.precursor === 'regular')} precursores regulares, ${cuantos(x => x.precursor === 'auxiliar')} auxiliares, ${cuantos(x => x.nombramiento === 'sm')} siervos ministeriales y ${cuantos(x => x.nombramiento === 'anciano')} ancianos.</div></div>
    ${nuevos.length ? `<p class="ayuda" style="font-size:13.5px"><b>Nuevos:</b> ${unir(nuevos)}.</p>` : ''}
    ${fuera.length ? `<p class="ayuda" style="font-size:13.5px"><b>En la app y no en el archivo (no se tocaron):</b> ${unir(fuera)}.</p>` : ''}
    ${avisos.length ? `<p class="ayuda" style="font-size:13.5px"><b>Cargos:</b> ${avisos.map(esc).join(' ')}</p>` : ''}
    <div class="acciones"><button class="boton" type="button" id="btnCerrar">Cerrar</button></div>`);
}
function importar(file) {
  const r = new FileReader();
  r.onload = () => {
    let datos;
    try { datos = JSON.parse(r.result); } catch (e) { return toast('El archivo no es un respaldo válido'); }
    if (datos.tipo === 'lista-hermanos' && Array.isArray(datos.hermanos)) {
      aplicarListaHermanos(datos.hermanos);
    } else if (Array.isArray(datos.tareas) || Array.isArray(datos.publicadores)) {
      fusionar(datos, true);
      toast('Datos importados');
    } else {
      let n = 0;
      Object.entries(datos).forEach(([id, v]) => {
        const p = DB.publicadores.find(x => x.id === id);
        if (p && v && v.texto && v.texto.trim()) { (p.notas = p.notas || []).push({ id: nuevoId('n'), titulo: 'Necesidad', texto: v.texto.trim() }); marcarCambio('publicadores', p); n++; }
      });
      toast(n ? n + ' necesidades importadas' : 'No se encontraron necesidades que coincidan');
    }
    render();
  };
  r.readAsText(file);
}

const LS_SEMFOTO = 'ancianos_pwa_semfoto_v1';

function semanaBase() {

    objetivos: ['Espiritual', 'Salud', 'Actividades de Abanchito', 'Actividades de Yaky', 'La penthousita'].map((n, i) => ({ id: 'o' + (i + 1), nombre: n })),

function normalizarSemana() {
  if (!DB.semana || typeof DB.semana !== 'object') DB.semana = semanaBase();
  const s = DB.semana, base = semanaBase();
  if (typeof s.titulo !== 'string' || !s.titulo) s.titulo = base.titulo;
  if (!Array.isArray(s.objetivos)) s.objetivos = base.objetivos;
  if (!s.celdas || typeof s.celdas !== 'object') s.celdas = {};
  if (!Array.isArray(DB.semanaHist)) DB.semanaHist = [];

}
const celdaSem = (s, o, d) => ((s.celdas && s.celdas[o]) || [])[d] || '';
const datosSem = (s) => ({ titulo: s.titulo, objetivos: s.objetivos.map(o => ({ id: o.id, nombre: o.nombre })), celdas: JSON.parse(JSON.stringify(s.celdas || {})) });
const indiceHoy = () => (new Date().getDay() + 6) % 7;
const limpiarTxt = (x) => x.replace(/ /g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim().slice(0, SEM_MAX_TXT);
const lineaTxt = (x, max) => x.replace(/\s+/g, ' ').trim().slice(0, max);

/* Lo que hay en pantalla pasa a los datos y se marca para subir; también guarda la copia del día */
function leerSemanaDOM() {
  const h = $('#semHoja');
  if (!h) return null;
  const objetivos = [], celdas = {};
  h.querySelectorAll('.sem-fila').forEach(f => {
    const id = f.dataset.o;
    objetivos.push({ id, nombre: lineaTxt(f.querySelector('.sem-on').innerText, 60) || 'Objetivo' });
    const fila = [...f.querySelectorAll('.sem-dia')].map(c => limpiarTxt(c.innerText));
    if (fila.some(Boolean)) celdas[id] = fila;
  });
  return { titulo: lineaTxt(h.querySelector('.sem-tit').innerText, 80) || 'Mi semana', objetivos, celdas };
}
function semProgramar() { semSucia = true; clearTimeout(semTimer); semTimer = setTimeout(flushSemana, 700); }
function flushSemana() {
  clearTimeout(semTimer);
  if (!semSucia) return false;
  semSucia = false;
  const n = leerSemanaDOM();
  if (!n) return false;
  const s = DB.semana;
  if (JSON.stringify({ titulo: s.titulo, objetivos: s.objetivos, celdas: s.celdas }) === JSON.stringify(n)) return false;
  s.titulo = n.titulo; s.objetivos = n.objetivos; s.celdas = n.celdas;
  semanaCambio();
  return true;
}
function semanaCambio() {
  const s = DB.semana, ahora = new Date(), id = 'sh-' + hoyISO();
  s.updatedAt = ahora.getTime(); SUCIOS.semana = true;
  let v = DB.semanaHist.find(x => x.id === id);

  Object.assign(v, datosSem(s), { hora: pad(ahora.getHours()) + ':' + pad(ahora.getMinutes()), updatedAt: s.updatedAt });
  delete v.borrado;
  if (!SUCIOS.semanaHist.includes(id)) SUCIOS.semanaHist.push(id);
  guardarLocal(); programarEnvio();
}
function guardarVersionSem(nombre) {

function semOperacion(op, id) {
  flushSemana();
  const s = DB.semana, o = s.objetivos, i = o.findIndex(x => x.id === id);

    if (o.length >= SEM_MAX_OBJ) return toast('Máximo ' + SEM_MAX_OBJ + ' objetivos');
    const nuevo = { id: nuevoId('o'), nombre: 'Nuevo objetivo' };
    o.push(nuevo); semanaCambio(); render();
    const campo = $(`.sem-fila[data-o="${nuevo.id}"] .sem-on`);
    if (campo) {
      campo.scrollIntoView({ block: 'center' }); campo.focus();
      const r = document.createRange(); r.selectNodeContents(campo);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    return;
  }
  if (i < 0) return;
  if (op === 'sube' && i > 0) [o[i - 1], o[i]] = [o[i], o[i - 1]];
  else if (op === 'baja' && i < o.length - 1) [o[i + 1], o[i]] = [o[i], o[i + 1]];
  else if (op === 'quita') {
    if ((s.celdas[id] || []).some(Boolean) && !confirm('¿Quitar "' + o[i].nombre + '" y todo lo que escribiste en esa fila?')) return;
    o.splice(i, 1); delete s.celdas[id];
  } else return;
  semanaCambio(); render();
}

/* Imagen propia: se reduce y se guarda solo en este dispositivo (no cabe en la hoja de Google) */
function semCargarFoto(file) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      try { localStorage.setItem(LS_SEMFOTO, c.toDataURL('image/jpeg', .85)); toast('Imagen cambiada'); }
      catch (e) { toast('No se pudo guardar la imagen en este dispositivo'); }
      render();
    };
    im.onerror = () => toast('No se pudo leer esa imagen');
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

/* PDF y PNG: se generan en el dispositivo con la misma vista que ves */
function cargarScript(src) {
  return new Promise((ok, mal) => {
    const e = document.createElement('script');
    e.src = src; e.onload = ok; e.onerror = () => mal(new Error('No se pudo cargar ' + src));
    document.head.appendChild(e);
  });
}
function nombreArchivoSem() { return (DB.semana.titulo || 'Mi semana').replace(/[\\/:*?"<>|]+/g, '').trim().replace(/\s+/g, '_') || 'Mi_semana'; }
function descargarBlob(blob, nombre) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function semCaptura() {
  flushSemana();
  if (!window.html2canvas) await cargarScript('semana/html2canvas.min.js');
  const h = $('#semHoja'), y = window.scrollY;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  /* Se dibuja una copia fuera de pantalla con ancho fijo, para que el archivo salga igual en el celular y en la computadora */
  const w = Math.max(h.offsetWidth, 960);
  const lienzo = document.createElement('div'), copia = h.cloneNode(true);
  lienzo.style.cssText = 'position:absolute;left:-20000px;top:0;width:' + w + 'px';
  copia.removeAttribute('id'); copia.style.minWidth = '0'; copia.style.width = w + 'px';
  copia.querySelectorAll('[contenteditable]').forEach(x => x.removeAttribute('contenteditable'));
  lienzo.appendChild(copia); document.body.appendChild(lienzo);
  document.body.classList.add('exportando');
  window.scrollTo(0, 0);
  try {
    await document.fonts.ready;
    return await html2canvas(copia, { scale: 2600 / w, backgroundColor: '#FBF3EA', useCORS: true, logging: false, scrollX: 0, scrollY: 0 });
  } finally {
    document.body.classList.remove('exportando'); lienzo.remove(); window.scrollTo(0, y);
  }
}
async function semExportar(formato) {
  const botones = [$('#semPdf'), $('#semPng')];
  botones.forEach(b => b && (b.disabled = true));
  try {
    const c = await semCaptura();
    if (formato === 'png') {
      const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
      descargarBlob(blob, nombreArchivoSem() + '.png');
    } else {
      if (!window.jspdf) await cargarScript('semana/jspdf.umd.min.js');
      const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
      const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), m = 18, r = c.width / c.height;
      let w = W - 2 * m, h = w / r;
      if (h > H - 2 * m) { h = H - 2 * m; w = h * r; }
      pdf.setFillColor(251, 243, 234); pdf.rect(0, 0, W, H, 'F');
      pdf.addImage(c.toDataURL('image/jpeg', .95), 'JPEG', (W - w) / 2, (H - h) / 2, w, h);
      descargarBlob(pdf.output('blob'), nombreArchivoSem() + '.pdf');
    }
    toast(formato === 'png' ? 'PNG listo' : 'PDF listo');
  } catch (e) {
    toast('No se pudo generar el archivo. Revisa que la carpeta semana esté subida a GitHub (' + (e.message || 'error') + ')', 6000);
  } finally {
    botones.forEach(b => b && (b.disabled = false));
  }
}

/* ---------- Horas ---------- */
function horasDeMes(ym) { return DB.horas.find(x => x.id === 'h-' + ym); }
function minutosDia(iso) { const r = horasDeMes(iso.slice(0, 7)), d = r && r.dias[iso.slice(8)]; return d ? d.m || 0 : 0; }
function totalMes(ym) { const r = horasDeMes(ym); return r ? Object.values(r.dias).reduce((s, d) => s + (d.m || 0), 0) : 0; }
function diasConHoras(ym) { const r = horasDeMes(ym); return r ? Object.values(r.dias).filter(d => d.m > 0).length : 0; }
function textoHoras(m) { const h = Math.floor(m / 60), r = m % 60; return h + ' h' + (r ? ' ' + r + ' min' : ''); }
function cortoHoras(m) { return Math.floor(m / 60) + ':' + pad(m % 60); }
function nombreMes(ym) { return MESES[Number(ym.slice(5)) - 1] + ' ' + ym.slice(0, 4); }
function sumarMesYM(ym, n) { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1 + n, 1, 12); return aISO(d).slice(0, 7); }

function guardarHorasDia(iso, minutos) {
  const ym = iso.slice(0, 7);
  let r = horasDeMes(ym);
  if (!r) { r = { id: 'h-' + ym, mes: ym, dias: {}, updatedAt: 0 }; DB.horas.push(r); }
  r.dias[iso.slice(8)] = { m: minutos, t: Date.now() };
  marcarCambio('horas', r);
}
/* Los días de dos dispositivos se unen: de cada día gana lo último que se anotó */
function unirHoras(l, r) {
  let cambio = false;
  Object.keys(r.dias || {}).forEach(dd => {
    const x = r.dias[dd], y = l.dias[dd];
    if (!y || (x.t || 0) > (y.t || 0)) { l.dias[dd] = x; cambio = true; }
  });
  if ((r.updatedAt || 0) > (l.updatedAt || 0)) l.updatedAt = r.updatedAt;
  return cambio;
}

/* ---------- Revisitas y cursos ---------- */
function nuevoContacto() {

}
const horaAhora = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const contactoPorId = (id) => DB.contactos.find(c => c.id === id && !c.borrado);
const tieneCoord = (c) => typeof c.lat === 'number' && typeof c.lng === 'number';
function ultimaVisita(c) { return (c.visitas || []).reduce((m, v) => v.fecha > m ? v.fecha : m, ''); }
function ordenVisita(a, b) { return (a.fecha + (a.hora || '99:99')).localeCompare(b.fecha + (b.hora || '99:99')); }
function proximaVisita(c) { return (c.recordatorios || []).slice().sort(ordenVisita)[0] || null; }
function diasDesde(iso) { return Math.round((deISO(hoyISO()) - deISO(iso)) / 864e5); }
function haceDias(iso) {
  const n = diasDesde(iso);
  return n === 0 ? 'hoy' : n === 1 ? 'ayer' : n === -1 ? 'mañana' : n > 0 ? 'hace ' + n + ' días' : 'en ' + (-n) + ' días';
}
function textoUltima(c) { const f = ultimaVisita(c); return f ? 'Última visita ' + haceDias(f) : 'Sin visitas registradas'; }
function textoProxima(r) {
  if (!r) return 'Sin visita planeada';

  return 'Próxima visita: ' + (r.fecha === hoyISO() ? 'hoy' : r.fecha === sumarDias(hoyISO(), 1) ? 'mañana' : fechaLarga(r.fecha)) + hr;
}
function visitasPendientes() {

}
const contactosActivos = () => DB.contactos.filter(c => !c.borrado && !c.archivado);
/* Un curso cuenta una vez en el mes si tuvo al menos una visita completada ese mes como curso. Las revisitas no se cuentan. */
function cursosDelMes(ym) {

/* ---------- Ubicación y Google Maps ---------- */
function enlaceMapa(c) {
  if (tieneCoord(c)) return 'https://www.google.com/maps/search/?api=1&query=' + c.lat + ',' + c.lng;
  if (c.mapaUrl) return c.mapaUrl;
  return c.direccion ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.direccion) : '';
}
function enlaceRuta(c) {
  if (tieneCoord(c)) return 'https://www.google.com/maps/dir/?api=1&destination=' + c.lat + ',' + c.lng;
  if (c.direccion) return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(c.direccion);
  return c.mapaUrl || '';
}
function coordValida(lat, lng) { return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180; }
/* Acepta coordenadas escritas, un enlace largo de Google Maps o un enlace corto (este último solo se puede abrir, no mostrar aquí dentro) */
function leerUbicacion(texto) {
  const t = String(texto || '').trim();
  if (!t) return null;
  let m = t.match(/^(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)$/);
  if (!m) m = t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
  if (!m) m = t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if (!m) m = t.match(/[?&](?:q|ll|query|destination|center)=(-?\d+(?:\.\d+)?)(?:,|%2C)(-?\d+(?:\.\d+)?)/i);
  if (m) { const lat = Number(m[1]), lng = Number(m[2]); return coordValida(lat, lng) ? { lat, lng } : null; }
  return /^https?:\/\/\S+$/i.test(t) ? { url: t } : null;
}
function textoUbicacion(c) {
  if (tieneCoord(c)) return 'Ubicación guardada: ' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5);
  if (c.mapaUrl) return 'Enlace de Google Maps guardado';
  return 'Sin ubicación exacta';
}

function vistaHoras() {

  let cal = PR_DIAS.map(d => `<div class="pred-cab">${d}</div>`).join('') + '<span class="pred-dia vacio"></span>'.repeat(hueco);
  for (let d = 1; d <= dias; d++) {
    const iso = ym + '-' + pad(d), m = minutosDia(iso);

  }

  return `<div class="pred-res">

    <div class="pred-cal">${cal}</div>
    ${ym !== hoy.slice(0, 7) ? '<button type="button" class="mini" style="margin-top:10px" data-pred="mes|hoy">Ir al mes actual</button>' : ''}
  </div>
  <h2 class="titulo-seccion">Cursos del mes<span class="cuenta">${cursos.length}</span></h2>
  ${cursos.length ? `<div class="lista">${cursos.map(x => `<button type="button" class="pred-fila" data-pred="ver|${esc(x.c.id)}">

    : '<div class="vacio">Ningún curso con visitas completadas en este mes.</div>'}
  <p class="ayuda" style="margin:8px 6px 0">Un curso cuenta una vez en el mes si tiene al menos una visita completada ese mes. Las revisitas no se cuentan, pero guardan su historial.</p>`;
}

function contactosFiltrados() {
  const f = filtroPred, q = f.q.trim().toLowerCase();
  let l = DB.contactos.filter(c => !c.borrado && (f.tipo === 'archivados' ? c.archivado : !c.archivado));
  if (f.tipo === 'revisita' || f.tipo === 'curso') l = l.filter(c => c.tipo === f.tipo);
  if (f.terr) l = l.filter(c => String(c.territorio || '').trim() === f.terr);
  if (q) l = l.filter(c => [c.nombre, c.direccion, c.territorio, c.notas].join(' ').toLowerCase().includes(q));
  const nom = (a, b) => a.nombre.localeCompare(b.nombre, 'es');
  if (f.orden === 'nombre') return l.sort(nom);
  if (f.orden === 'ultima') return l.sort((a, b) => (ultimaVisita(a) || '0').localeCompare(ultimaVisita(b) || '0') || nom(a, b));
  return l.sort((a, b) => {
    const pa = proximaVisita(a), pb = proximaVisita(b);
    if (pa && pb) return ordenVisita(pa, pb) || nom(a, b);
    return pa ? -1 : pb ? 1 : nom(a, b);
  });
}
function filaContacto(c) {
  const p = proximaVisita(c), atrasada = p && p.fecha < hoyISO();
  return `<button type="button" class="pred-fila" data-pred="ver|${esc(c.id)}">
    <span class="pred-av" style="--c:${c.tipo === 'curso' ? 'var(--verde)' : 'var(--navy)'}">${esc(mono(c.nombre) || '?')}</span>
    <span class="pred-cuerpo"><span class="t">${esc(c.nombre)}</span>
      <span class="meta"><span class="chip ${c.tipo === 'curso' ? 'verde' : ''}">${c.tipo === 'curso' ? 'Curso' : 'Revisita'}</span>${c.territorio ? `<span class="chip">Territorio ${esc(c.territorio)}</span>` : ''}${tieneCoord(c) || c.mapaUrl ? '<span class="chip">📍</span>' : ''}</span>
      ${c.direccion ? `<span class="d">${esc(c.direccion)}</span>` : ''}
      <span class="d">${esc(textoUltima(c))}</span>
      <span class="d ${atrasada ? 'rojo' : ''}">${esc(textoProxima(p))}</span></span>${CHEV}</button>`;
}
function vistaContactos() {

    </div>

    ${l.length ? `<div class="lista">${l.map(filaContacto).join('')}</div>` : `<div class="vacio">${DB.contactos.some(c => !c.borrado) ? 'No hay resultados con ese filtro.' : 'Aún no hay revisitas ni cursos. Agrega el primero.'}</div>`}`;

/* ---------- Día de horas ---------- */
function abrirDia(iso) {
  const m = minutosDia(iso), d = deISO(iso);

  DB.contactos.filter(c => !c.borrado).forEach(c => (c.visitas || []).forEach(v => { if (v.fecha === iso) vis.push({ c, v }); }));
  vis.sort((a, b) => (a.v.hora || '').localeCompare(b.v.hora || ''));

  contactosActivos().forEach(c => (c.recordatorios || []).forEach(r => { if (r.fecha === iso) pend.push({ c, r }); }));

  prEd = { iso };
  abrirHoja(`<h3>${DIAS_SEM[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}</h3>

/* ---------- Mapa para elegir o ver la ubicación (Leaflet, calles de OpenStreetMap o satélite) ---------- */
const LS_MAPA = 'ancianos_pwa_mapa_v1';
let mapaEd = null;
const PIN_SVG = '<svg viewBox="0 0 34 44" width="34" height="44" aria-hidden="true"><path d="M17 43C17 43 3 28 3 16a14 14 0 0 1 28 0c0 12-14 27-14 27Z" fill="#D8483B" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg>';
async function cargarLeaflet() {

function cerrarMapa() {

function mapaPie() {

function mapaPonerPin(lat, lng) {

    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });

async function mapaBuscarLugar(callado) {

    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=es&countrycodes=mx&q=' + encodeURIComponent(q));
    const j = await r.json();

    if (!j.length) { if (!callado) toast('No encontré ese lugar. Mueve el mapa y toca para poner el pin.'); return false; }
    m.mapa.setView([Number(j[0].lat), Number(j[0].lon)], 17);

async function abrirMapa(op) {
  cerrarMapa();
  const ov = document.createElement('div');
  ov.id = 'mapaSel'; ov.className = 'mapa-sel';
  ov.innerHTML = `<div class="mapa-top"><button type="button" class="redondo" data-m="cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="mapa-tit">${esc(op.titulo || 'Ubicación')}</div></div>
    <div class="mapa-busca"><input class="buscador" id="mapaBuscar" type="search" placeholder="Buscar calle, colonia o lugar" value="${esc(op.direccion || '')}" autocomplete="off"><button type="button" class="mini" data-m="buscar">Buscar</button></div>
    <div id="mapaLienzo"></div>
    <div class="mapa-pie"><div class="segmento mapa-capas"><button type="button" data-m="capa|calles">Calles</button><button type="button" data-m="capa|satelite">Satélite</button></div>
      <div class="ayuda" id="mapaTxt" style="margin:8px 4px 0"></div><div class="acciones" id="mapaAcc"></div></div>`;
  document.body.appendChild(ov);

  ov.addEventListener('click', mapaClic);
  $('#mapaBuscar').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); mapaBuscarLugar(false); } });
  try { await cargarLeaflet(); } catch (e) { cerrarMapa(); return toast('No se pudo cargar el mapa. Revisa que la carpeta mapa esté subida a GitHub.', 6000); }
  const m = mapaEd;
  if (!m || m.ov !== ov) return;
  const conPin = coordValida(op.lat, op.lng);
  m.mapa = L.map('mapaLienzo', { zoomControl: true, zoomAnimation: false, markerZoomAnimation: false }).setView(conPin ? [op.lat, op.lng] : [19.3, -96.4], conPin ? 17 : 9);
  m.capas.calles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  m.capas.satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 18, attribution: 'Imágenes © Esri' });
  Object.values(m.capas).forEach(c => c.on('tileerror', () => { if (!m.sinRed) { m.sinRed = true; toast('El mapa necesita internet para mostrarse. Puedes usar Mi ubicación o pegar coordenadas.', 5000); } }));
  let capa = 'calles';
  try { capa = localStorage.getItem(LS_MAPA) === 'satelite' ? 'satelite' : 'calles'; } catch (e) {}
  mapaCapa(capa);
  m.mapa.on('click', (e) => { if (m.modo === 'elegir') mapaPonerPin(e.latlng.lat, e.latlng.lng); });
  if (conPin) mapaPonerPin(op.lat, op.lng);
  mapaPie();
  setTimeout(() => { if (mapaEd === m) m.mapa.invalidateSize(); }, 80);
  if (!conPin && !(op.direccion && await mapaBuscarLugar(true)) && mapaEd === m) mapaGPS(false);
}
function mapaClic(e) {
  const b = e.target.closest('[data-m]');

  const [op, arg] = b.dataset.m.split('|'), m = mapaEd;
  if (op === 'cerrar') return cerrarMapa();

  if (op === 'capa') return mapaCapa(arg);
  if (op === 'gps') return mapaGPS(true);
  if (op === 'mover') { m.modo = 'elegir'; return mapaPie(); }

/* ---------- Operaciones ---------- */
function cambioContacto(c) { marcarCambio('contactos', c); }
function predVolver(v, cid) {
  if (v === 'hoy') return abrirVisitasHoy();
  if (v && v.startsWith('d:')) return abrirDia(v.slice(2));
  return cid ? abrirContacto(cid) : cerrarHoja();
}
function predOperacion(spec, el) {
  const [op, a, b, c3] = spec.split('|');
  switch (op) {
    case 'tab': predTab = a; history.replaceState(null, '', '#predicacion/' + a); return render();
    case 'mes': predMes = a === 'hoy' ? hoyISO().slice(0, 7) : sumarMesYM(predMes, Number(a)); return render();
    case 'dia': return abrirDia(a);
    case 'sumar': {
      const f = $('#formPrDia'); if (!f) return;
      const t = Math.min(1440, (Number(f.h.value) || 0) * 60 + (Number(f.m.value) || 0) + Number(a));
      f.h.value = Math.floor(t / 60); f.m.value = t % 60; return;
    }
    case 'quitarHoras': guardarHorasDia(prEd.iso, 0); cerrarHoja(); render(); return toast('Horas quitadas');
    case 'hoyLista': return abrirVisitasHoy();
    case 'ver': return abrirContacto(a);
    case 'cerrar': return cerrarHoja();
    case 'volver': return predVolver(b, a);
    case 'nuevoC': return abrirContactoForm(null);
    case 'editarC': return abrirContactoForm(a);
    case 'verMapa': {
      const cc = contactoPorId(prVer);
      if (!cc) return;
      return abrirMapa({
        titulo: cc.nombre, lat: cc.lat, lng: cc.lng, direccion: cc.direccion, enlace: enlaceMapa(cc), modo: tieneCoord(cc) ? 'ver' : 'elegir',
        alUsar: (la, ln) => { cc.lat = la; cc.lng = ln; cc.mapaUrl = ''; cambioContacto(cc); render(); toast('Ubicación guardada'); abrirContacto(cc.id); }
      });
    }
    case 'elegirMapa': {
      const f = $('#formPrContacto'), lat = parseFloat(f.lat.value), lng = parseFloat(f.lng.value), ok = coordValida(lat, lng);
      return abrirMapa({
        titulo: f.nombre.value.trim() || 'Ubicación', lat: ok ? lat : null, lng: ok ? lng : null, direccion: f.direccion.value.trim(), modo: 'elegir',
        alUsar: (la, ln) => { prUbicacionEnForm({ lat: la, lng: ln }); toast('Ubicación elegida. Falta guardar.'); }
      });
    }
    case 'gps': {
      if (!navigator.geolocation) return toast('Este dispositivo no permite obtener la ubicación');
      toast('Buscando tu ubicación...', 6000);
      navigator.geolocation.getCurrentPosition(
        p => { prUbicacionEnForm({ lat: Math.round(p.coords.latitude * 1e6) / 1e6, lng: Math.round(p.coords.longitude * 1e6) / 1e6 }); toast('Ubicación tomada. Falta guardar.'); },
        () => toast('No se pudo obtener la ubicación. Revisa el permiso del navegador.'),
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
      return;
    }
    case 'ubiBuscar': {
      const f = $('#formPrContacto');
      const lat = parseFloat(f.lat.value), lng = parseFloat(f.lng.value), q = f.direccion.value.trim() || f.nombre.value.trim();
      const url = coordValida(lat, lng) ? 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng
        : f.mapaUrl.value ? f.mapaUrl.value
        : q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : 'https://www.google.com/maps';
      window.open(url, '_blank', 'noopener');
      return;
    }
    case 'ubiPegar': {
      const u = leerUbicacion($('#prUbiTexto').value);
      if (!u) return toast('No reconocí las coordenadas ni el enlace');
      prUbicacionEnForm(u); $('#prUbiTexto').value = ''; return toast('Ubicación lista. Falta guardar.');
    }
    case 'ubiQuitar': prUbicacionEnForm({}); return;
    case 'recNuevo': return abrirRecordatorio(a, null, b);
    case 'recEditar': return abrirRecordatorio(a, b, c3);
    case 'recBorrar': {
      const c = contactoPorId(prEd.cid); if (!c || !confirm('¿Eliminar este recordatorio?')) return;
      c.recordatorios = c.recordatorios.filter(x => x.id !== prEd.rid); cambioContacto(c);
      render(); toast('Recordatorio eliminado'); return predVolver(prEd.volver, c.id);
    }
    case 'completar': return abrirCompletar(a, b, c3);
    case 'visitaNueva': return abrirVisita(a, null);
    case 'visitaEditar': return abrirVisita(a, b);
    case 'visitaBorrar': {
      const c = contactoPorId(prEd.cid); if (!c || !confirm('¿Eliminar esta visita del historial?')) return;
      c.visitas = c.visitas.filter(x => x.id !== prEd.vid); cambioContacto(c);
      render(); toast('Visita eliminada'); return abrirContacto(c.id);
    }
    case 'aCurso': {
      const c = contactoPorId(a), ym = hoyISO().slice(0, 7);
      const n = (c.visitas || []).filter(v => !v.curso && v.fecha.startsWith(ym)).length;
      if (n) return abrirConvertir(a, n);
      c.tipo = 'curso'; c.cursoDesde = hoyISO(); cambioContacto(c); render(); toast('Ahora es un curso'); return abrirContacto(a);
    }
    case 'aRevisita': {
      const c = contactoPorId(a); c.tipo = 'revisita'; delete c.cursoDesde; cambioContacto(c); render(); toast('Ahora es una revisita. Su historial se conserva.'); return abrirContacto(a);
    }
    case 'archivar': { const c = contactoPorId(a); c.archivado = true; cambioContacto(c); render(); toast('Archivado. Lo encuentras en el filtro Archivados.'); return cerrarHoja(); }
    case 'restaurar': { const c = contactoPorId(a); delete c.archivado; cambioContacto(c); render(); toast('Restaurado'); return abrirContacto(a); }
    case 'eliminarC': {
      const c = contactoPorId(a);
      if (!c || !confirm('¿Eliminar a ' + c.nombre + ' y todo su historial? No se puede deshacer desde la app.')) return;
      c.borrado = true; cambioContacto(c); render(); toast('Eliminado'); return cerrarHoja();
    }
  }
}

function predGuardar(form) {
  const f = new FormData(form), id = form.id, txt = (k) => (f.get(k) || '').trim();
  if (id === 'formPrDia') {
    const m = Math.min(1440, Math.max(0, Math.round((Number(f.get('h')) || 0) * 60 + (Number(f.get('m')) || 0))));
    guardarHorasDia(prEd.iso, m); cerrarHoja(); render();
    return toast(m ? 'Guardado: ' + textoHoras(m) : 'Horas quitadas');
  }
  if (id === 'formPrContacto') {
    const c = prEd.c;
    if (!txt('nombre')) return toast('Escribe el nombre');
    c.nombre = txt('nombre'); c.territorio = txt('territorio'); c.direccion = txt('direccion'); c.notas = txt('notas');
    const lat = parseFloat(f.get('lat')), lng = parseFloat(f.get('lng'));
    c.lat = coordValida(lat, lng) ? lat : null; c.lng = coordValida(lat, lng) ? lng : null;
    c.mapaUrl = /^https?:\/\/\S+$/i.test(txt('mapaUrl')) ? txt('mapaUrl') : '';
    if (prEd.nuevo) {
      c.tipo = f.get('tipo') === 'curso' ? 'curso' : 'revisita';
      if (c.tipo === 'curso') c.cursoDesde = hoyISO();
      c.visitas.push({ id: nuevoId('v'), fecha: txt('primeraFecha') || hoyISO(), hora: txt('primeraHora'), nota: txt('primeraNota'), curso: c.tipo === 'curso', primera: true });
      DB.contactos.push(c);
    }
    cambioContacto(c); render(); toast('Guardado');
    return abrirContacto(c.id);
  }
  const c = contactoPorId(prEd.cid);
  if (!c) return cerrarHoja();
  if (id === 'formPrRec') {
    if (!txt('fecha')) return toast('Elige el día');
    let r = prEd.rid && c.recordatorios.find(x => x.id === prEd.rid);
    if (!r) { r = { id: nuevoId('r') }; c.recordatorios.push(r); }
    r.fecha = txt('fecha'); r.hora = txt('hora'); r.nota = txt('nota');
    cambioContacto(c); render(); toast('Recordatorio guardado');
    return predVolver(prEd.volver, c.id);
  }
  if (id === 'formPrCompletar') {
    if (!txt('fecha')) return toast('Elige el día');
    c.visitas.push({ id: nuevoId('v'), fecha: txt('fecha'), hora: txt('hora'), nota: txt('nota'), curso: c.tipo === 'curso' });
    c.recordatorios = c.recordatorios.filter(x => x.id !== prEd.rid);
    if (txt('sigFecha')) c.recordatorios.push({ id: nuevoId('r'), fecha: txt('sigFecha'), hora: txt('sigHora'), nota: '' });
    cambioContacto(c); render(); toast('Visita registrada en el historial');
    return predVolver(prEd.volver, c.id);
  }
  if (id === 'formPrVisita') {
    if (!txt('fecha')) return toast('Elige el día');
    let v = prEd.vid && c.visitas.find(x => x.id === prEd.vid);
    if (!v) { v = { id: nuevoId('v'), curso: c.tipo === 'curso' }; c.visitas.push(v); }
    else v.curso = f.get('curso') === 'on';
    v.fecha = txt('fecha'); v.hora = txt('hora'); v.nota = txt('nota');
    cambioContacto(c); render(); toast('Visita guardada');
    return abrirContacto(c.id);
  }
  if (id === 'formPrConvertir') {
    c.tipo = 'curso'; c.cursoDesde = hoyISO();
    if (f.get('mes') === 'on') { const ym = hoyISO().slice(0, 7); c.visitas.forEach(v => { if (v.fecha.startsWith(ym)) v.curso = true; }); }
    cambioContacto(c); render(); toast('Ahora es un curso');
    return abrirContacto(c.id);
  }
}

/* Aviso del sistema a la hora de una visita, mientras la app esté abierta o en segundo plano. Con la app cerrada avisa el correo (Avisos.gs). */
function revisarVisitas() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const ahora = new Date(), hoy = hoyISO();
  let cambio = false;
  visitasPendientes().forEach(({ c, r }) => {
    const k = 'visita:' + r.id;
    if (r.fecha !== hoy || !r.hora || AVISADOS[k]) return;
    const cuando = new Date(r.fecha + 'T' + r.hora);
    if (cuando > ahora) return;
    AVISADOS[k] = hoy; cambio = true;
    if (ahora - cuando > 3 * 3600e3) return;
    const cuerpo = r.hora + (c.direccion ? ' · ' + c.direccion : '');
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification('Visita: ' + c.nombre, { body: cuerpo, icon: 'icon-192.png', tag: k }));
    } else new Notification('Visita: ' + c.nombre, { body: cuerpo, icon: 'icon-192.png' });
  });
  const viejo = sumarDias(hoy, -30);
  Object.keys(AVISADOS).forEach(k => { if (k.startsWith('visita:') && AVISADOS[k] < viejo) { delete AVISADOS[k]; cambio = true; } });
  if (cambio) { try { localStorage.setItem(LS_AVISADOS, JSON.stringify(AVISADOS)); } catch (e) {} }
}
setInterval(revisarVisitas, 60000);

/* ================= Sincronización ================= */
let enviando = false, errorSync = '', temporizadorEnvio = null;

function fusionar(remoto, marcarSucio) {
  if (Array.isArray(remoto.horas)) remoto.horas.forEach(r => {
    if (!r || !r.id || !r.dias) return;
    const l = DB.horas.find(x => x.id === r.id);
    if (!l) { DB.horas.push(r); if (marcarSucio && !SUCIOS.horas.includes(r.id)) SUCIOS.horas.push(r.id); }
    else if (unirHoras(l, r) && marcarSucio && !SUCIOS.horas.includes(l.id)) SUCIOS.horas.push(l.id);
  });
  ['tareas', 'publicadores', 'cargos', 'formularios', 'semanaHist', 'contactos'].forEach(tipo => {
    if (!Array.isArray(remoto[tipo])) return;
    const mapa = new Map(DB[tipo].map(x => [x.id, x]));
    remoto[tipo].forEach(r => {
      const l = mapa.get(r.id);
      if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) {
        if (l) Object.keys(l).forEach(k => delete l[k]), Object.assign(l, r);
        else { DB[tipo].push(r); mapa.set(r.id, r); }
        if (marcarSucio && SUCIOS[tipo] && !SUCIOS[tipo].includes(r.id)) SUCIOS[tipo].push(r.id);
      }
    });
  });
  if (remoto.fechas && (remoto.fechas.updatedAt || 0) > (DB.fechas.updatedAt || 0)) {
    DB.fechas = remoto.fechas;
    if (marcarSucio) SUCIOS.fechas = true;
  }
  if (remoto.semana && remoto.semana.id === 'semana' && (remoto.semana.updatedAt || 0) > (DB.semana.updatedAt || 0)) {
    DB.semana = remoto.semana;
    if (marcarSucio) SUCIOS.semana = true;
  }
  normalizar();
  guardarLocal();
}

function normalizar() {
  normalizarSemana();
  /* Una marca de tiempo en el futuro (de una actualización anterior) hacía perder las ediciones; se trata como 0 para que gane la de la hoja. */
  ['horas', 'contactos'].forEach(tipo => { if (!Array.isArray(DB[tipo])) DB[tipo] = []; });
  DB.horas.forEach(h => { if (!h.dias) h.dias = {}; });
  DB.contactos.forEach(c => { if (!Array.isArray(c.visitas)) c.visitas = []; if (!Array.isArray(c.recordatorios)) c.recordatorios = []; });
  ['tareas', 'publicadores', 'cargos', 'formularios', 'contactos'].forEach(tipo => DB[tipo].forEach(r => { if ((r.updatedAt || 0) > 4e12) r.updatedAt = 0; }));
  if ((DB.fechas.updatedAt || 0) > 4e12) DB.fechas.updatedAt = 0;
  DB.tareas.forEach(t => {
    if (['semanal', 'mensual', 'anual'].includes(t.tipo) && !t.proxima) {
      t.proxima = primeraFecha(t);
      t.updatedAt = Date.now();
      if (!SUCIOS.tareas.includes(t.id)) SUCIOS.tareas.push(t.id);
    }
  });
  if (!DB.cargos.some(c => c.id === 'general')) {
    const g = { id: 'general', nombre: 'Pendientes generales', color: '#19B2C2', persona: '', orden: 11 };
    DB.cargos.push(g); g.updatedAt = Date.now();
    if (!SUCIOS.cargos.includes(g.id)) SUCIOS.cargos.push(g.id);
  }
  migrarHermanos();
}

function paquete() {
  const tomar = (tipo) => SUCIOS[tipo].map(id => DB[tipo].find(x => x.id === id)).filter(Boolean);
  return {
    clave: CFG.clave, accion: 'guardar', dispositivo: DISP,
    tareas: tomar('tareas'), publicadores: tomar('publicadores'), cargos: tomar('cargos'),
    fechas: SUCIOS.fechas ? DB.fechas : null,
    semana: SUCIOS.semana ? DB.semana : null,
    semanaHist: tomar('semanaHist'),
    horas: tomar('horas'), contactos: tomar('contactos')
  };
}
/* Cambios que faltan por subir. Los de Mi semana no cuentan si el script de la hoja todavía no los admite, para no reintentar sin fin. */
function pendientesSync() {
  return SUCIOS.tareas.length + SUCIOS.publicadores.length + SUCIOS.cargos.length + (SUCIOS.fechas ? 1 : 0) +
    (servidorSemana ? (SUCIOS.semana ? 1 : 0) + SUCIOS.semanaHist.length : 0) +
    (servidorPred ? SUCIOS.horas.length + SUCIOS.contactos.length : 0);
}

function programarEnvio() {
  refrescarEstadoSync();
  if (!CFG.url) return;
  clearTimeout(temporizadorEnvio);
  temporizadorEnvio = setTimeout(() => sincronizar(false), 1200);
}

/* Un error de sincronización cuyo texto se muestra tal cual en la app */
function falloSync(mensaje) { const e = new Error(mensaje); e.visible = true; return e; }

async function sincronizar(manual) {
  if (!CFG.url) { if (manual) toast('Primero pon la dirección del script'); return; }
  if (enviando) return;
  enviando = true; refrescarEstadoSync();
  const cuerpo = paquete();
  const enviados = {
    tareas: cuerpo.tareas.map(x => [x.id, x.updatedAt]),
    publicadores: cuerpo.publicadores.map(x => [x.id, x.updatedAt]),
    cargos: cuerpo.cargos.map(x => [x.id, x.updatedAt]),
    semanaHist: cuerpo.semanaHist.map(x => [x.id, x.updatedAt]),
    horas: cuerpo.horas.map(x => [x.id, x.updatedAt]),
    contactos: cuerpo.contactos.map(x => [x.id, x.updatedAt])
  };
  const fechasEnviadas = cuerpo.fechas ? cuerpo.fechas.updatedAt : null;
  const semanaEnviada = cuerpo.semana ? cuerpo.semana.updatedAt : null;
  try {
    let resp;
    try { resp = await fetch(CFG.url, { method: 'POST', body: JSON.stringify(cuerpo), redirect: 'follow' }); }
    catch (e) { throw falloSync('Sin conexión con la hoja (' + (e.message || 'la red rechazó la petición') + ')'); }
    if (!resp.ok) throw falloSync('El script respondió con error HTTP ' + resp.status);
    let r;
    try { r = await resp.json(); }
    catch (e) { throw falloSync('La respuesta del script no es válida: revisa que la implementación sea para cualquier persona y que la dirección termine en /exec'); }
    if (!r.ok) {
      const motivos = {
        'Dispositivo pendiente': 'Esperando aprobación en la hoja',
        'Dispositivo bloqueado': 'Este dispositivo está bloqueado',
        'Clave incorrecta': 'Clave incorrecta',
        'Bloqueado temporalmente': 'Acceso bloqueado por intentos fallidos'
      };
      throw falloSync(motivos[r.error] || 'Error del script: ' + (r.error || 'sin detalle'));
    }
    /* Un script de la hoja anterior a Mi semana no devuelve esos datos: se conservan aquí sin borrarlos */
    servidorSemana = !!r.datos && 'semana' in r.datos;
    servidorPred = !!r.datos && 'contactos' in r.datos;
    ['tareas', 'publicadores', 'cargos', ...(servidorSemana ? ['semanaHist'] : []), ...(servidorPred ? ['horas', 'contactos'] : [])].forEach(tipo => {
      enviados[tipo].forEach(([id, ts]) => {
        const reg = DB[tipo].find(x => x.id === id);
        if (reg && reg.updatedAt === ts) SUCIOS[tipo] = SUCIOS[tipo].filter(x => x !== id);
      });
    });
    if (fechasEnviadas && DB.fechas.updatedAt === fechasEnviadas) SUCIOS.fechas = false;
    if (servidorSemana && semanaEnviada && DB.semana.updatedAt === semanaEnviada) SUCIOS.semana = false;
    const escribiendo = document.activeElement && document.activeElement.matches('textarea, input, [contenteditable]');
    fusionar(r.datos, false);
    renovarVencidas();
    CFG.ultimoSync = Date.now(); guardarCfg();
    errorSync = '';
    if (manual) toast('Sincronizado');
    if (!escribiendo && !hoja.classList.contains('abierta')) render();
  } catch (err) {
    errorSync = err.visible ? err.message : 'Error al procesar los datos recibidos (' + err.message + ')';
    if (manual) toast(errorSync);
  } finally {
    enviando = false; refrescarEstadoSync();
    if (pendientesSync() && !errorSync) programarEnvio();
  }
}

/* Envío al cerrar o cambiar de app */
function enviarAlSalir() {
  flushSemana();
  if (!CFG.url) return;
  const cuerpo = paquete();
  if (!cuerpo.tareas.length && !cuerpo.publicadores.length && !cuerpo.cargos.length && !cuerpo.fechas && !cuerpo.semana && !cuerpo.semanaHist.length && !cuerpo.horas.length && !cuerpo.contactos.length) return;
  try { navigator.sendBeacon(CFG.url, new Blob([JSON.stringify(cuerpo)], { type: 'text/plain' })); } catch (e) {}
}
window.addEventListener('pagehide', enviarAlSalir);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    enviarAlSalir();
    ocultaDesde = Date.now();
  } else {
    if (ocultaDesde && Date.now() - ocultaDesde > MINUTOS_PARA_BLOQUEAR * 60000) bloquear();
    ocultaDesde = null;
    const caducados = vaciarVencidos();
    if (renovarVencidas() || caducados) render();
    sincronizar(false);
  }
});
window.addEventListener('online', () => sincronizar(false));
setInterval(() => { if (document.visibilityState === 'visible') sincronizar(false); }, 30000);

/* ================= Recordatorios ================= */
function revisarRecordatorios() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const ahora = new Date();
  tareasActivas().forEach(t => {
    if (!t.recordatorio || AVISADOS[t.id] === t.recordatorio || situacion(t).clase === 'hecha') return;
    if (new Date(t.recordatorio) <= ahora) {
      AVISADOS[t.id] = t.recordatorio;
      localStorage.setItem(LS_AVISADOS, JSON.stringify(AVISADOS));
      const cuerpo = cargoPorId(t.cargo).nombre;
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(reg => reg.showNotification(t.titulo, { body: cuerpo, icon: 'icon-192.png', tag: t.id }));
      } else new Notification(t.titulo, { body: cuerpo, icon: 'icon-192.png' });
    }
  });
}
setInterval(revisarRecordatorios, 60000);

/* ================= Bloqueo con huella o rostro ================= */
const aB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const deB64 = (txt) => Uint8Array.from(atob(txt), c => c.charCodeAt(0));
const retoAleatorio = () => crypto.getRandomValues(new Uint8Array(32));

async function biometriaDisponible() {
  try { return !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch (e) { return false; }
}

async function verificarIdentidad() {
  await navigator.credentials.get({ publicKey: {
    challenge: retoAleatorio(),
    allowCredentials: [{ type: 'public-key', id: deB64(BIO.credId) }],
    userVerification: 'required',
    timeout: 60000
  } });
}

async function activarBiometria() {
  if (!await biometriaDisponible()) return toast('Este celular no tiene huella o rostro disponibles para la app');
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: retoAleatorio(),
      rp: { name: 'JW Mainframe' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'ancianos', displayName: 'JW Mainframe' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000
    } });
    BIO.credId = aB64(cred.rawId);
    localStorage.setItem(LS_BIO, JSON.stringify(BIO));
    toast('Bloqueo activado');
    render();
  } catch (e) { toast('No se activó el bloqueo'); }
}

async function desactivarBiometria() {
  try {
    await verificarIdentidad();
    BIO.credId = null;
    localStorage.setItem(LS_BIO, JSON.stringify(BIO));
    toast('Bloqueo desactivado');
    render();
  } catch (e) { toast('No se pudo verificar tu identidad'); }
}

async function desbloquear() {
  try {
    await verificarIdentidad();
    bloqueada = false;
    render();
  } catch (e) { toast('No se pudo verificar. Intenta de nuevo'); }
}

function bloquear() {
  if (!BIO.credId) return;
  bloqueada = true;
  cerrarHoja();
  render();
}

function vistaBloqueo() {
  vista.innerHTML = `<div class="bloqueo">
    ${cabecera('JW Mainframe', 'CONGREGACIÓN CHICHICAXTLE', 'var(--navy)', 'APP BLOQUEADA')}
    <button class="boton" id="btnDesbloquear">Desbloquear con huella o rostro</button>
    <p>Si tu celular lo permite, también puedes usar su PIN o patrón.</p>
  </div>`;
}

/* ================= Navegación ================= */
function render() {
  flushSemana();
  document.body.classList.toggle('bloqueada', bloqueada);
  if (bloqueada) return vistaBloqueo();
  marcarInsignia();
  const h = (location.hash || '#inicio').slice(1);
  const [ruta, param] = h.split('/');
  // El acceso directo "Colores de JW Library" abre con #colores: se muestra Inicio con la hoja de colores encima.
  if (ruta === 'colores') { history.replaceState(null, '', '#inicio'); render(); abrirColores(); return; }
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('activo',
    a.dataset.r === ruta || (ruta === 'cargo' && a.dataset.r === 'cargos') || (ruta === 'proximas' && a.dataset.r === 'inicio')));
  $('#btnSemana').classList.toggle('activo', ruta === 'semana');
  $('#btnPred').classList.toggle('activo', ruta === 'predicacion');
  if (ruta === 'cargos') vistaCargos();
  else if (ruta === 'cargo' && param) vistaCargo(param);
  else if (ruta === 'necesidades') vistaNecesidades(param);
  else if (ruta === 'papelera') vistaPapelera();
  else if (ruta === 'semana') vistaSemana();
  else if (ruta === 'predicacion') vistaPredicacion(param);
  else if (ruta === 'proximas') vistaProximas();
  else if (ruta === 'historial') vistaHistorial();
  else if (ruta === 'formularios') vistaFormularios();
  else if (ruta === 'ajustes') vistaAjustes();
  else vistaInicio();
}
window.addEventListener('hashchange', () => { cerrarMapa(); cerrarHoja(); render(); window.scrollTo(0, 0); });

/* Colores de JW Library: sistema personal de subrayado de Abrahán */

  { k: '#3a86e8', n: 'Azul', t: 'Pautas mecánicas', d: 'Cómo se hace algo. Pasos, logística, estructura operativa.' },
  { k: '#2eb872', n: 'Verde', t: 'Buenas prácticas', d: 'No es regla estricta, pero son buenas prácticas con fundamento. Recomendaciones que funcionan.' },
  { k: '#e05577', n: 'Rosa', t: 'Experiencia', d: 'Temas serios y casos difíciles aprendidos con el tiempo. Consejos, recomendaciones o formas de atender asuntos.' },
  { k: '#e6c43a', n: 'Amarillo', t: 'Entender · Conocer', d: 'Lo que el texto revela. Significado, contexto, lo que enseña sobre Jehová.', p: '¿Qué me enseña lo que leí?' },
  { k: '#e07830', n: 'Naranja', t: 'Aplicar · Hacer', d: 'Reflexión personal o uso ministerial del texto. Cómo vivirlo o enseñarlo.', p: '¿Cómo lo aplico o uso para ayudar?' }
];

    ${COLORES_JWL.map(c => `<div class="color-fila" style="--k:${c.k}"><span class="color-punto"></span><div>

      ${c.p ? `<span class="color-preg">❝ ${c.p} ❞</span>` : ''}</div></div>`).join('')}
    <div class="acciones" style="margin-top:14px"><button class="boton sec" type="button" id="btnCerrar">Cerrar</button></div>`);

$('#btnColores').addEventListener('click', abrirColores);
$('#btnTema').addEventListener('click', () => { guardarTema(document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro'); render(); });

let temporizadorToast;
function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => t.style.display = 'none', ms || 2200);
}

/* ================= Inicio ================= */
normalizar(); vaciarVencidos(); guardarLocal(); renovarVencidas();
render();
{ const n = pendientesHermanos().filter(x => x.fecha && x.fecha <= hoyISO()).length; if (n) toast(n === 1 ? 'Tienes 1 recordatorio de hermanos para hoy o atrasado' : 'Tienes ' + n + ' recordatorios de hermanos para hoy o atrasados'); }
revisarRecordatorios();
revisarVisitas();
sincronizar(false);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
